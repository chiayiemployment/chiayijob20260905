<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數位永續 薪在嘉義2026 - 面試進度</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    body {
      background-color: #1F1D53;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .circuit-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #292468 0%, #15133C 100%);
      z-index: 0; pointer-events: none;
    }
    .board-container {
      position: relative;
      z-index: 10;
      width: 98vw;
      height: 98vh;
      margin: auto;
      background: #FFFFFF;
      border: 4px solid #003366;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    .header-bar {
      background-color: #0F3A7A;
      color: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .page-indicator { font-size: 1.3rem; font-weight: 700; color: #E0EFFF; }
    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 8px;
      padding: 10px 14px;
      background-color: #EBF1F8;
    }
    .booth-card {
      background: #FFFFFF;
      border: 2px solid #8AB4E2;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .booth-header {
      background-color: #16609C;
      color: #FFFFFF;
      padding: 5px 8px;
      font-size: 1.25rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .booth-body {
      padding: 6px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }
    .status-row {
      display: flex;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .status-current {
      font-size: 1.8rem;
      font-weight: 900;
      color: #108A43;
      margin-bottom: 2px;
    }
    .status-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .dot-green { background-color: #108A43; }
    .dot-orange { background-color: #E66A1F; }
    .text-next { color: #333333; font-size: 1.25rem; }
    .text-pass { color: #444444; font-size: 1.15rem; }
    .footer-bar {
      background-color: #F8FAFC;
      border-top: 2px solid #CBD5E1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 20px;
    }
    .footer-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #333;
    }
    .footer-qr {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-qr img {
      width: 65px; height: 65px;
      border: 1px solid #CCC;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="circuit-bg"></div>
  <div class="board-container">
    <div class="header-bar">
      <div id="boardTitle">數位永續 薪在嘉義2026 - 面試進度 (01-17 攤位)</div>
      <div class="page-indicator" id="pageIndicator">頁次：1/2 (每 15 秒自動翻頁)</div>
    </div>
    <div class="grid-container" id="gridContainer"></div>
    <div class="footer-bar">
      <div class="footer-text">
        💡 溫馨提示：請隨時注意螢幕叫號，過號請洽現場服務台。您也可以掃描右方 QR Code，使用手機即時查詢個人面試進度！
      </div>
      <div class="footer-qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://liff.line.me/2011155577-GFxY8qTy" alt="進度查詢 QR">
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyZD5-SArKxPPT12ZmVBPHOYWKhkndSdT0oCJXI6kgzHZmR20PIR2IZFgOXlky1CMGXcg/exec';
    let allPages = [];
    let currentPageIdx = 0;
    const FLIP_INTERVAL = 15000;

    async function fetchBoardData() {
      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const data = await res.json();
        if (data && data.pages && data.pages.length > 0) {
          allPages = data.pages;
          renderPage(currentPageIdx);
        }
      } catch (e) {
        console.error("資料載入異常:", e);
      }
    }

    function renderPage(index) {
      if (!allPages || allPages.length === 0) return;
      if (index >= allPages.length) index = 0;
      currentPageIdx = index;
      
      const pageData = allPages[index];
      const rangeText = index === 0 ? "(01-17 攤位)" : "(18-34 攤位)";
      document.getElementById('boardTitle').textContent = `數位永續 薪在嘉義2026 - 面試進度 ${rangeText}`;
      document.getElementById('pageIndicator').textContent = `頁次：${pageData.pageIndex}/${pageData.totalPages} (每 15 秒自動翻頁)`;

      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      (pageData.booths || []).forEach(b => {
        const card = document.createElement('div');
        card.className = 'booth-card';
        card.innerHTML = `
          <div class="booth-header">攤位：${b.boothNo} (${b.industry}) [${b.company}]</div>
          <div class="booth-body">
            <div class="status-row status-current">
              <span class="status-dot dot-green"></span>目前面試：${b.current}
            </div>
            <div class="status-row text-next">
              <span style="width:14px; margin-right:6px; display:inline-block;"></span>下一位：${b.next}
            </div>
            <div class="status-row text-pass">
              <span class="status-dot dot-orange"></span>過 號：${b.pass}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    setInterval(() => {
      if (allPages.length > 1) {
        currentPageIdx = (currentPageIdx + 1) % allPages.length;
        renderPage(currentPageIdx);
      }
    }, FLIP_INTERVAL);

    setInterval(fetchBoardData, 20000);
    document.addEventListener('DOMContentLoaded', fetchBoardData);
  </script>
</body>
</html>
