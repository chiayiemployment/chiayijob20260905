<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數位永續 薪在嘉義2026 - 面試進度</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1F1D53;
      color: #333;
      display: flex;
      flex-direction: column;
    }

    .circuit-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #292468 0%, #15133C 100%);
      z-index: 0; pointer-events: none;
    }

    /* 主看板外框（鎖定螢幕高寬，確保底部提示絕不溢出） */
    .board-container {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 頂部標題列（高度固定） */
    .header-bar {
      flex-shrink: 0;
      background-color: #0F3A7A;
      color: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 24px;
      font-size: 1.85rem;
      font-weight: 900;
    }
    .page-indicator { font-size: 1.25rem; font-weight: 700; color: #E0EFFF; }

    /* 4x4 + 1 攤位卡片區（彈性填滿中間空間） */
    .grid-container {
      flex: 1 1 auto;
      min-height: 0; /* 防止子元素撐破 */
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      grid-gap: 6px;
      padding: 6px 12px;
      background-color: #EBF1F8;
    }

    /* 攤位卡片 */
    .booth-card {
      background: #FFFFFF;
      border: 2px solid #8AB4E2;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .booth-header {
      background-color: #16609C;
      color: #FFFFFF;
      padding: 3px 8px;
      font-size: 1.15rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .booth-body {
      padding: 4px 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
    }

    .status-row {
      display: flex;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-current {
      font-size: 1.55rem;
      font-weight: 900;
      color: #108A43;
    }
    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .dot-green { background-color: #108A43; }
    .dot-orange { background-color: #E66A1F; }
    .text-next { color: #333333; font-size: 1.1rem; }
    .text-pass { color: #555555; font-size: 1.05rem; }

    /* 🌟 底部提示列（強制 flex-shrink: 0 確保 100% 呈現） */
    .footer-bar {
      flex-shrink: 0;
      background-color: #F8FAFC;
      border-top: 2px solid #CBD5E1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 18px;
      height: 58px;
    }
    .footer-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #333;
    }
    .footer-qr {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-qr img {
      width: 48px; height: 48px;
      border: 1px solid #CCC;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="circuit-bg"></div>
  <div class="board-container">
    <div class="header-bar">
      <div id="boardTitle">數位永續 薪在嘉義2026 - 面試進度 (01-17 攤位)</div>
      <div class="page-indicator" id="pageIndicator">頁次：1/2 (每 15 秒自動翻頁)</div>
    </div>
    <div class="grid-container" id="gridContainer"></div>
    <div class="footer-bar">
      <div class="footer-text">
        💡 溫馨提示：請隨時注意螢幕叫號，過號請洽現場服務台。您也可以掃描右方 QR Code，使用手機即時查詢所有廠商進度！
      </div>
      <div class="footer-qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://joying830.github.io/interview_system/liff_interview.html" alt="進度查詢 QR">
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwnnmdsTZddL6qNrR6XajvgaggxlwvPUQxrhGifLoGRdkafG_4m-ETHprAOtQHYvRUziw/exec';
    let allPages = [];
    let currentPageIdx = 0;
    const FLIP_INTERVAL = 15000;

    async function fetchBoardData() {
      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const data = await res.json();
        if (data && data.pages && data.pages.length > 0) {
          allPages = data.pages;
          renderPage(currentPageIdx);
        }
      } catch (e) {
        console.error("資料載入異常:", e);
      }
    }

    function renderPage(index) {
      if (!allPages || allPages.length === 0) return;
      if (index >= allPages.length) index = 0;
      currentPageIdx = index;
      
      const pageData = allPages[index];
      const rangeText = index === 0 ? "(01-17 攤位)" : "(18-34 攤位)";
      document.getElementById('boardTitle').textContent = `數位永續 薪在嘉義2026 - 面試進度 ${rangeText}`;
      document.getElementById('pageIndicator').textContent = `頁次：${pageData.pageIndex}/${pageData.totalPages} (每 15 秒自動翻頁)`;

      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      (pageData.booths || []).forEach(b => {
        const card = document.createElement('div');
        card.className = 'booth-card';
        // 🌟 移除 []，格式為：攤位 01 ｜ 新悦花園酒店
        card.innerHTML = `
          <div class="booth-header">攤位 ${b.boothNo} ｜ ${b.company}</div>
          <div class="booth-body">
            <div class="status-row status-current">
              <span class="status-dot dot-green"></span>目前面試：${b.current}
            </div>
            <div class="status-row text-next">
              <span style="width:12px; margin-right:6px; display:inline-block;"></span>下一位：${b.next}
            </div>
            <div class="status-row text-pass">
              <span class="status-dot dot-orange"></span>過 號：${b.pass}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    setInterval(() => {
      if (allPages.length > 1) {
        currentPageIdx = (currentPageIdx + 1) % allPages.length;
        renderPage(currentPageIdx);
      }
    }, FLIP_INTERVAL);

    setInterval(fetchBoardData, 15000);
    document.addEventListener('DOMContentLoaded', fetchBoardData);
  </script>
</body>
</html>
