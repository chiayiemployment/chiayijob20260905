<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數位永續 薪在嘉義2026 - 面試進度</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1F1D53;
      color: #333;
      display: flex;
      flex-direction: column;
    }

    .circuit-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #292468 0%, #15133C 100%);
      z-index: 0; pointer-events: none;
    }

    .board-container {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header-bar {
      flex-shrink: 0;
      background-color: #0F3A7A;
      color: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 24px;
      font-size: 1.85rem;
      font-weight: 900;
    }
    .page-indicator { font-size: 1.25rem; font-weight: 700; color: #E0EFFF; }

    .grid-container {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      grid-gap: 6px;
      padding: 6px 12px;
      background-color: #EBF1F8;
    }

    .booth-card {
      background: #FFFFFF;
      border: 2px solid #8AB4E2;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .booth-header {
      background-color: #16609C;
      color: #FFFFFF;
      padding: 3px 8px;
      font-size: 1.15rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .booth-body {
      padding: 4px 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
    }

    .status-row {
      display: flex;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-current {
      font-size: 1.55rem;
      font-weight: 900;
      color: #108A43;
    }
    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .dot-green { background-color: #108A43; }
    .dot-orange { background-color: #E66A1F; }
    .text-next { color: #333333; font-size: 1.1rem; }
    .text-pass { color: #555555; font-size: 1.05rem; }
    .pass-name-text { transition: opacity 0.25s ease-in-out; }

    .footer-bar {
      flex-shrink: 0;
      background-color: #F8FAFC;
      border-top: 2px solid #CBD5E1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 18px;
      height: 58px;
    }
    .footer-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #333;
    }
    .footer-qr {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-qr img {
      width: 48px; height: 48px;
      border: 1px solid #CCC;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="circuit-bg"></div>
  <div class="board-container">
    <div class="header-bar">
      <div id="boardTitle">數位永續 薪在嘉義2026 - 面試進度 (01-16 攤位)</div>
      <div class="page-indicator" id="pageIndicator">頁次：1/2 (每 15 秒自動翻頁)</div>
    </div>
    <div class="grid-container" id="gridContainer"></div>
    <div class="footer-bar">
      <div class="footer-text">
        💡 溫馨提示：請隨時注意螢幕叫號，過號請洽「面試報到處」。您也可以掃描右方 QR Code，使用手機即時查詢所有廠商進度！
      </div>
      <div class="footer-qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://chiayiemployment.github.io/chiayijob20260905/liff_interview.html" alt="進度查詢 QR">
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxRySlV7lWM3bQ5JeYDNTQFTqXhEv-YU-TAeBd-QvLxSlM76VwdEtHuO7x9ieuTPXYohw/exec';
    let allPages = [];
    let currentPageIdx = 0;
    const FLIP_INTERVAL = 15000;
    let passIntervalTimers = [];

    // 🌟 每 5 秒在背景抓取最新資料
    async function fetchBoardData() {
      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const data = await res.json();
        if (data && data.pages && data.pages.length > 0) {
          const isFirst = (allPages.length === 0);
          allPages = data.pages;
          if (isFirst) {
            renderPage(0);
          } else {
            // 原位即時刷新當前頁面的各個卡片文字，不重繪整個 DOM
            liveUpdateCurrentPage();
          }
        }
      } catch (e) {
        console.error("資料載入異常:", e);
      }
    }

    function clearPassTimers() {
      passIntervalTimers.forEach(id => clearInterval(id));
      passIntervalTimers = [];
    }

    function renderPage(index) {
      if (!allPages || allPages.length === 0) return;
      if (index >= allPages.length) index = 0;
      currentPageIdx = index;
      clearPassTimers();
      
      const pageData = allPages[index];
      const rangeText = index === 0 ? "(01-16 攤位)" : "(17-34 攤位)";
      document.getElementById('boardTitle').textContent = `數位永續 薪在嘉義2026 - 面試進度 ${rangeText}`;
      document.getElementById('pageIndicator').textContent = `頁次：${pageData.pageIndex}/${pageData.totalPages} (每 15 秒自動翻頁)`;

      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      (pageData.booths || []).forEach(b => {
        const card = document.createElement('div');
        card.className = 'booth-card';
        card.innerHTML = `
          <div class="booth-header">攤位 ${b.boothNo} ｜ ${b.company}</div>
          <div class="booth-body">
            <div class="status-row status-current">
              <span class="status-dot dot-green"></span>
              <span>目前面試：<span id="cur-txt-${b.boothNo}">${b.current}</span></span>
            </div>
            <div class="status-row text-next">
              <span style="width:12px; margin-right:6px; display:inline-block;"></span>
              <span>下一位：<span id="nxt-txt-${b.boothNo}">${b.next}</span></span>
            </div>
            <div class="status-row text-pass">
              <span class="status-dot dot-orange"></span>
              <span id="pass-lbl-${b.boothNo}">過 號：</span>
              <span class="pass-name-text" id="pass-txt-${b.boothNo}">無</span>
            </div>
          </div>
        `;
        container.appendChild(card);

        setupBoothPassCycle(b);
      });
    }

    // 🌟 原位無感極速刷新（每 5 秒直接替換文字，完全不閃爍）
    function liveUpdateCurrentPage() {
      if (!allPages || allPages.length === 0) return;
      const pageData = allPages[currentPageIdx];
      if (!pageData) return;

      (pageData.booths || []).forEach(b => {
        const curEl = document.getElementById(`cur-txt-${b.boothNo}`);
        const nxtEl = document.getElementById(`nxt-txt-${b.boothNo}`);
        if (curEl && curEl.textContent !== b.current) curEl.textContent = b.current;
        if (nxtEl && nxtEl.textContent !== b.next) nxtEl.textContent = b.next;
      });
    }

    function setupBoothPassCycle(booth) {
      const lblEl = document.getElementById(`pass-lbl-${booth.boothNo}`);
      const txtEl = document.getElementById(`pass-txt-${booth.boothNo}`);
      if (!lblEl || !txtEl) return;

      const list = booth.passList || [];
      const total = list.length;
      if (total === 0) {
        lblEl.textContent = '過 號：';
        txtEl.textContent = '無';
        return;
      }

      const chunkSize = 3;
      const totalGroups = Math.ceil(total / chunkSize);
      lblEl.textContent = total > 3 ? `過號(共${total}人)：` : '過 號：';

      let currentGroup = 0;
      const showGroup = (idx) => {
        const start = idx * chunkSize;
        const chunk = list.slice(start, start + chunkSize);
        txtEl.style.opacity = '0';
        setTimeout(() => {
          txtEl.textContent = chunk.join(', ');
          txtEl.style.opacity = '1';
        }, 150);
      };

      showGroup(0);

      if (totalGroups > 1) {
        const intervalTime = Math.max(2500, Math.floor(15000 / totalGroups));
        const timerId = setInterval(() => {
          currentGroup = (currentGroup + 1) % totalGroups;
          showGroup(currentGroup);
        }, intervalTime);
        passIntervalTimers.push(timerId);
      }
    }

    // 每 30 秒翻頁
    setInterval(() => {
      if (allPages.length > 1) {
        currentPageIdx = (currentPageIdx + 1) % allPages.length;
        renderPage(currentPageIdx);
      }
    }, FLIP_INTERVAL);

    // 🌟 每 5 秒後台抓一次最新資料並即時原位刷新
    setInterval(fetchBoardData, 5000);
    document.addEventListener('DOMContentLoaded', fetchBoardData);
  </script>
</body>
</html>
