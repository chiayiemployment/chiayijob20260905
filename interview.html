<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數位永續 薪在嘉義2026 - 面試進度</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    body {
      background-color: #1F1D53;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 電路科技底圖[cite: 5, 8] */
    .circuit-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #292468 0%, #15133C 100%);
      z-index: 0; pointer-events: none;
    }

    /* 主看板容器 */
    .board-container {
      position: relative;
      z-index: 10;
      width: 98vw;
      height: 98vh;
      margin: auto;
      background: #FFFFFF;
      border: 4px solid #003366;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    /* 頂部深藍標題列 */
    .header-bar {
      background-color: #0F3A7A;
      color: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .page-indicator { font-size: 1.3rem; font-weight: 700; color: #E0EFFF; }

    /* 攤位 4x4 卡片網格[cite: 3] */
    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 8px;
      padding: 10px 14px;
      background-color: #EBF1F8;
    }

    /* 攤位卡片樣式[cite: 3] */
    .booth-card {
      background: #FFFFFF;
      border: 2px solid #8AB4E2;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .booth-header {
      background-color: #16609C;
      color: #FFFFFF;
      padding: 5px 8px;
      font-size: 1.25rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .booth-body {
      padding: 6px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }

    /* 面試狀態列[cite: 3] */
    .status-row {
      display: flex;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .status-current {
      font-size: 1.8rem;
      font-weight: 900;
      color: #108A43; /* 綠色大字[cite: 3] */
      margin-bottom: 2px;
    }
    .status-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .dot-green { background-color: #108A43; } /*[cite: 3] */
    .dot-orange { background-color: #E66A1F; } /*[cite: 3] */

    .text-next { color: #333333; font-size: 1.25rem; }
    .text-pass { color: #444444; font-size: 1.15rem; }

    /* 底部提示與 QR Code 列[cite: 3] */
    .footer-bar {
      background-color: #F8FAFC;
      border-top: 2px solid #CBD5E1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 20px;
    }
    .footer-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #333;
    }
    .footer-qr {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-qr img {
      width: 65px; height: 65px;
      border: 1px solid #CCC;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="circuit-bg"></div>

  <div class="board-container">
    <!-- 頂部標題[cite: 3] -->
    <div class="header-bar">
      <div id="boardTitle">大型聯合徵才活動 - 即時叫號看板 (A01-A17 攤位)</div>
      <div class="page-indicator" id="pageIndicator">頁次：1/2 (每 15 秒自動翻頁)</div>
    </div>

    <!-- 4x4 攤位卡片區[cite: 3] -->
    <div class="grid-container" id="gridContainer">
      <!-- 卡片由 JS 動態填入 -->
    </div>

    <!-- 底部資訊與 QR Code[cite: 3] -->
    <div class="footer-bar">
      <div class="footer-text">
        💡 溫馨提示：請隨時注意螢幕叫號，過號請洽現場服務台。您也可以掃描右方 QR Code，使用手機即時查詢個人面試進度！[cite: 3]
      </div>
      <div class="footer-qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://liff.line.me/2010785535-D0SuLqWN" alt="進度查詢 QR">
      </div>
    </div>
  </div>

  <script>
    // 🌟 請在此填入您的 GAS Web App 部署網址（結尾加 ?type=json）
    const API_URL = 'YOUR_GAS_DEPLOYMENT_URL_HERE';

    let allPages = [];
    let currentPageIdx = 0;
    const FLIP_INTERVAL = 15000; // 每 15 秒自動翻頁[cite: 3]

    async function fetchBoardData() {
      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);[cite: 5]
        const data = await res.json();
        if (data && data.pages) {
          allPages = data.pages;
          renderPage(currentPageIdx);
        }
      } catch (e) {
        console.error("資料載入失敗:", e);
      }
    }

    function renderPage(index) {
      if (!allPages || allPages.length === 0) return;
      const pageData = allPages[index];

      // 更新頂部標題與頁次[cite: 3]
      const rangeText = index === 0 ? "(A01-A17 攤位)" : "(A18-A34 攤位)";
      document.getElementById('boardTitle').textContent = `大型聯合徵才活動 - 即時叫號看板 ${rangeText}`;
      document.getElementById('pageIndicator').textContent = `頁次：${pageData.pageIndex}/${pageData.totalPages} (每 15 秒自動翻頁)`;

      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      // 渲染攤位卡片[cite: 3]
      pageData.booths.forEach(b => {
        const card = document.createElement('div');
        card.className = 'booth-card';
        card.innerHTML = `
          <div class="booth-header">攤位：${b.boothNo} (${b.industry}) [${b.company}]</div>
          <div class="booth-body">
            <div class="status-row status-current">
              <span class="status-dot dot-green"></span>目前面試：${b.current}
            </div>
            <div class="status-row text-next">
              <span style="width:14px; margin-right:6px;"></span>下一位：${b.next}
            </div>
            <div class="status-row text-pass">
              <span class="status-dot dot-orange"></span>過 號：${b.pass}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 定時翻頁與更新[cite: 5]
    setInterval(() => {
      if (allPages.length > 1) {
        currentPageIdx = (currentPageIdx + 1) % allPages.length;
        renderPage(currentPageIdx);
      }
    }, FLIP_INTERVAL);

    // 每 20 秒自後台抓取最新資料[cite: 5]
    setInterval(fetchBoardData, 20000);

    // 首次載入[cite: 5]
    fetchBoardData();
  </script>
</body>
</html>
