<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數位永續 薪在嘉義2026 - 面試進度</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1F1D53;
      color: #333;
      display: flex;
      flex-direction: column;
    }

    .circuit-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #292468 0%, #15133C 100%);
      z-index: 0; pointer-events: none;
    }

    .board-container {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header-bar {
      flex-shrink: 0;
      background-color: #0F3A7A;
      color: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 24px;
      font-size: 1.85rem;
      font-weight: 900;
    }
    .page-indicator { font-size: 1.25rem; font-weight: 700; color: #E0EFFF; }

    .grid-container {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      grid-gap: 6px;
      padding: 6px 12px;
      background-color: #EBF1F8;
    }

    .booth-card {
      background: #FFFFFF;
      border: 2px solid #8AB4E2;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .booth-header {
      background-color: #16609C;
      color: #FFFFFF;
      padding: 3px 8px;
      font-size: 1.15rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .booth-body {
      padding: 4px 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
    }

    .status-row {
      display: flex;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-current {
      font-size: 1.55rem;
      font-weight: 900;
      color: #108A43;
    }
    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .dot-green { background-color: #108A43; }
    .dot-orange { background-color: #E66A1F; }
    .text-next { color: #333333; font-size: 1.1rem; }
    .text-pass { color: #555555; font-size: 1.05rem; }

    /* 過號人名切換平滑效果 */
    .pass-name-text {
      transition: opacity 0.3s ease-in-out;
    }

    .footer-bar {
      flex-shrink: 0;
      background-color: #F8FAFC;
      border-top: 2px solid #CBD5E1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 18px;
      height: 58px;
    }
    .footer-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #333;
    }
    .footer-qr {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-qr img {
      width: 48px; height: 48px;
      border: 1px solid #CCC;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="circuit-bg"></div>
  <div class="board-container">
    <div class="header-bar">
      <div id="boardTitle">數位永續 薪在嘉義2026 - 面試進度 (01-17 攤位)</div>
      <div class="page-indicator" id="pageIndicator">頁次：1/2 (每 30 秒自動翻頁)</div>
    </div>
    <div class="grid-container" id="gridContainer"></div>
    <div class="footer-bar">
      <div class="footer-text">
        💡 溫馨提示：請隨時注意螢幕叫號，過號請洽現場服務台。您也可以掃描右方 QR Code，使用手機即時查詢所有廠商進度！
      </div>
      <div class="footer-qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://joying830.github.io/interview_system/liff_interview.html" alt="進度查詢 QR">
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby5vgpIwWBubdqxmTIa1qgnIb0cMSPfOrJT5rn3tmlU8oJLWI3Nz0zL6wKc5fegRk9Qow/exec';
    let allPages = [];
    let currentPageIdx = 0;
    const FLIP_INTERVAL = 30000; // 15 秒大螢幕整頁翻頁
    const PASS_FLIP_INTERVAL = 10000; // 5 秒過號名單小輪播

    // 紀錄每個攤位當前的過號輪播組別
    let passRotationMap = {};

    async function fetchBoardData() {
      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const data = await res.json();
        if (data && data.pages && data.pages.length > 0) {
          allPages = data.pages;
          renderPage(currentPageIdx);
        }
      } catch (e) {
        console.error("資料載入異常:", e);
      }
    }

    function renderPage(index) {
      if (!allPages || allPages.length === 0) return;
      if (index >= allPages.length) index = 0;
      currentPageIdx = index;
      
      const pageData = allPages[index];
      const rangeText = index === 0 ? "(01-17 攤位)" : "(18-34 攤位)";
      document.getElementById('boardTitle').textContent = `數位永續 薪在嘉義2026 - 面試進度 ${rangeText}`;
      document.getElementById('pageIndicator').textContent = `頁次：${pageData.pageIndex}/${pageData.totalPages} (每 15 秒自動翻頁)`;

      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      (pageData.booths || []).forEach(b => {
        const passList = b.passList || [];
        const totalPassCount = passList.length;

        // 計算目前該攤位顯示第幾組 (每組 3 人)
        if (passRotationMap[b.boothNo] === undefined) {
          passRotationMap[b.boothNo] = 0;
        }

        const card = document.createElement('div');
        card.className = 'booth-card';
        card.id = `booth-card-${b.boothNo}`;

        card.innerHTML = `
          <div class="booth-header">攤位 ${b.boothNo} ｜ ${b.company}</div>
          <div class="booth-body">
            <div class="status-row status-current">
              <span class="status-dot dot-green"></span>目前面試：${b.current}
            </div>
            <div class="status-row text-next">
              <span style="width:12px; margin-right:6px; display:inline-block;"></span>下一位：${b.next}
            </div>
            <div class="status-row text-pass">
              <span class="status-dot dot-orange"></span>
              <span class="pass-label-area" id="pass-label-${b.boothNo}">過 號：</span>
              <span class="pass-name-text" id="pass-names-${b.boothNo}">無</span>
            </div>
          </div>
        `;
        container.appendChild(card);

        // 立即更新過號文字
        updateBoothPassText(b);
      });
    }

    // 更新單一卡片內的過號人名與標題 (一次顯示 3 位)
    function updateBoothPassText(booth) {
      const passLabelEl = document.getElementById(`pass-label-${booth.boothNo}`);
      const passNamesEl = document.getElementById(`pass-names-${booth.boothNo}`);
      if (!passLabelEl || !passNamesEl) return;

      const passList = booth.passList || [];
      const totalCount = passList.length;

      if (totalCount === 0) {
        passLabelEl.textContent = '過 號：';
        passNamesEl.textContent = '無';
        return;
      }

      // 將名單切分成每組 3 人
      const chunkSize = 3;
      const totalGroups = Math.ceil(totalCount / chunkSize);
      const currentGroupIdx = passRotationMap[booth.boothNo] % totalGroups;

      const start = currentGroupIdx * chunkSize;
      const currentChunk = passList.slice(start, start + chunkSize);

      // 若有多人過號，標註總人數以提示求職者
      passLabelEl.textContent = totalCount > 3 ? `過號(共${totalCount}人)：` : '過 號：';

      // 淡出再淡入效果
      passNamesEl.style.opacity = '0';
      setTimeout(() => {
        passNamesEl.textContent = currentChunk.join(', ');
        passNamesEl.style.opacity = '1';
      }, 150);
    }

    // 🌟 每 5 秒針對各卡片的過號名單推進一組 (5秒小輪播)
    setInterval(() => {
      if (!allPages || allPages.length === 0) return;
      const currentPageData = allPages[currentPageIdx];
      if (!currentPageData) return;

      (currentPageData.booths || []).forEach(b => {
        const passList = b.passList || [];
        if (passList.length > 3) {
          passRotationMap[b.boothNo] = (passRotationMap[b.boothNo] || 0) + 1;
          updateBoothPassText(b);
        }
      });
    }, PASS_FLIP_INTERVAL);

    // 每 30 秒整頁自動大翻頁
    setInterval(() => {
      if (allPages.length > 1) {
        currentPageIdx = (currentPageIdx + 1) % allPages.length;
        renderPage(currentPageIdx);
      }
    }, FLIP_INTERVAL);

    // 每 15 秒同步一次最新資料
    setInterval(fetchBoardData, 15000);
    document.addEventListener('DOMContentLoaded', fetchBoardData);
  </script>
</body>
</html>
