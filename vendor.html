<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>數位永續 薪在嘉義_廠商面試系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Noto Sans TC', sans-serif; background-color: #1F1D53; color: #FFFFFF; min-height: 100vh; }
.form-container { 
  background: linear-gradient(135deg, rgba(31, 29, 83, 0.95) 0%, rgba(76, 35, 124, 0.85) 100%); 
  border-radius: 24px; 
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); 
  border: 2px solid #28C4FF; 
}
.submit-btn { 
  background: linear-gradient(135deg, #AC3FFF, #6A1BCB); 
  border-radius: 14px; 
  color: #FFFFFF; 
  font-weight: 700; 
}
select, input[type="password"] { 
  background-color: rgba(31, 29, 83, 0.9) !important; 
  border: 2px solid #A48DCD !important; 
  color: #FFFFFF !important; 
}
select option {
  background-color: #1F1D53;
  color: #FFFFFF;
}
.spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #28C4FF; width: 2rem; height: 2rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">
<div class="form-container p-6 sm:p-10 max-w-lg w-full text-center space-y-6">
  
  <!-- 表頭區塊 -->
  <div class="space-y-2 border-b border-purple-400/20 pb-5">
    <div class="text-xl font-bold text-cyan-300 tracking-wider uppercase">
      數位永續 薪在嘉義
    </div>
    <div class="text-xl sm:text-2xl font-extrabold text-white tracking-wide">
      2026 大嘉義就業博覽會
    </div>
    <div class="text-2xl sm:text-3xl font-black text-amber-300 pt-1">
      廠商面試管理系統
    </div>
  </div>

  <!-- 表單輸入區塊 -->
  <div id="authBox" class="space-y-5 pt-2">
    
    <!-- 選擇廠商下拉式選單 -->
    <div class="text-left space-y-2">
      <label for="companySelect" class="text-lg font-bold text-purple-200 block">
        請選擇公司名稱
      </label>
      <select id="companySelect" class="w-full px-4 py-3 text-lg font-bold rounded-xl border-2 border-circuitCyan focus:outline-none focus:border-amber-300">
        <option value="" disabled selected>載入廠商清單中...</option>
      </select>
    </div>

    <!-- 輸入 8 位數密碼 (支援 Enter 鍵解鎖) -->
    <div class="text-left space-y-2">
      <label for="pinInput" class="text-lg font-bold text-purple-200 block">
        請輸入 8 位數 密碼
      </label>
      <input 
        type="password" 
        id="pinInput" 
        maxlength="8" 
        placeholder="請輸入 8 位數密碼" 
        onkeypress="handleKeyPress(event)"
        class="w-full text-center text-2xl tracking-widest py-3 font-bold rounded-xl border-2 border-circuitCyan focus:outline-none focus:border-amber-300">
    </div>

    <button onclick="submitPinAuth()" id="loginBtn" class="submit-btn w-full py-4 text-xl sm:text-2xl font-bold shadow-xl hover:opacity-90 transition mt-2">
     開啟面試資料
    </button>
  </div>

  <!-- 載入中與手動按鈕區塊 -->
  <div id="loadingBox" class="hidden py-6 space-y-3">
    <span class="spinner"></span>
    <p id="loadingStatusText" class="text-xl font-bold text-cyan-300">驗證中，請稍候...</p>
    <div id="manualRedirectLink" class="hidden mt-4">
      <p class="text-sm text-gray-300">如未自動跳轉，請點擊下方按鈕：</p>
      <a id="directSheetBtn" href="#" target="_blank" class="inline-block mt-3 px-6 py-3 bg-green-600 text-white font-bold text-lg rounded-xl hover:bg-green-500 transition">點此開啟 Google 試算表</a>
    </div>
  </div>

</div>

<script>
// ⚠️ 請填入您的「廠商試算表快速驗證跳轉 API」發布後的 Web App 網址
const VENDOR_API_URL = 'https://script.google.com/macros/s/AKfycbwRDu5o_vzv-eAV-QmI-LAQhMLzOOd7r9fSrBdI0n9TJ36m_lmGwGXnj-VOr0DZZ2lniQ/exec';

document.addEventListener('DOMContentLoaded', () => {
  loadCompanyList();
});

/**
 * 1. 向 GAS API 動態讀取密碼總表中的公司清單
 */
function loadCompanyList() {
  const selectElem = document.getElementById('companySelect');
  
  // 使用 JSONP 跨網域讀取公司清單
  const callbackName = 'onCompanyListLoaded';
  window[callbackName] = function(response) {
    if (response && response.success && response.companyList) {
      selectElem.innerHTML = '<option value="" disabled selected>-- 請選擇公司名稱 --</option>';
      response.companyList.forEach(compName => {
        const option = document.createElement('option');
        option.value = compName;
        option.textContent = compName;
        selectElem.appendChild(option);
      });

      // 自動偵測 URL 中的 company 參數預選廠商
      const urlParams = new URLSearchParams(window.location.search);
      const companyParam = urlParams.get('company') ? decodeURIComponent(urlParams.get('company')).trim() : '';
      if (companyParam) {
        for (let i = 0; i < selectElem.options.length; i++) {
          if (selectElem.options[i].value.includes(companyParam) || companyParam.includes(selectElem.options[i].value)) {
            selectElem.selectedIndex = i;
            break;
          }
        }
      }
    } else {
      selectElem.innerHTML = '<option value="" disabled>載入廠商失敗，請重新整理</option>';
    }
    // 移除動態 Script 標籤
    delete window[callbackName];
    const scriptTag = document.getElementById(callbackName);
    if (scriptTag) scriptTag.remove();
  };

  const script = document.createElement('script');
  script.id = callbackName;
  script.src = `${VENDOR_API_URL}?action=getCompanyList&callback=${callbackName}`;
  document.body.appendChild(script);
}

/**
 * ⌨️ 監聽 Enter 鍵，按下後自動解鎖
 */
function handleKeyPress(event) {
  if (event.key === 'Enter' || event.keyCode === 13) {
    event.preventDefault();
    submitPinAuth();
  }
}

/**
 * 2. 向 GAS API 發送密碼驗證與取得試算表網址
 */
function submitPinAuth() {
  const selectElem = document.getElementById('companySelect');
  const selectedCompany = selectElem.value;
  const pinInput = document.getElementById('pinInput').value.trim();

  if (!selectedCompany) {
    alert('請先選擇公司名稱！');
    return;
  }
  if (pinInput.length !== 8) {
    alert('請輸入完整的 8 位數 密碼！');
    return;
  }

  const authBox = document.getElementById('authBox');
  const loadingBox = document.getElementById('loadingBox');
  const loadingText = document.getElementById('loadingStatusText');

  authBox.classList.add('hidden');
  loadingBox.classList.remove('hidden');
  loadingText.innerText = '正在驗證密碼並搜尋試算表...';

  // 使用 JSONP 發送驗證請求
  const callbackName = 'onVendorAuthVerified';
  window[callbackName] = function(response) {
    if (response && response.success && response.sheetUrl) {
      loadingText.innerText = `驗證成功！正在開啟【${response.company}】面試資料...`;
      document.getElementById('directSheetBtn').href = response.sheetUrl;
      document.getElementById('manualRedirectLink').classList.remove('hidden');

      // 0.5 秒後自動跳轉至試算表網址
      setTimeout(() => {
        window.location.href = response.sheetUrl;
      }, 500);
    } else {
      alert(response.message || '🔒 密碼錯誤！請輸入貴公司專屬的 8 位數密碼。');
      authBox.classList.remove('hidden');
      loadingBox.classList.add('hidden');
    }

    delete window[callbackName];
    const scriptTag = document.getElementById(callbackName);
    if (scriptTag) scriptTag.remove();
  };

  const script = document.createElement('script');
  script.id = callbackName;
  script.src = `${VENDOR_API_URL}?action=getVendorSheetUrl&company=${encodeURIComponent(selectedCompany)}&pin=${encodeURIComponent(pinInput)}&callback=${callbackName}`;
  document.body.appendChild(script);
}
</script>
</body>
</html>
