<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>數位永續 薪在嘉義 2026大嘉義就業博覽會</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Noto Sans TC', sans-serif; background-color: #1F1D53; color: #FFFFFF; min-height: 100vh; }
.form-container { 
  background: linear-gradient(135deg, rgba(31, 29, 83, 0.95) 0%, rgba(76, 35, 124, 0.85) 100%); 
  border-radius: 24px; 
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); 
  border: 2px solid #28C4FF; 
}
.submit-btn { 
  background: linear-gradient(135deg, #AC3FFF, #6A1BCB); 
  border-radius: 14px; 
  color: #FFFFFF; 
  font-weight: 700; 
}
select, input[type="password"] { 
  background-color: rgba(31, 29, 83, 0.9) !important; 
  border: 2px solid #A48DCD !important; 
  color: #FFFFFF !important; 
}
select option {
  background-color: #1F1D53;
  color: #FFFFFF;
}
.spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #28C4FF; width: 2rem; height: 2rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

<div class="form-container p-6 sm:p-10 max-w-lg w-full text-center space-y-6">
  
  <!-- 美化排版後的表頭區塊 -->
  <div class="space-y-2 border-b border-purple-400/20 pb-5">
    <div class="text-5xl mb-3">🏢</div>
    <div class="text-sm font-bold text-cyan-300 tracking-wider uppercase">
      數位永續 薪在嘉義
    </div>
    <div class="text-xl sm:text-2xl font-extrabold text-white tracking-wide">
      2026 大嘉義就業博覽會
    </div>
    <div class="text-2xl sm:text-3xl font-black text-amber-300 pt-1">
      廠商面試管理系統
    </div>
  </div>

  <!-- 表單輸入區塊 -->
  <div id="authBox" class="space-y-5 pt-2">
    
    <!-- 🏢 選擇廠商下拉式選單 -->
    <div class="text-left space-y-2">
      <label for="companySelect" class="text-sm font-bold text-purple-200 block">
        1. 請選擇貴公司名稱：
      </label>
      <select id="companySelect" class="w-full px-4 py-3 text-lg font-bold rounded-xl border-2 border-circuitCyan focus:outline-none focus:border-amber-300">
        <option value="" disabled selected>-- 請選擇貴公司名稱 --</option>
        <!-- 下拉選項會透過 JavaScript 依據 VENDOR_CONFIG 自動生成 -->
      </select>
    </div>

    <!-- 🔑 輸入 8 位數密碼 -->
    <div class="text-left space-y-2">
      <label for="pinInput" class="text-sm font-bold text-purple-200 block">
        2. 請輸入專屬 8 位數密碼：
      </label>
      <input type="password" id="pinInput" maxlength="8" placeholder="請輸入 8 位數密碼" class="w-full text-center text-2xl tracking-widest py-3 font-bold rounded-xl border-2 border-circuitCyan focus:outline-none focus:border-amber-300">
    </div>

    <button onclick="submitPinAuth()" class="submit-btn w-full py-4 text-xl sm:text-2xl font-bold shadow-xl hover:opacity-90 transition mt-2">
      🔓 解鎖並開啟面試資料
    </button>
  </div>

  <!-- 載入中與手動按鈕區塊 -->
  <div id="loadingBox" class="hidden py-6 space-y-3">
    <span class="spinner"></span>
    <p id="loadingStatusText" class="text-xl font-bold text-cyan-300">驗證成功！正在為您開啟資料...</p>
    <div id="manualRedirectLink" class="hidden mt-4">
      <p class="text-sm text-gray-300">如未自動跳轉，請點擊下方按鈕：</p>
      <a id="directSheetBtn" href="#" target="_blank" class="inline-block mt-3 px-6 py-3 bg-green-600 text-white font-bold text-lg rounded-xl hover:bg-green-500 transition">📊 點此開啟 Google 試算表</a>
    </div>
  </div>

</div>

<script>
// 🛠️ 工作人員萬用救援密碼 (現場應變防卡關用)
const MASTER_PIN = "11223344";

/**
 * 🔑 廠商設定清單（請在此直接輸入/維護 35 家廠商的名稱、個別密碼與試算表網址）
 */
const VENDOR_CONFIG = {
  "01": { 
    name: "01 大成長城企業股份有限公司", 
    pin: "88210101", 
    url: "https://docs.google.com/spreadsheets/d/1TVy3T4qe1ldxkFsFgNdW_3g_I2uBtXej5FNBMs0fdp0/edit" 
  },
  "02": { 
    name: "02 台灣積體電路製造股份有限公司", 
    pin: "88210202", 
    url: "https://docs.google.com/spreadsheets/d/1TVy3T4qe1ldxkFsFgNdW_3g_I2uBtXej5FNBMs0fdp0/edit" 
  },
  "03": { 
    name: "03 遠東機械工業股份有限公司", 
    pin: "88210303", 
    url: "https://docs.google.com/spreadsheets/d/1TVy3T4qe1ldxkFsFgNdW_3g_I2uBtXej5FNBMs0fdp0/edit" 
  },
  "04": { 
    name: "04 耐斯企業股份有限公司", 
    pin: "88210404", 
    url: "https://docs.google.com/spreadsheets/d/1TVy3T4qe1ldxkFsFgNdW_3g_I2uBtXej5FNBMs0fdp0/edit" 
  },
  "05": { 
    name: "05 愛之味股份有限公司", 
    pin: "88210505", 
    url: "https://docs.google.com/spreadsheets/d/1TVy3T4qe1ldxkFsFgNdW_3g_I2uBtXej5FNBMs0fdp0/edit" 
  }
  // 💡 可依此格式繼續新增至 35 家廠商
};

document.addEventListener('DOMContentLoaded', () => {
  const selectElem = document.getElementById('companySelect');
  
  // 1. 動態渲染下拉選單項目
  Object.keys(VENDOR_CONFIG).forEach(code => {
    const option = document.createElement('option');
    option.value = code;
    option.textContent = VENDOR_CONFIG[code].name;
    selectElem.appendChild(option);
  });

  // 2. 自動偵測 URL 中的 company 參數，自動預選對應廠商
  const urlParams = new URLSearchParams(window.location.search);
  const companyParam = urlParams.get('company') ? decodeURIComponent(urlParams.get('company')).trim() : '';
  
  if (companyParam) {
    const numMatch = companyParam.match(/\d+/);
    let vendorNo = numMatch ? numMatch[0] : '';
    if (vendorNo.length === 1) vendorNo = '0' + vendorNo;

    if (VENDOR_CONFIG[vendorNo]) {
      selectElem.value = vendorNo;
    }
  }
});

function submitPinAuth() {
  const selectElem = document.getElementById('companySelect');
  const selectedVendorCode = selectElem.value;
  const pinInput = document.getElementById('pinInput').value.trim();

  if (!selectedVendorCode) {
    alert('請先選擇貴公司 / 攤位名稱！');
    return;
  }

  if (pinInput.length !== 8) {
    alert('請輸入完整的 8 位數 PIN 碼密碼！');
    return;
  }

  const vendorData = VENDOR_CONFIG[selectedVendorCode];

  // 驗證密碼（萬用救援密碼通行 OR 個別專屬密碼）
  const isMasterPin = (pinInput === MASTER_PIN);
  const isVendorPin = (vendorData && pinInput === vendorData.pin);

  if (!isMasterPin && !isVendorPin) {
    alert('🔒 密碼錯誤！請輸入貴公司專屬的 8 位數密碼。');
    return;
  }

  const targetUrl = vendorData.url;

  // 驗證成功處理畫面
  const authBox = document.getElementById('authBox');
  const loadingBox = document.getElementById('loadingBox');
  const loadingText = document.getElementById('loadingStatusText');

  authBox.classList.add('hidden');
  loadingBox.classList.remove('hidden');
  loadingText.innerText = `✅ 驗證成功！正在開啟【${vendorData.name.replace(/^\d+\s*/, '')}】面試資料...`;

  document.getElementById('directSheetBtn').href = targetUrl;
  document.getElementById('manualRedirectLink').classList.remove('hidden');

  // 0.5 秒後流暢跳轉開啟 Google 試算表
  setTimeout(() => {
    window.location.href = targetUrl;
  }, 500);
}
</script>
</body>
</html>
