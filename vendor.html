<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>數位永續 薪在嘉義 2026大嘉義就業博覽會</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Noto Sans TC', sans-serif; background-color: #1F1D53; color: #FFFFFF; min-height: 100vh; }
.form-container { background: linear-gradient(135deg, rgba(31, 29, 83, 0.95) 0%, rgba(76, 35, 124, 0.85) 100%); border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); border: 2px solid #28C4FF; }
.submit-btn { background: linear-gradient(135deg, #AC3FFF, #6A1BCB); border-radius: 12px; color: #FFFFFF; font-weight: 700; }
input[type="password"] { background-color: rgba(31, 29, 83, 0.8) !important; border: 2px solid #A48DCD !important; color: #FFFFFF !important; }
.spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #28C4FF; width: 2rem; height: 2rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="flex items-center justify-center p-4">
<div class="form-container p-8 sm:p-10 max-w-lg w-full text-center space-y-6">
  <div class="text-5xl">🏢</div>
  <div>
    <h1 class="text-3xl font-bold text-white">數位永續 薪在嘉義 2026大嘉義就業博覽會</h1>
    <h1 class="text-3xl font-bold text-white">廠商面試系統</h1>
    <p id="companyNameHeader" class="text-lg text-circuitCyan mt-2 font-bold">請輸入貴公司專屬 8 位數密碼</p>
  </div>
  <div id="authBox" class="space-y-4">
    <input type="password" id="pinInput" maxlength="8" placeholder="請輸入 8 位數密碼" class="w-full text-center text-3xl tracking-widest py-3 font-bold rounded-xl border-2 border-circuitCyan">
    <button onclick="submitPinAuth()" class="submit-btn w-full py-4 text-2xl font-bold shadow-xl hover:opacity-90 transition">
      🔓 解鎖並開啟面試資料
    </button>
  </div>
  <div id="loadingBox" class="hidden py-6 space-y-3">
    <span class="spinner"></span>
    <p id="loadingStatusText" class="text-xl font-bold text-circuitCyan">驗證成功！正在為您開啟資料...</p>
    <div id="manualRedirectLink" class="hidden mt-4">
      <p class="text-sm text-gray-300">如未自動跳轉，請點擊下方按鈕：</p>
      <a id="directSheetBtn" href="#" target="_blank" class="inline-block mt-2 px-6 py-3 bg-green-600 text-white font-bold text-lg rounded-xl">📊 點此開啟面試資料</a>
    </div>
  </div>
</div>

<script>
// 🛠️ 工作人員萬用救援密碼 (現場應變防卡關用)
const MASTER_PIN = "11223344";

/**
 * 🔑 35 家廠商專屬「獨立密碼與試算表對照表」
 * 格式說明：
 * "廠商編號": { pin: "該廠商專屬8位數密碼", url: "對應的Google Sheet網址" }
 */
const VENDOR_CONFIG = {
  "01": { 
    pin: "12345678", 
    url: "https://docs.google.com/spreadsheets/d/1GsHyHEnM_MRqC3GPLuZ2qv1N3uMgjRP5lZh3e4ywLuc/edit?gid=0#gid=0" 
  },
  "02": { 
    pin: "23456789", 
    url: "https://docs.google.com/spreadsheets/d/1XTr5A84uIz52YlaIFajIcTunJo-WMB6GIhogxDBRpBs/edit?gid=0#gid=0" 
  },
  "03": { 
    pin: "34567890", 
    url: "https://docs.google.com/spreadsheets/d/1msmdsBE61vHnJoIlOribOO-FzazAvW9zu-j7FZx3q-U/edit?gid=0#gid=0" 
  },
  "04": { 
    pin: "88210404", 
    url: "https://docs.google.com/spreadsheets/d/1TVy3T4qe1ldxkFsFgNdW_3g_I2uBtXej5FNBMs0fdp0/edit" 
  },
  "05": { 
    pin: "88210505", 
    url: "https://docs.google.com/spreadsheets/d/1TVy3T4qe1ldxkFsFgNdW_3g_I2uBtXej5FNBMs0fdp0/edit" 
  }
  // 💡 可依此類推繼續往下增加至 35 家
};

window.targetCompany = '';

document.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  window.targetCompany = urlParams.get('company') ? decodeURIComponent(urlParams.get('company')).trim() : '';
  if (window.targetCompany) {
    document.getElementById('companyNameHeader').innerText = `【${window.targetCompany}】`;
  }
});

function submitPinAuth() {
  const pinInput = document.getElementById('pinInput').value.trim();
  if (pinInput.length !== 8) {
    alert('請輸入完整的 8 位數密碼！');
    return;
  }

  // 擷取網址上的廠商編號 (例如: "01", "02" 或檔名開頭的數字)
  const comp = window.targetCompany || '';
  const numMatch = comp.match(/\d+/);
  let vendorNo = numMatch ? numMatch[0] : '';
  if (vendorNo.length === 1) vendorNo = '0' + vendorNo; // 補齊為 2 位數 (例: "1" -> "01")

  // 取得該廠商設定
  const vendorData = VENDOR_CONFIG[vendorNo];

  // 驗證密碼邏輯
  let isValid = false;
  let targetUrl = '';

  if (pinInput === MASTER_PIN) {
    // 1. 輸入萬用密碼通行
    isValid = true;
    targetUrl = vendorData ? vendorData.url : Object.values(VENDOR_CONFIG)[0].url;
  } else if (vendorData && pinInput === vendorData.pin) {
    // 2. 輸入該廠商設定檔中的專屬個別密碼
    isValid = true;
    targetUrl = vendorData.url;
  }

  if (!isValid) {
    alert('🔒 密碼錯誤！請輸入貴公司專屬的 8 位數密碼。');
    return;
  }

  // 驗證成功處理
  const authBox = document.getElementById('authBox');
  const loadingBox = document.getElementById('loadingBox');
  const loadingText = document.getElementById('loadingStatusText');

  authBox.classList.add('hidden');
  loadingBox.classList.remove('hidden');
  loadingText.innerText = '✅ 驗證成功！正在為您開啟資料...';

  document.getElementById('directSheetBtn').href = targetUrl;
  document.getElementById('manualRedirectLink').classList.remove('hidden');

  // 0.5 秒後流暢跳轉
  setTimeout(() => {
    window.location.href = targetUrl;
  }, 500);
}
</script>
</body>
</html>
