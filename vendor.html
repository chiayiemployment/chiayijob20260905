<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>數位永續 薪在嘉義_廠商面試系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Noto Sans TC', sans-serif; background-color: #1F1D53; color: #FFFFFF; min-height: 100vh; }
.form-container { 
  background: linear-gradient(135deg, rgba(31, 29, 83, 0.95) 0%, rgba(76, 35, 124, 0.85) 100%); 
  border-radius: 24px; 
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); 
  border: 2px solid #28C4FF; 
}
.submit-btn { 
  background: linear-gradient(135deg, #AC3FFF, #6A1BCB); 
  border-radius: 14px; 
  color: #FFFFFF; 
  font-weight: 700; 
}
select, input[type="password"] { 
  background-color: rgba(31, 29, 83, 0.9) !important; 
  border: 2px solid #A48DCD !important; 
  color: #FFFFFF !important; 
}
select option {
  background-color: #1F1D53;
  color: #FFFFFF;
}
.hidden { display: none !important; }
.spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #28C4FF; width: 2.25rem; height: 2.25rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 lg:p-12 min-h-screen">

<div class="form-container p-6 sm:p-10 md:p-12 max-w-xl w-full text-center space-y-6 lg:space-y-8">
  
  <!-- 表頭區塊 (已移除 Emoji 圖示) -->
  <div class="space-y-2 border-b border-purple-400/20 pb-6">
    <div class="text-lg sm:text-xl font-bold text-cyan-300 tracking-wider uppercase">
      數位永續 薪在嘉義
    </div>
    <div class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-wide">
      2026 大嘉義就業博覽會
    </div>
    <div class="text-2xl sm:text-3xl lg:text-4xl font-black text-amber-300 pt-1">
      廠商面試管理系統
    </div>
  </div>

  <!-- 表單輸入區塊 -->
  <div id="authBox" class="space-y-6 pt-2">
    
    <!-- 選擇廠商下拉式選單 -->
    <div class="text-left space-y-2.5">
      <label for="companySelect" class="text-lg sm:text-xl font-bold text-purple-200 block">
        請選擇公司名稱
      </label>
      <select id="companySelect" class="w-full px-4 py-3.5 text-lg sm:text-xl font-bold rounded-xl border-2 border-circuitCyan focus:outline-none focus:border-amber-300 transition">
        <option value="" disabled selected>載入廠商清單中...</option>
      </select>
    </div>

    <!-- 輸入 8 位數密碼 (支援 Enter 鍵解鎖) -->
    <div class="text-left space-y-2.5">
      <label for="pinInput" class="text-lg sm:text-xl font-bold text-purple-200 block">
        請輸入 8 位數 密碼
      </label>
      <input 
        type="password" 
        id="pinInput" 
        maxlength="8" 
        placeholder="請輸入 8 位數密碼" 
        onkeypress="handleKeyPress(event)"
        class="w-full text-center text-2xl sm:text-3xl tracking-widest py-3.5 font-bold rounded-xl border-2 border-circuitCyan focus:outline-none focus:border-amber-300 transition">
    </div>

    <button onclick="submitPinAuth()" id="loginBtn" class="submit-btn w-full py-4 text-xl sm:text-2xl font-bold shadow-xl hover:opacity-90 transition mt-3">
      開啟面試資料
    </button>
  </div>

  <!-- 載入中與手動跳轉按鈕區塊 -->
  <div id="loadingBox" class="hidden py-8 space-y-4">
    <span class="spinner"></span>
    <p id="loadingStatusText" class="text-xl sm:text-2xl font-bold text-cyan-300">驗證中，請稍候...</p>
    <div id="manualRedirectLink" class="hidden mt-4">
      <p class="text-base text-gray-300">如未自動跳轉，請點擊下方按鈕：</p>
      <a id="directSheetBtn" href="#" target="_blank" class="inline-block mt-3 px-8 py-3.5 bg-green-600 text-white font-bold text-lg sm:text-xl rounded-xl hover:bg-green-500 transition shadow-lg">點此開啟 Google 試算表</a>
    </div>
  </div>

</div>

<script>
// ⚠️ 請填入您的「廠商試算表快速驗證跳轉 API」發布後的 Web App 網址 (網址結尾必須是 /exec)
const VENDOR_API_URL = 'https://script.google.com/macros/s/AKfycbw3_uxYa0iyVixweOBUneJ_BZc9VTHRVX3osxqccNVhJpNMizMaifNIP4EK8vT0oS0-0w/exec';

document.addEventListener('DOMContentLoaded', () => {
  loadCompanyList();
});

/**
 * 1. 向 GAS API 動態讀取密碼總表 B 欄中的公司清單
 */
async function loadCompanyList() {
  const selectElem = document.getElementById('companySelect');
  
  try {
    const resp = await fetch(`${VENDOR_API_URL}?action=getCompanyList`);
    const res = await resp.json();

    if (res && res.success && Array.isArray(res.companyList) && res.companyList.length > 0) {
      selectElem.innerHTML = '<option value="" disabled selected>-- 請選擇公司名稱 --</option>';
      
      res.companyList.forEach(compName => {
        const option = document.createElement('option');
        option.value = compName;
        option.textContent = compName;
        selectElem.appendChild(option);
      });

      // 自動偵測 URL 中的 company 參數預選廠商
      const urlParams = new URLSearchParams(window.location.search);
      const companyParam = urlParams.get('company') ? decodeURIComponent(urlParams.get('company')).trim() : '';
      if (companyParam) {
        for (let i = 0; i < selectElem.options.length; i++) {
          if (selectElem.options[i].value.includes(companyParam) || companyParam.includes(selectElem.options[i].value)) {
            selectElem.selectedIndex = i;
            break;
          }
        }
      }
    } else {
      selectElem.innerHTML = '<option value="" disabled>載入失敗：無廠商資料或總表讀取異常</option>';
    }
  } catch (err) {
    console.error("載入廠商清單失敗：", err);
    selectElem.innerHTML = '<option value="" disabled>連線失敗，請檢查 API 網址或重新整理</option>';
  }
}

/**
 * ⌨️ 監聽 Enter 鍵，按下後自動解鎖
 */
function handleKeyPress(event) {
  if (event.key === 'Enter' || event.keyCode === 13) {
    event.preventDefault();
    submitPinAuth();
  }
}

/**
 * 2. 向 GAS API 發送 C 欄密碼驗證，並取得 D 欄試算表 ID 轉成的網址
 */
async function submitPinAuth() {
  const selectElem = document.getElementById('companySelect');
  const selectedCompany = selectElem.value;
  const pinInput = document.getElementById('pinInput').value.trim();

  if (!selectedCompany) {
    alert('請先選擇公司名稱！');
    return;
  }
  if (pinInput.length !== 8) {
    alert('請輸入完整的 8 位數 密碼！');
    return;
  }

  const authBox = document.getElementById('authBox');
  const loadingBox = document.getElementById('loadingBox');
  const loadingText = document.getElementById('loadingStatusText');

  authBox.classList.add('hidden');
  loadingBox.classList.remove('hidden');
  loadingText.innerText = '正在驗證密碼並搜尋試算表...';

  try {
    const query = new URLSearchParams({
      action: 'getVendorSheetUrl',
      company: selectedCompany,
      pin: pinInput
    }).toString();

    const resp = await fetch(`${VENDOR_API_URL}?${query}`);
    const res = await resp.json();

    if (res && res.success && res.sheetUrl) {
      loadingText.innerText = `驗證成功！正在開啟【${res.company}】面試資料...`;
      document.getElementById('directSheetBtn').href = res.sheetUrl;
      document.getElementById('manualRedirectLink').classList.remove('hidden');

      // 0.5 秒後自動跳轉至試算表網址
      setTimeout(() => {
        window.location.href = res.sheetUrl;
      }, 500);
    } else {
      alert(res.message || '🔒 密碼錯誤！請輸入貴公司專屬的 8 位數密碼。');
      authBox.classList.remove('hidden');
      loadingBox.classList.add('hidden');
    }
  } catch (err) {
    alert('連線失敗，請確認網路連線或 API 網址！');
    authBox.classList.remove('hidden');
    loadingBox.classList.add('hidden');
  }
}
</script>
</body>
</html>
