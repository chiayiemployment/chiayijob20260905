<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>廠商面試管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        deepPurple: "#1F1D53", midPurple: "#6B257F", darkPurple: "#4C237C",
        deepBlue: "#053D88", blue: "#01529F", royalBlue: "#2956A8",
        lightPurple: "#A48DCD", nearWhite: "#EDEEF7", circuitCyan: "#28C4FF",
        buttonGradStart: "#AC3FFF", buttonGradEnd: "#6A1BCB",
        errorRed: "#ff6b6b", successGreen: "#4ade80",
      },
    },
  },
};
</script>
<style>
:root {
  --deep-purple: #1F1D53; --mid-purple: #6B257F; --dark-purple: #4C237C;
  --deep-blue: #053D88; --blue: #01529F; --royal-blue: #2956A8;
  --light-purple: #A48DCD; --near-white: #EDEEF7; --white: #FFFFFF;
  --bright-cyan: #28C4FF; --button-start: #AC3FFF; --button-end: #6A1BCB;
}
body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--deep-purple); color: var(--white); position: relative; min-height: 100vh; font-size: 16px; }
.circuit-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.circuit-line { position: absolute; background-color: var(--dark-purple); box-shadow: 0 0 5px var(--blue); }
.main-content-area { position: relative; z-index: 10; }
.form-container { background: linear-gradient(135deg, rgba(31, 29, 83, 0.95) 0%, rgba(76, 35, 124, 0.85) 100%); border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px); border: 1px solid rgba(164, 141, 205, 0.25); }
.submit-btn { background: linear-gradient(135deg, var(--button-start), var(--button-end)); border-radius: 8px; color: var(--white); font-weight: 700; }

select, input[type="text"] {
  background-color: rgba(31, 29, 83, 0.8) !important;
  border: 1px solid var(--light-purple) !important;
  color: var(--white) !important;
  border-radius: 8px !important;
}

.table-row-hover:hover { background-color: rgba(164, 141, 205, 0.15); }
.status-pill { transition: all 0.2s ease; cursor: pointer; font-weight: bold; }
.status-pill.active-accepted { background-color: #15803d !important; color: #ffffff !important; border-color: #22c55e !important; }
.status-pill.active-rejected { background-color: #b91c1c !important; color: #ffffff !important; border-color: #ef4444 !important; }

.hidden { display: none !important; }
.spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: var(--bright-cyan); width: 1.5rem; height: 1.5rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="min-h-screen py-6 px-4 sm:px-8">
<div class="circuit-background" id="circuitBackground"></div>

<div class="main-content-area max-w-7xl mx-auto space-y-6">

  <!-- 頂部標題與廠商鎖定資訊 -->
  <div class="form-container p-6 sm:p-8">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-lightPurple/20 pb-5 mb-5">
      <div>
        <h1 class="text-3xl sm:text-4xl font-bold text-white flex items-center gap-2">
          🏢 廠商面試管理系統
        </h1>
        <p id="companySubHeader" class="text-base text-circuitCyan mt-2 font-medium">請使用專屬網址進入，登錄貴公司應徵者面試結果</p>
      </div>

      <!-- 廠商選單 (專屬網址模式下自動隱藏，防止看別家) -->
      <div id="vendorSelectorBox" class="w-full md:w-96 space-y-2 hidden">
        <label for="vendorSelect" class="text-sm font-bold text-circuitCyan">切換公司名稱：</label>
        <select id="vendorSelect" class="w-full px-4 py-3 text-lg rounded-lg">
          <option value="" disabled selected>載入廠商清單中...</option>
        </select>
      </div>

      <!-- 鎖定狀態下的公司顯示牌 -->
      <div id="lockedCompanyBadge" class="hidden bg-darkPurple/80 border-2 border-circuitCyan px-6 py-3 rounded-xl">
        <span class="text-xs text-lightPurple block">當前攤位廠商：</span>
        <span id="lockedCompanyName" class="text-2xl font-bold text-white"></span>
      </div>
    </div>

    <!-- 數據小統計 -->
    <div id="statsSummary" class="grid grid-cols-3 gap-4 text-center">
      <div class="bg-darkPurple/60 p-4 rounded-xl border border-lightPurple/20">
        <div class="text-sm text-lightPurple font-medium">預約面試總人數</div>
        <div id="statTotal" class="text-3xl font-bold text-white mt-1">0</div>
      </div>
      <div class="bg-darkPurple/60 p-4 rounded-xl border border-green-500/40">
        <div class="text-sm text-successGreen font-medium">擬錄取人數</div>
        <div id="statAccepted" class="text-3xl font-bold text-successGreen mt-1">0</div>
      </div>
      <div class="bg-darkPurple/60 p-4 rounded-xl border border-red-500/40">
        <div class="text-sm text-errorRed font-medium">不錄取人數</div>
        <div id="statRejected" class="text-3xl font-bold text-errorRed mt-1">0</div>
      </div>
    </div>
  </div>

  <!-- 面試名單載入中與主內容區 -->
  <div id="contentSection" class="form-container p-6">
    
    <div id="loadingStatus" class="text-center py-12 text-circuitCyan flex items-center justify-center gap-2 text-xl font-bold">
      <span class="spinner"></span>
      <span id="loadingText">正在驗證廠商身分並載入面試者名單...</span>
    </div>

    <!-- 💻 筆電大螢幕表格模式 (大字體加強版) -->
    <div id="desktopTableView" class="hidden overflow-x-auto">
      <table class="w-full text-left text-base text-nearWhite border-collapse">
        <thead>
          <tr class="bg-darkPurple/90 border-b-2 border-circuitCyan text-circuitCyan text-lg">
            <th class="py-4 px-4 font-bold">姓名</th>
            <th class="py-4 px-4 font-bold">身分證號</th>
            <th class="py-4 px-4 font-bold">年齡</th>
            <th class="py-4 px-4 font-bold">應徵職務</th>
            <th class="py-4 px-4 font-bold text-center">履歷檢視</th>
            <th class="py-4 px-4 font-bold text-center">面試結果</th>
            <th class="py-4 px-4 font-bold">備註 / 評語</th>
            <th class="py-4 px-4 font-bold text-center">操作</th>
          </tr>
        </thead>
        <tbody id="desktopTableBody" class="divide-y divide-lightPurple/20"></tbody>
      </table>
    </div>

    <!-- 📱 平板觸控卡片模式 -->
    <div id="mobileCardView" class="hidden space-y-4"></div>

  </div>

</div>

<!-- 儲存成功 Toast -->
<div id="toast" class="fixed bottom-6 right-6 bg-successGreen text-gray-900 text-lg font-bold px-6 py-4 rounded-2xl shadow-2xl hidden z-50 flex items-center gap-2">
  <span>✅ 面試結果已成功寫入試算表！</span>
</div>

<script>
// ⚠️ 請在此處填入您「廠商端面試管理 API」最新發布的 Web App 網址
const VENDOR_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw2th8c2QS0ZGRMxQjS8fefMHrAtE3MzG7zqd1uc5igxey56JUZFXse8lZPDXV0gyw/exec';

window.currentCandidates = [];
window.lockedCompany = '';

function createCircuitBackground() {
  const circuitBg = document.getElementById('circuitBackground');
  if (!circuitBg) return;
  circuitBg.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const line = document.createElement('div');
    line.className = 'circuit-line';
    line.style.height = '2px';
    line.style.width = `${Math.random() * 30 + 10}%`;
    line.style.top = `${Math.random() * 100}%`;
    line.style.left = `${Math.random() * 70}%`;
    circuitBg.appendChild(line);
  }
}

async function initVendorPage() {
  createCircuitBackground();

  // 1. 抓取 URL 帶過來的公司名稱 (例如: vendor.html?company=02大成長城...)
  const urlParams = new URLSearchParams(window.location.search);
  let targetCompany = urlParams.get('company') ? decodeURIComponent(urlParams.get('company')).trim() : '';

  const selectorBox = document.getElementById('vendorSelectorBox');
  const lockedBadge = document.getElementById('lockedCompanyBadge');
  const lockedName = document.getElementById('lockedCompanyName');

  if (targetCompany) {
    // 🌟 安全鎖定模式：隱藏下拉選單，只顯示當前公司
    window.lockedCompany = targetCompany;
    lockedName.innerText = targetCompany;
    lockedBadge.classList.remove('hidden');
    document.getElementById('companySubHeader').innerText = `【${targetCompany}】專屬面試管理面板`;
    loadCandidatesForVendor(targetCompany);
  } else {
    // 若無帶參數，則顯示下拉選單讓管理員選擇
    selectorBox.classList.remove('hidden');
    try {
      const resp = await fetch(`${VENDOR_GAS_API_URL}?action=getVendorCompanyList`);
      const res = await resp.json();
      if (res.success && res.companies.length > 0) {
        renderVendorOptions(res.companies);
        document.getElementById('loadingText').innerText = '👈 請點擊右上角下拉選單選擇公司';
      } else {
        document.getElementById('loadingText').innerText = '無預約廠商資料';
      }
    } catch (e) {
      document.getElementById('loadingText').innerText = '載入失敗，請確認 API 網址';
    }
  }

  document.getElementById('vendorSelect').addEventListener('change', function() {
    if (this.value) loadCandidatesForVendor(this.value);
  });
}

function renderVendorOptions(companies) {
  const vendorSelect = document.getElementById('vendorSelect');
  vendorSelect.innerHTML = '<option value="" disabled selected>請選擇公司...</option>';
  companies.forEach(comp => {
    const opt = document.createElement('option');
    opt.value = comp;
    opt.innerText = comp;
    vendorSelect.appendChild(opt);
  });
}

async function loadCandidatesForVendor(companyName) {
  const loadingStatus = document.getElementById('loadingStatus');
  const desktopView = document.getElementById('desktopTableView');
  const mobileView = document.getElementById('mobileCardView');

  desktopView.classList.add('hidden');
  mobileView.classList.add('hidden');
  loadingStatus.classList.remove('hidden');
  document.getElementById('loadingText').innerText = `正在載入【${companyName}】的面試名單...`;

  try {
    const resp = await fetch(`${VENDOR_GAS_API_URL}?action=getVendorCandidates&company=${encodeURIComponent(companyName)}`);
    const res = await resp.json();

    if (res.success) {
      window.currentCandidates = res.candidates || [];
      updateStats();
      renderViews();
      loadingStatus.classList.add('hidden');
    } else {
      document.getElementById('loadingText').innerText = res.message || '讀取名單失敗';
    }
  } catch (err) {
    document.getElementById('loadingText').innerText = '網路連線失敗，請重新整理';
  }
}

function renderViews() {
  const isMobile = window.innerWidth < 768;
  const desktopView = document.getElementById('desktopTableView');
  const mobileView = document.getElementById('mobileCardView');

  if (isMobile) {
    renderMobileCards();
    mobileView.classList.remove('hidden');
    desktopView.classList.add('hidden');
  } else {
    renderDesktopTable();
    desktopView.classList.remove('hidden');
    mobileView.classList.add('hidden');
  }
}

// 💻 電腦版大字體表格渲染
function renderDesktopTable() {
  const tbody = document.getElementById('desktopTableBody');
  tbody.innerHTML = '';

  if (window.currentCandidates.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-gray-400 text-lg">目前尚無此廠商的預約求職者。</td></tr>`;
    return;
  }

  window.currentCandidates.forEach(c => {
    const tr = document.createElement('tr');
    tr.className = 'table-row-hover';

    // 履歷按鈕 404 防呆
    const docBtn = c.docUrl 
      ? `<a href="${c.docUrl}" target="_blank" class="inline-block px-3 py-1.5 text-sm bg-blue/50 text-circuitCyan border border-circuitCyan/50 rounded-lg hover:bg-blue font-bold">📝 文件 (Docs)</a>` 
      : `<button onclick="alert('試算表中未填寫有效的 Docs 履歷網址')" class="px-3 py-1.5 text-sm bg-gray-700 text-gray-400 rounded-lg cursor-not-allowed">📝 無文件</button>`;

    const pdfBtn = c.pdfUrl 
      ? `<a href="${c.pdfUrl}" target="_blank" class="inline-block px-3 py-1.5 text-sm bg-midPurple/60 text-purple-200 border border-purple-400/50 rounded-lg hover:bg-midPurple font-bold">📄 PDF (手寫)</a>` 
      : `<button onclick="alert('試算表中未填寫有效的 PDF 履歷網址')" class="px-3 py-1.5 text-sm bg-gray-700 text-gray-400 rounded-lg cursor-not-allowed">📄 無 PDF</button>`;

    tr.innerHTML = `
      <td class="py-4 px-4 font-bold text-white text-lg">${c.name}</td>
      <td class="py-4 px-4 text-lightPurple">${c.idNumber}</td>
      <td class="py-4 px-4">${c.age ? c.age + ' 歲' : '-'}</td>
      <td class="py-4 px-4 text-yellow-300 font-bold">${c.position}</td>
      <td class="py-4 px-4 text-center space-x-2 whitespace-nowrap">
        ${docBtn}
        ${pdfBtn}
      </td>
      <td class="py-4 px-4 text-center whitespace-nowrap">
        <div class="inline-flex gap-2">
          <button onclick="toggleStatus(${c.rowId}, 'accepted')" id="btn-acc-${c.rowId}" class="status-pill px-3 py-1.5 text-sm rounded-lg border border-lightPurple/30 ${c.accepted ? 'active-accepted' : 'bg-darkPurple/80 text-gray-300'}">擬錄取</button>
          <button onclick="toggleStatus(${c.rowId}, 'rejected')" id="btn-rej-${c.rowId}" class="status-pill px-3 py-1.5 text-sm rounded-lg border border-lightPurple/30 ${c.notAccepted ? 'active-rejected' : 'bg-darkPurple/80 text-gray-300'}">不錄取</button>
        </div>
      </td>
      <td class="py-4 px-4">
        <input type="text" id="note-${c.rowId}" value="${c.note || ''}" placeholder="點擊輸入評語/備註..." class="w-full px-3 py-2 text-sm rounded-lg">
      </td>
      <td class="py-4 px-4 text-center">
        <button onclick="saveCandidateResult(${c.rowId})" class="submit-btn px-4 py-2 text-sm font-bold">儲存</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// 📱 平板大卡片渲染
function renderMobileCards() {
  const container = document.getElementById('mobileCardView');
  container.innerHTML = '';

  if (window.currentCandidates.length === 0) {
    container.innerHTML = `<p class="text-center py-10 text-gray-400 text-lg">目前尚無此廠商的預約求職者。</p>`;
    return;
  }

  window.currentCandidates.forEach(c => {
    const card = document.createElement('div');
    card.className = 'bg-darkPurple/60 p-5 rounded-2xl border border-lightPurple/30 space-y-4';

    const docBtn = c.docUrl 
      ? `<a href="${c.docUrl}" target="_blank" class="text-center py-2.5 text-sm bg-blue/50 text-circuitCyan border border-circuitCyan/50 rounded-xl font-bold">📝 履歷文件 (筆電打字)</a>` 
      : `<button onclick="alert('試算表中未填寫 Docs 網址')" class="py-2.5 text-sm bg-gray-700 text-gray-400 rounded-xl">無 Docs 檔</button>`;

    const pdfBtn = c.pdfUrl 
      ? `<a href="${c.pdfUrl}" target="_blank" class="text-center py-2.5 text-sm bg-midPurple/60 text-purple-200 border border-purple-400/50 rounded-xl font-bold">📄 履歷 PDF (平板手寫)</a>` 
      : `<button onclick="alert('試算表中未填寫 PDF 網址')" class="py-2.5 text-sm bg-gray-700 text-gray-400 rounded-xl">無 PDF 檔</button>`;

    card.innerHTML = `
      <div class="flex justify-between items-start border-b border-lightPurple/20 pb-3">
        <div>
          <h3 class="text-2xl font-bold text-white">${c.name} <span class="text-sm font-normal text-lightPurple">(${c.age ? c.age + '歲' : '年齡未填'})</span></h3>
          <p class="text-sm text-circuitCyan mt-1">身分證：${c.idNumber}</p>
        </div>
        <span class="text-base font-bold text-yellow-300 bg-midPurple/60 px-3 py-1.5 rounded-lg border border-yellow-300/30">${c.position}</span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        ${docBtn}
        ${pdfBtn}
      </div>

      <div class="flex items-center justify-between pt-2">
        <span class="text-base text-lightPurple font-bold">面試結果：</span>
        <div class="flex gap-2">
          <button onclick="toggleStatus(${c.rowId}, 'accepted')" id="m-btn-acc-${c.rowId}" class="status-pill px-5 py-2.5 text-base rounded-xl border border-lightPurple/30 ${c.accepted ? 'active-accepted' : 'bg-darkPurple/80 text-gray-300'}">👍 擬錄取</button>
          <button onclick="toggleStatus(${c.rowId}, 'rejected')" id="m-btn-rej-${c.rowId}" class="status-pill px-5 py-2.5 text-base rounded-xl border border-lightPurple/30 ${c.notAccepted ? 'active-rejected' : 'bg-darkPurple/80 text-gray-300'}">👎 不錄取</button>
        </div>
      </div>

      <div class="pt-2">
        <input type="text" id="m-note-${c.rowId}" value="${c.note || ''}" placeholder="點擊輸入面試評語 / 檢核事項..." class="w-full px-4 py-3 text-base rounded-xl">
      </div>

      <button onclick="saveCandidateResult(${c.rowId})" class="submit-btn w-full py-3 text-lg font-bold mt-2">💾 儲存本筆資料</button>
    `;
    container.appendChild(card);
  });
}

function toggleStatus(rowId, type) {
  const candidate = window.currentCandidates.find(c => c.rowId === rowId);
  if (!candidate) return;

  if (type === 'accepted') {
    candidate.accepted = !candidate.accepted;
    if (candidate.accepted) candidate.notAccepted = false;
  } else {
    candidate.notAccepted = !candidate.notAccepted;
    if (candidate.notAccepted) candidate.accepted = false;
  }

  updateStats();
  renderViews();
}

function updateStats() {
  document.getElementById('statTotal').innerText = window.currentCandidates.length;
  document.getElementById('statAccepted').innerText = window.currentCandidates.filter(c => c.accepted).length;
  document.getElementById('statRejected').innerText = window.currentCandidates.filter(c => c.notAccepted).length;
}

async function saveCandidateResult(rowId) {
  const candidate = window.currentCandidates.find(c => c.rowId === rowId);
  const comp = window.lockedCompany || (document.getElementById('vendorSelect') ? document.getElementById('vendorSelect').value : '');

  if (!candidate || !comp) {
    alert('未選擇公司或資料無效！');
    return;
  }

  const noteDesktop = document.getElementById(`note-${rowId}`);
  const noteMobile = document.getElementById(`m-note-${rowId}`);
  const noteVal = noteDesktop ? noteDesktop.value : (noteMobile ? noteMobile.value : candidate.note);
  candidate.note = noteVal;

  try {
    const params = new URLSearchParams();
    params.append('postData', JSON.stringify({
      action: 'updateInterviewResult',
      company: comp,
      rowId: rowId,
      accepted: candidate.accepted,
      notAccepted: candidate.notAccepted,
      note: noteVal
    }));

    const resp = await fetch(VENDOR_GAS_API_URL, { method: 'POST', body: params });
    const res = await resp.json();

    if (res.success) {
      showToast();
    } else {
      alert('儲存失敗：' + (res.message || '無法寫入'));
    }
  } catch (err) {
    alert('網路連線失敗，請確認連線狀況');
  }
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.remove('hidden');
  setTimeout(() => toast.classList.add('hidden'), 2500);
}

window.addEventListener('resize', renderViews);
document.addEventListener('DOMContentLoaded', initVendorPage);
</script>
</body>
</html>
