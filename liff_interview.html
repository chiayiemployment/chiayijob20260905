<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面試進度查詢</title>
  <!-- 🌟 1. 引入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    body {
      background-color: #1F1D53;
      color: #FFFFFF;
      min-height: 100vh;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .header {
      font-size: 1.55rem;
      font-weight: 900;
      text-align: center;
      color: #28C4FF;
      margin-bottom: 4px;
      text-shadow: 0 2px 8px rgba(40, 196, 255, 0.4);
    }
    .header-sub {
      font-size: 1.4rem;
      font-weight: 900;
      text-align: center;
      color: #28C4FF;
      margin-bottom: 14px;
      text-shadow: 0 2px 8px rgba(40, 196, 255, 0.4);
    }
    .select-card {
      background: rgba(76, 35, 124, 0.85);
      border: 1px solid rgba(164, 141, 205, 0.4);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .select-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #EDEEF7;
      margin-bottom: 6px;
      display: block;
    }
    .company-dropdown {
      width: 100%;
      padding: 10px 12px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 8px;
      border: 2px solid #28C4FF;
      background-color: #0F3A7A;
      color: #FFFFFF;
      outline: none;
    }
    .summary-card {
      background: linear-gradient(135deg, #16609C, #4C237C);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      border: 1px solid #28C4FF;
    }
    .summary-item .title { font-size: 0.85rem; color: #A48DCD; font-weight: 700; margin-bottom: 2px; }
    .summary-item .name { font-size: 1.3rem; font-weight: 900; }
    .name-current { color: #4ade80; }
    .name-next { color: #EDEEF7; }
    .list-card {
      background: rgba(76, 35, 124, 0.7);
      border-radius: 12px;
      border: 1px solid rgba(164, 141, 205, 0.25);
      overflow: hidden;
      flex: 1;
    }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th {
      background: #0F3A7A;
      color: #28C4FF;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 10px 8px;
      border-bottom: 2px solid #28C4FF;
    }
    td {
      padding: 10px 8px;
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(164, 141, 205, 0.2);
    }
    tr:nth-child(even) { background-color: rgba(31, 29, 83, 0.5); }
    tr:nth-child(odd) { background-color: rgba(76, 35, 124, 0.4); }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .badge-calling { background-color: #4ade80; color: #000; }  /* 面試中 (綠) */
    .badge-done { background-color: #A48DCD; color: #000; }     /* 已面試 (灰紫) */
    .badge-pass { background-color: #FB923C; color: #000; }     /* 已過號 (橘) */
    .no-data {
      text-align: center;
      padding: 30px 10px;
      color: #A48DCD;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="header">數位永續 薪在嘉義2026</div>[cite: 12]
  <div class="header-sub">面試進度</div>[cite: 12]

  <div class="select-card">
    <label class="select-label" for="companySelect">請選擇要查詢的廠商攤位：</label>[cite: 12]
    <select id="companySelect" class="company-dropdown" onchange="onCompanyChange()">
      <option value="">載入中...</option>
    </select>
  </div>

  <div class="summary-card" id="summaryArea" style="display:none;">[cite: 12]
    <div class="summary-item">
      <div class="title">目前面試</div>[cite: 12]
      <div class="name name-current" id="sumCurrent">—</div>[cite: 12]
    </div>
    <div class="summary-item">
      <div class="title">下一位</div>[cite: 12]
      <div class="name name-next" id="sumNext">—</div>[cite: 12]
    </div>
  </div>

  <div class="list-card">[cite: 12]
    <table>
      <thead>
        <tr>
          <th>姓 名</th>
          <th>面試情形</th>[cite: 12]
        </tr>
      </thead>
      <tbody id="candidateTableBody">
        <tr><td colspan="2" class="no-data">載入中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // 🌟 請填入您的 LIFF ID
    const LIFF_ID = "2011155577-QRgdOBXH";
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxRySlV7lWM3bQ5JeYDNTQFTqXhEv-YU-TAeBd-QvLxSlM76VwdEtHuO7x9ieuTPXYohw/exec';[cite: 12]
    const CACHE_LOCAL_KEY = 'CACHED_EXPO_BOOTHS_DATA';[cite: 12]
    let allBoothsData = [];[cite: 12]
    let currentSelectedBooth = 0;[cite: 12]

    // 🌟 2. LIFF 初始化與載入
    async function initApp() {
      // 快速載入快取，提升使用者開啟體驗
      const localCached = localStorage.getItem(CACHE_LOCAL_KEY);[cite: 12]
      if (localCached) {
        try {
          allBoothsData = JSON.parse(localCached);[cite: 12]
          buildDropdown();[cite: 12]
          renderBooth(currentSelectedBooth);[cite: 12]
        } catch(e){}
      }

      // 初始化 LIFF
      try {
        await liff.init({ liffId: LIFF_ID });[cite: 9]
      } catch (err) {
        console.warn("LIFF 初始化異常 (若在外部瀏覽器開啟屬正常):", err);
      }

      // 抓取最新資料
      fetchFreshData();[cite: 12]
    }

    async function fetchFreshData() {
      try {
        const res = await fetch(`${GAS_API_URL}?t=${Date.now()}`);[cite: 12]
        const data = await res.json();[cite: 12]
        if (data && data.allBooths) {
          allBoothsData = data.allBooths;[cite: 12]
          localStorage.setItem(CACHE_LOCAL_KEY, JSON.stringify(allBoothsData));[cite: 12]
          buildDropdown();[cite: 12]
          renderBooth(currentSelectedBooth);[cite: 12]
        }
      } catch (err) {
        console.error("更新失敗:", err);[cite: 12]
      }
    }

    function buildDropdown() {
      const select = document.getElementById('companySelect');[cite: 12]
      const prevVal = select.value !== "" ? select.value : currentSelectedBooth;[cite: 12]
      select.innerHTML = '';[cite: 12]
      allBoothsData.forEach((b, idx) => {
        const opt = document.createElement('option');[cite: 12]
        opt.value = idx;[cite: 12]
        opt.textContent = `攤位 ${b.boothNo} ｜ ${b.company}`;[cite: 12]
        select.appendChild(opt);[cite: 12]
      });
      select.value = prevVal;[cite: 12]
    }

    function onCompanyChange() {
      const select = document.getElementById('companySelect');[cite: 12]
      currentSelectedBooth = select.value;[cite: 12]
      renderBooth(currentSelectedBooth);[cite: 12]
    }

    function renderBooth(idx) {
      if (!allBoothsData[idx]) return;[cite: 12]
      const booth = allBoothsData[idx];[cite: 12]

      document.getElementById('summaryArea').style.display = 'flex';[cite: 12]
      document.getElementById('sumCurrent').textContent = booth.current || '準備中';[cite: 12]
      document.getElementById('sumNext').textContent = booth.next || '無';[cite: 12]

      const tbody = document.getElementById('candidateTableBody');[cite: 12]
      const candidates = booth.candidates || [];[cite: 12]

      if (candidates.length === 0) {
        tbody.innerHTML = `<tr><td colspan="2" class="no-data">該攤位目前尚無預約名單</td></tr>`;[cite: 12]
        return;
      }

      let html = '';[cite: 12]
      candidates.forEach(c => {
        let badgeHtml = '';[cite: 12]
        if (c.status === '面試中') {
          badgeHtml = `<span class="badge badge-calling">面試中</span>`;[cite: 12]
        } else if (c.status === '已面試') {
          badgeHtml = `<span class="badge badge-done">已面試</span>`;[cite: 12]
        } else if (c.status === '已過號') {
          badgeHtml = `<span class="badge badge-pass">已過號</span>`;[cite: 12]
        } else {
          badgeHtml = '';[cite: 12]
        }
        html += `<tr><td>${c.name}</td><td>${badgeHtml}</td></tr>`;[cite: 12]
      });
      tbody.innerHTML = html;[cite: 12]
    }

    // 每 10 秒自動同步最新進度[cite: 12]
    setInterval(fetchFreshData, 10000);[cite: 12]
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
