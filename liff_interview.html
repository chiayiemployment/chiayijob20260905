<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數位永續 薪在嘉義2026 - 面試進度</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    body {
      background-color: #1F1D53;
      color: #FFFFFF;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    /* 頂部標題 */
    .header {
      font-size: 1.6rem;
      font-weight: 900;
      text-align: center;
      color: #28C4FF;
      margin-bottom: 16px;
      text-shadow: 0 2px 8px rgba(40, 196, 255, 0.4);
    }

    /* 廠商下拉選單卡片 */
    .select-card {
      background: rgba(76, 35, 124, 0.85);
      border: 1px solid rgba(164, 141, 205, 0.4);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .select-label {
      font-size: 1rem;
      font-weight: 700;
      color: #EDEEF7;
      margin-bottom: 8px;
      display: block;
    }
    .company-dropdown {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 8px;
      border: 2px solid #28C4FF;
      background-color: #0F3A7A;
      color: #FFFFFF;
      outline: none;
    }

    /* 即時面試進度摘要卡片 */
    .summary-card {
      background: linear-gradient(135deg, #16609C, #4C237C);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      border: 1px solid #28C4FF;
    }
    .summary-item .title { font-size: 0.9rem; color: #A48DCD; font-weight: 700; margin-bottom: 4px; }
    .summary-item .name { font-size: 1.35rem; font-weight: 900; }
    .name-current { color: #4ade80; }
    .name-next { color: #EDEEF7; }

    /* 求職者清單表格卡片 */
    .list-card {
      background: rgba(76, 35, 124, 0.7);
      border-radius: 12px;
      border: 1px solid rgba(164, 141, 205, 0.25);
      overflow: hidden;
      flex: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }
    th {
      background: #0F3A7A;
      color: #28C4FF;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 12px 8px;
      border-bottom: 2px solid #28C4FF;
    }
    td {
      padding: 12px 8px;
      font-size: 1.15rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(164, 141, 205, 0.2);
    }
    tr:nth-child(even) { background-color: rgba(31, 29, 83, 0.5); }
    tr:nth-child(odd) { background-color: rgba(76, 35, 124, 0.4); }

    /* 狀態標籤樣式 */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .badge-calling { background-color: #4ade80; color: #000; }  /* 叫號中 (綠) */
    .badge-done { background-color: #A48DCD; color: #000; }     /* 已面試 (灰紫) */
    .badge-pass { background-color: #FB923C; color: #000; }     /* 已過號 (橘) */
    .badge-wait { background-color: #28C4FF; color: #000; }     /* 等候中 (藍) */

    .no-data {
      text-align: center;
      padding: 30px 10px;
      color: #A48DCD;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="header">數位永續 薪在嘉義2026</div>
  <div class="header">面試進度</div>

  <!-- 下拉選單區 -->
  <div class="select-card">
    <label class="select-label" for="companySelect">請選擇要查詢的廠商攤位：</label>
    <select id="companySelect" class="company-dropdown" onchange="onCompanyChange()">
      <option value="">正在載入廠商名單...</option>
    </select>
  </div>

  <!-- 當前攤位狀態摘要 -->
  <div class="summary-card" id="summaryArea" style="display:none;">
    <div class="summary-item">
      <div class="title">目前面試</div>
      <div class="name name-current" id="sumCurrent">—</div>
    </div>
    <div class="summary-item">
      <div class="title">下一位</div>
      <div class="name name-next" id="sumNext">—</div>
    </div>
  </div>

  <!-- 求職者面試狀態列表 -->
  <div class="list-card">
    <table>
      <thead>
        <tr>
          <th>姓 名</th>
          <th>面試情形</th>
        </tr>
      </thead>
      <tbody id="candidateTableBody">
        <tr>
          <td colspan="2" class="no-data">請先於上方選擇欲查詢的廠商</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwnnmdsTZddL6qNrR6XajvgaggxlwvPUQxrhGifLoGRdkafG_4m-ETHprAOtQHYvRUziw/exec';
    let allBoothsData = [];

    async function loadAllData() {
      try {
        const res = await fetch(`${GAS_API_URL}?t=${Date.now()}`);
        const data = await res.json();
        if (data && data.allBooths) {
          allBoothsData = data.allBooths;
          initDropdown();
        }
      } catch (err) {
        console.error("載入失敗:", err);
      }
    }

    function initDropdown() {
      const select = document.getElementById('companySelect');
      const savedIndex = select.selectedIndex > 0 ? select.value : 0;
      select.innerHTML = '';

      allBoothsData.forEach((b, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `攤位 ${b.boothNo} ｜ ${b.company}`;
        select.appendChild(opt);
      });

      // 預設選取第一個攤位
      select.value = savedIndex;
      renderBoothList(select.value);
    }

    function onCompanyChange() {
      const select = document.getElementById('companySelect');
      renderBoothList(select.value);
    }

    function renderBoothList(boothIndex) {
      if (!allBoothsData[boothIndex]) return;
      const booth = allBoothsData[boothIndex];

      // 顯示摘要卡片
      document.getElementById('summaryArea').style.display = 'flex';
      document.getElementById('sumCurrent').textContent = booth.current || '準備中';
      document.getElementById('sumNext').textContent = booth.next || '無';

      const tbody = document.getElementById('candidateTableBody');
      tbody.innerHTML = '';

      if (!booth.candidates || booth.candidates.length === 0) {
        tbody.innerHTML = `<tr><td colspan="2" class="no-data">該攤位目前尚無預約名單</td></tr>`;
        return;
      }

      booth.candidates.forEach(c => {
        let badgeHtml = '';
        if (c.status === '叫號中') badgeHtml = `<span class="badge badge-calling">叫號中</span>`;
        else if (c.status === '已面試') badgeHtml = `<span class="badge badge-done">已面試</span>`;
        else if (c.status === '已過號') badgeHtml = `<span class="badge badge-pass">已過號</span>`;
        else badgeHtml = `<span class="badge badge-wait">等候中</span>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${c.name}</td>
          <td>${badgeHtml}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 每 15 秒自動刷新最新進度
    setInterval(loadAllData, 15000);
    document.addEventListener('DOMContentLoaded', loadAllData);
  </script>
</body>
</html>
