<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面試進度查詢</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #1F1D53; color: #FFF; margin: 0; padding: 20px; }
    .card { background: rgba(76, 35, 124, 0.8); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid rgba(164,141,205,0.3); }
    .header { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 20px; color: #28C4FF; }
    .booth-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; color: #FFF; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; }
    .badge-calling { background-color: #4ade80; color: #000; }
    .badge-wait { background-color: #28C4FF; color: #000; }
    .badge-pass { background-color: #FB923C; color: #000; }
    .info-row { margin: 8px 0; font-size: 1rem; color: #EDEEF7; }
    .loading { text-align: center; color: #AAA; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="header">面試進度</div>
  <div id="content" class="loading">正在連線取得您的面試進度...</div>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyLkF5eF41PA9Iyj4zgRfdDUi8P2H3mzUT2sNGTWAkea-WINWyhsvVac4sR-gmVrD5Rnw/exec';

    async function initLIFF() {
      try {
        await liff.init({ liffId: "2011155577-GFxY8qTy" });

        // 在 LINE 內部環境中取得 profile
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          loadUserAppointments(profile.userId);
        } else {
          // 若在外部瀏覽器打開則引導登入
          liff.login();
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
        document.getElementById('content').innerHTML = `
          <div class="card" style="text-align:center;">
            <p>連線逾時，請從 LINE 聊天室重新點選開啟！</p>
          </div>`;
      }
    }

    async function loadUserAppointments(userId) {
      try {
        const res = await fetch(`${GAS_API_URL}?type=user&userId=${userId}&t=${Date.now()}`);
        const data = await res.json();
        const container = document.getElementById('content');
        container.className = '';
        container.innerHTML = '';

        if (!data.appointments || data.appointments.length === 0) {
          container.innerHTML = `
            <div class="card" style="text-align:center;">
              <p style="font-size:1.1rem; font-weight:bold;">您目前尚未預約任何廠商面試喔！</p>
              <p style="margin-top:10px; color:#28C4FF;">請點選 LINE 主選單「預約面試」前往登記面試攤位！😊</p>
            </div>`;
          return;
        }

        data.appointments.forEach(app => {
          let badgeClass = 'badge-wait';
          if (app.myStatus === '叫號' || app.myStatus === '已面試') badgeClass = 'badge-calling';
          if (app.myStatus.includes('過號')) badgeClass = 'badge-pass';

          container.innerHTML += `
            <div class="card">
              <div class="booth-title">攤位 ${app.boothNo}｜${app.companyName} (${app.industry})</div>
              <div class="info-row">目前現場面試：<strong style="color:#4ade80;">${app.currentInterviewing}</strong></div>
              <div class="info-row">您的面試狀態：<span class="status-badge ${badgeClass}">${app.myStatus}</span></div>
            </div>
          `;
        });
      } catch (e) {
        console.error("Fetch User Data Error:", e);
        document.getElementById('content').innerHTML = `<div class="card" style="text-align:center;">查詢面試進度失敗，請稍後再試。</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', initLIFF);
  </script>
</body>
</html>
