<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面試進度查詢</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    body {
      background-color: #1F1D53;
      color: #FFFFFF;
      min-height: 100vh;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    .header {
      font-size: 1.55rem;
      font-weight: 900;
      text-align: center;
      color: #28C4FF;
      margin-bottom: 14px;
      text-shadow: 0 2px 8px rgba(40, 196, 255, 0.4);
    }

    .select-card {
      background: rgba(76, 35, 124, 0.85);
      border: 1px solid rgba(164, 141, 205, 0.4);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .select-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #EDEEF7;
      margin-bottom: 6px;
      display: block;
    }
    .company-dropdown {
      width: 100%;
      padding: 10px 12px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 8px;
      border: 2px solid #28C4FF;
      background-color: #0F3A7A;
      color: #FFFFFF;
      outline: none;
    }

    .summary-card {
      background: linear-gradient(135deg, #16609C, #4C237C);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      border: 1px solid #28C4FF;
    }
    .summary-item .title { font-size: 0.85rem; color: #A48DCD; font-weight: 700; margin-bottom: 2px; }
    .summary-item .name { font-size: 1.3rem; font-weight: 900; }
    .name-current { color: #4ade80; }
    .name-next { color: #EDEEF7; }

    .list-card {
      background: rgba(76, 35, 124, 0.7);
      border-radius: 12px;
      border: 1px solid rgba(164, 141, 205, 0.25);
      overflow: hidden;
      flex: 1;
    }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th {
      background: #0F3A7A;
      color: #28C4FF;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 10px 8px;
      border-bottom: 2px solid #28C4FF;
    }
    td {
      padding: 10px 8px;
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(164, 141, 205, 0.2);
    }
    tr:nth-child(even) { background-color: rgba(31, 29, 83, 0.5); }
    tr:nth-child(odd) { background-color: rgba(76, 35, 124, 0.4); }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .badge-calling { background-color: #4ade80; color: #000; }
    .badge-done { background-color: #A48DCD; color: #000; }
    .badge-pass { background-color: #FB923C; color: #000; }

    .no-data {
      text-align: center;
      padding: 30px 10px;
      color: #A48DCD;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="header">數位永續 薪在嘉義2026</div>
  <div class="header">面試進度</div>

  <div class="select-card">
    <label class="select-label" for="companySelect">請選擇要查詢的廠商攤位：</label>
    <select id="companySelect" class="company-dropdown" onchange="onCompanyChange()">
      <option value="">正在連線同步進度...</option>
    </select>
  </div>

  <div class="summary-card" id="summaryArea" style="display:none;">
    <div class="summary-item">
      <div class="title">目前面試</div>
      <div class="name name-current" id="sumCurrent">—</div>
    </div>
    <div class="summary-item">
      <div class="title">下一位</div>
      <div class="name name-next" id="sumNext">—</div>
    </div>
  </div>

  <div class="list-card">
    <table>
      <thead>
        <tr>
          <th>姓 名</th>
          <th>面試情形</th>
        </tr>
      </thead>
      <tbody id="candidateTableBody">
        <tr>
          <td colspan="2" class="no-data">正在載入最新面試名單...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwplNgcQSFJw7DnhCQV-PD7Dp3Bg7jOOeSOdzY7jFpclw2WC8YJUkTwCGFoiE-b0_sp3A/exec';
    let allBoothsData = [];
    let currentSelectedBooth = 0;

    async function loadData() {
      try {
        const res = await fetch(`${GAS_API_URL}?t=${Date.now()}`);
        const data = await res.json();
        if (data && data.allBooths) {
          allBoothsData = data.allBooths;
          buildDropdown();
          renderBooth(currentSelectedBooth);
        }
      } catch (err) {
        console.error("載入失敗:", err);
      }
    }

    function buildDropdown() {
      const select = document.getElementById('companySelect');
      if (select.children.length === allBoothsData.length) return; // 已建立則不重複重繪

      select.innerHTML = '';
      allBoothsData.forEach((b, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `攤位 ${b.boothNo} ｜ ${b.company}`;
        select.appendChild(opt);
      });
      select.value = currentSelectedBooth;
    }

    function onCompanyChange() {
      const select = document.getElementById('companySelect');
      currentSelectedBooth = select.value;
      renderBooth(currentSelectedBooth);
    }

    function renderBooth(idx) {
      if (!allBoothsData[idx]) return;
      const booth = allBoothsData[idx];

      document.getElementById('summaryArea').style.display = 'flex';
      document.getElementById('sumCurrent').textContent = booth.current || '準備中';
      document.getElementById('sumNext').textContent = booth.next || '無';

      const tbody = document.getElementById('candidateTableBody');
      const candidates = booth.candidates || [];

      if (candidates.length === 0) {
        tbody.innerHTML = `<tr><td colspan="2" class="no-data">目前尚無已叫號或已面試之紀錄</td></tr>`;
        return;
      }

      let html = '';
      candidates.forEach(c => {
        let badgeHtml = '';
        if (c.status === '面試中') badgeHtml = `<span class="badge badge-calling">面試中</span>`;
        else if (c.status === '已面試') badgeHtml = `<span class="badge badge-done">已面試</span>`;
        else if (c.status === '已過號') badgeHtml = `<span class="badge badge-pass">已過號</span>`;

        html += `<tr><td>${c.name}</td><td>${badgeHtml}</td></tr>`;
      });
      tbody.innerHTML = html;
    }

    // 每 10 秒在背景悄悄更新快取
    setInterval(loadData, 10000);
    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
