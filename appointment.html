select { appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%23a48dcd"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>') !important; background-repeat: no-repeat !important; background-position: right 0.75rem center !important; background-size: 1.2em 1.2em !important; padding-right: 2.5rem !important; }
.submit-btn { background: linear-gradient(135deg, var(--button-start), var(--button-end)); box-shadow: 0 4px 14px rgba(172, 63, 255, 0.35); border-radius: 10px; color: var(--white); font-weight: 700; border: none; cursor: pointer; text-align: center; }
/* 多人選擇卡片樣式 */
.user-card {

.company-title { font-size: 1.35rem; font-weight: 700; color: var(--bright-cyan); margin-bottom: 0.85rem; }

@keyframes spin { to { transform: rotate(360deg); } }

<!-- 客製化 Alert Modal -->
<div id="customAlertModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 hidden z-50 backdrop-blur-sm">
  <div class="form-container p-6 sm:p-8 rounded-2xl shadow-2xl max-w-lg w-full mx-auto text-center space-y-6">
    <p id="customAlertMessage" class="text-white text-lg sm:text-xl leading-relaxed whitespace-pre-line font-medium"></p>
    <div id="modalButtons" class="flex justify-center gap-4">

<script>
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxGdBTZe_DI8AILbTjfqocL21Fxk8-fA_v-Dn3MDSzG9gVEfBu_eFuBmQS6-h3NDJq6uQ/exec';
const LIFF_ID = '2010785535-qIFwOa8w';
window.lineUserId = '';
async function callGasApi(action, payload = {}, method = 'GET') {
  try {
    if (method === 'GET') {
      const query = new URLSearchParams({ action, ...payload }).toString();
      const resp = await fetch(`${GAS_API_URL}?${query}`);
      return await resp.json();
    } else {
      const resp = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload }),
        redirect: 'follow'
      });
      return await resp.json();
    }
  } catch (err) {
    console.error('API 呼叫失敗:', err);
    return {
      status: 'error',
      message: '資料傳輸失敗：' + (err.message || '請檢查網路連線')
    };
  }
}


window.companyData = [];
window.isManualMode = false; // 標記是否為手動輸入模式

function createCircuitBackground() {
  const circuitBg = document.getElementById('circuitBackground');
  if (!circuitBg) return;
  circuitBg.innerHTML = '';
  const lineCount = Math.floor(window.innerWidth / 100) * 5 + 10;
  for (let i = 0; i < lineCount; i++) {
    const line = document.createElement('div');
    line.className = 'circuit-line';
    line.style.height = `${Math.random() * 1 + 1}px`;
    line.style.width = `${Math.random() * 30 + 10}%`;
    line.style.top = `${Math.random() * 100}%`;
    line.style.left = `${Math.random() * 70}%`;
    line.style.opacity = `${Math.random() * 0.3 + 0.1}`;
    circuitBg.appendChild(line);
  }
}

function showCustomAlert(msg, needResume = false) {
  document.getElementById('customAlertMessage').innerText = msg;
  const btns = document.getElementById('modalButtons');
  if (needResume) {
    btns.innerHTML = `
      <a href="index.html" class="submit-btn px-6 py-3 text-base sm:text-lg font-bold">前往填寫求職登記表</a>
      <button onclick="hideCustomAlert()" class="px-5 py-3 text-base text-lightPurple hover:text-white">取消</button>
    `;
  } else {
    btns.innerHTML = `<button onclick="hideCustomAlert()" class="submit-btn px-9 py-3 text-lg font-bold">知道了</button>`;
  }
  document.getElementById('customAlertModal').classList.remove('hidden');
}

function hideCustomAlert() {
  document.getElementById('customAlertModal').classList.add('hidden');
}

async function getStableLineIdentity() {
  let cachedUid = '';

  try {
    cachedUid = sessionStorage.getItem('appointment_line_user_id') || '';
  } catch (e) {}

  if (typeof liff === 'undefined' || !LIFF_ID) {
    return {
      uid: '',
      inLineClient: false,
      source: 'no_liff'
    };
  }

  try {
    await liff.init({ liffId: LIFF_ID });

    const inLineClient = typeof liff.isInClient === 'function'
      ? liff.isInClient()
      : false;

    if (!liff.isLoggedIn()) {
      return {
        uid: cachedUid,
        inLineClient: inLineClient,
        source: cachedUid ? 'session' : 'not_logged_in'
      };
    }

    // LIFF profile 偶發沒有立即回來時，最多嘗試 3 次
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        const profile = await liff.getProfile();

        if (profile && profile.userId) {
          const uid = String(profile.userId).trim();

          try {
            sessionStorage.setItem(
              'appointment_line_user_id',
              uid
            );
          } catch (e) {}

          return {
            uid: uid,
            inLineClient: inLineClient,
            source: 'liff'
          };
        }
      } catch (profileErr) {
        console.warn(
          `LIFF profile 第 ${attempt} 次取得失敗：`,
          profileErr
        );
      }

      if (attempt < 3) {
        await new Promise(resolve =>
          setTimeout(resolve, attempt * 400)
        );
      }
    }

    // LIFF 本次不穩定，但同一 WebView 曾成功取得過 UID
    return {
      uid: cachedUid,
      inLineClient: inLineClient,
      source: cachedUid ? 'session' : 'profile_failed'
    };

  } catch (e) {
    console.warn('LIFF 初始化失敗：', e);

    return {
      uid: cachedUid,
      inLineClient: true,
      source: cachedUid ? 'session' : 'init_failed'
    };
  }
}

function saveProfilesToSession(uid, profiles) {
  if (!uid || !Array.isArray(profiles) || profiles.length === 0) return;

  try {
    sessionStorage.setItem(
      'appointment_profiles_' + uid,
      JSON.stringify({
        savedAt: Date.now(),
        profiles: profiles
      })
    );
  } catch (e) {}
}

function getProfilesFromSession(uid) {
  if (!uid) return [];

  try {
    const raw = sessionStorage.getItem(
      'appointment_profiles_' + uid
    );

    if (!raw) return [];

    const data = JSON.parse(raw);

    // 同一個 LINE 視窗內暫存 10 分鐘
    if (
      !data ||
      !Array.isArray(data.profiles) ||
      Date.now() - Number(data.savedAt || 0) > 600000
    ) {
      return [];
    }

    return data.profiles;

  } catch (e) {
    return [];
  }
}

async function retryUserProfilesOnce(uid) {
  if (!uid) {
    return {
      success: true,
      userProfiles: []
    };
  }

  // 第一次冷啟動若沒拿到履歷，短暫等待後單獨再確認一次
  await new Promise(resolve => setTimeout(resolve, 700));

  const resp = await fetch(
    `${GAS_API_URL}?action=getUserProfiles&lineUserId=${encodeURIComponent(uid)}&_=${Date.now()}`
  );

  if (!resp.ok) {
    throw new Error('Profile Retry HTTP ' + resp.status);
  }

  return await resp.json();
}

async function initPage() {
  createCircuitBackground();

  let uid = '';

  try {
    if (typeof liff !== 'undefined' && LIFF_ID) {
      await liff.init({ liffId: LIFF_ID });

      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        if (profile && profile.userId) {
          uid = String(profile.userId).trim();
        }
      }
    }
  } catch (e) {
    console.warn('LIFF 初始化失敗：', e);
  }

  window.lineUserId = uid;

  try {
    let profileRes = {
      status: 'not_found',
      profiles: []
    };

    // 先完成 LINE 履歷辨識，避免與職缺 GET 同時搶首次連線
    if (uid) {
      profileRes = await callGasApi(
        'getProfilesByLineUserId',
        { lineUserId: uid },
        'GET'
      );
    }

    document.getElementById('verifyingStatus').classList.add('hidden');

    if (
      uid &&
      profileRes &&
      profileRes.status === 'found' &&
      Array.isArray(profileRes.profiles) &&
      profileRes.profiles.length > 0
    ) {
      window.isManualMode = false;

      const profiles = profileRes.profiles.map(p => ({
        name: p.name || '',
        idNumber: p.idNumber || '',
        timestamp: p.timestamp || ''
      }));

      renderUserSelector(profiles);

    } else if (!uid) {
      window.isManualMode = true;
      document.getElementById('manualInputBox').classList.remove('hidden');

    } else if (profileRes && profileRes.status === 'not_found') {
      window.isManualMode = true;
      document.getElementById('manualInputBox').classList.remove('hidden');

      showCustomAlert(
        '系統查無您的求職登記履歷。請先點選「前往填寫求職登記表」，或直接在下方輸入姓名與身分證預約！',
        true
      );

    } else {
      window.isManualMode = false;
      showCustomAlert(
        (profileRes && profileRes.message)
          ? '履歷比對失敗：' + profileRes.message
          : 'LINE 身份或履歷資料載入暫時不穩定，請重新整理頁面再試一次。'
      );
    }

    // 履歷身份畫面處理完成後，再載入職缺清單
    const companyRes = await callGasApi(
      'getCompanyData',
      {},
      'GET'
    );

    window.companyData = Array.isArray(companyRes)
      ? companyRes
      : [];

    renderCompanyOptions();

  } catch (err) {
    console.warn('初始化失敗：', err);
    document.getElementById('verifyingStatus').classList.add('hidden');

    if (!uid) {
      window.isManualMode = true;
      document.getElementById('manualInputBox').classList.remove('hidden');
    } else {
      showCustomAlert(
        'LINE 身份或履歷資料載入暫時不穩定，請重新整理頁面再試一次。'
      );
    }

    document.getElementById('companyListContainer').innerHTML =
      '<p class="text-center text-red-400 py-6 text-lg">職缺清單載入失敗，請重新整理頁面。</p>';
  }
}

function renderUserSelector(profiles) {
  const box = document.getElementById('userSelectorBox');
  const list = document.getElementById('userCardsList');
  const tag = document.getElementById('userCountTag');
  list.innerHTML = '';
  tag.innerText = `偵測到此帳號有 ${profiles.length} 筆履歷`;
  profiles.forEach((p, idx) => {
    const maskedId = p.idNumber ? (p.idNumber.substring(0, 4) + '***') : '';
    const card = document.createElement('div');
    card.className = `user-card ${idx === 0 ? 'active' : ''}`;
    card.onclick = () => selectUser(p, card);
    card.innerHTML = `
      <div class="flex items-center justify-between">
        <span class="font-bold text-white text-lg sm:text-xl">${p.name}</span>
        <span class="text-xs sm:text-sm text-circuitCyan border border-circuitCyan/40 px-2 py-0.5 rounded">${maskedId}</span>
      </div>
      <div class="text-xs sm:text-sm text-lightPurple mt-1.5">登記時間: ${p.timestamp}</div>
    `;
    list.appendChild(card);
  });
  selectUser(profiles[0], list.children[0]);
  box.classList.remove('hidden');
}

function selectUser(profile, cardEl) {
  document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'));
  if (cardEl) cardEl.classList.add('active');
  document.getElementById('selectedName').value = profile.name;
  document.getElementById('selectedIdNumber').value = profile.idNumber;
}

function renderCompanyOptions() {
  const container = document.getElementById('companyListContainer');
  container.innerHTML = '';
  const urlParams = new URLSearchParams(window.location.search);
  const targetCompany = urlParams.get('company') ? decodeURIComponent(urlParams.get('company')) : '';
  const targetPosition = urlParams.get('position') ? decodeURIComponent(urlParams.get('position')) : '';

  if (window.companyData && window.companyData.length > 0) {
    window.companyData.forEach(c => {
      const d = document.createElement('div');
      d.className = 'company-group space-y-3';
      d.innerHTML = `<h3 class="company-title text-xl sm:text-2xl font-bold text-circuitCyan">${c.company}</h3>`;
      
      if (c.positions && c.positions.length > 0) {
        const s = document.createElement('select');
        s.dataset.company = c.company;
        s.className = 'w-full px-4 py-3.5 text-lg sm:text-xl rounded-xl';
        
        let optionsHTML = '<option value="">請選擇職務</option>';
        c.positions.forEach(p => {
          const isSelected = (c.company === targetCompany && (p === targetPosition || p.includes(targetPosition))) ? 'selected' : '';
          optionsHTML += `<option value="${p}" ${isSelected}>${p}</option>`;
        });
        s.innerHTML = optionsHTML;
        d.appendChild(s);
      } else {
        d.innerHTML += '<p class="text-gray-400 italic mt-2 text-base sm:text-lg">目前無提供職務</p>';
      }
      container.appendChild(d);
    });
    if (targetCompany) {
      setTimeout(() => {
        const targetSelect = document.querySelector(`select[data-company="${targetCompany}"]`);
        if (targetSelect) targetSelect.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    }
  } else {
    container.innerHTML = '<p class="text-center text-red-400 text-lg">目前尚無職缺清單。</p>';
  }
}


document.addEventListener('DOMContentLoaded', function() {
  initPage();
  document.getElementById('reservationForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    let nameVal = '';
    let idVal = '';

    if (window.isManualMode) {
      nameVal = document.getElementById('manualName').value.trim();
      idVal = document.getElementById('manualIdNumber').value.trim().toUpperCase();

      if (!nameVal || !idVal) {
        showCustomAlert('請輸入姓名與身分證字號！');
        return;
      }

    } else {
      nameVal = document.getElementById('selectedName').value;
      idVal = document.getElementById('selectedIdNumber').value;

      if (!nameVal || !idVal) {
        showCustomAlert('請點選上方卡片選擇應徵者身份！');
        return;
      }
    }

    const sels = document.querySelectorAll('select[data-company]');
    const pos = [];

    sels.forEach(s => {
      if (s.value) {
        pos.push({
          company: s.dataset.company,
          position: s.value
        });
      }
    });

    if (pos.length === 0) {
      showCustomAlert('請至少選擇一個職務進行預約！');
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;

    document.getElementById('submitBtnText').innerHTML =
      '預約中... <span class="spinner"></span>';

    // 完全沿用「履歷填寫與預約面試」最終穩定版的 bookAppointments API
    const r = await callGasApi(
      'bookAppointments',
      {
        appointmentData: {
          name: nameVal,
          id: idVal,
          companyPositions: pos,
          lineUserId: window.lineUserId || ''
        }
      },
      'POST'
    );

    submitBtn.disabled = false;
    document.getElementById('submitBtnText').innerText = '提交預約面試';

    if (r && r.status === 'success') {
      let h =
        '<div class="text-center text-3xl sm:text-4xl font-extrabold mb-4 text-successGreen">' +
        '預約成功！請隨時留意LINE的面試通知！</div>';

      h +=
        `<p class="text-center text-lg sm:text-xl mb-6 text-nearWhite">` +
        `已成功為 <span class="text-circuitCyan font-bold">${nameVal}</span> 完成預約：</p>`;

      h +=
        '<div class="space-y-3 bg-darkPurple/60 p-5 sm:p-6 rounded-2xl border border-lightPurple/30 mb-8">';

      pos.forEach(i => {
        h +=
          `<div class="border-b border-lightPurple/20 pb-3 last:border-b-0 text-base sm:text-xl">` +
          `<span class="text-circuitCyan font-bold">${i.company}</span> ➔ ` +
          `<span class="text-white">${i.position}</span></div>`;
      });

      h += '</div>';
      h +=
        '<div class="text-center">' +
        '<a href="query.html" class="submit-btn inline-block px-10 py-3.5 text-xl font-bold">' +
        '查看預約紀錄</a></div>';

      document.getElementById('successMessageContent').innerHTML = h;
      document.getElementById('appointmentSection').classList.add('hidden');
      document.getElementById('successMessageContainer').classList.remove('hidden');
      window.scrollTo(0, 0);

    } else {
      showCustomAlert(
        (r && r.message)
          ? r.message
          : '預約失敗，請重試'
      );
    }
  });
});
</script>
</body>
</html>
