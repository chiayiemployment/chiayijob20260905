      position: relative;

      justify-content: space-between;

    }
    .logo-area {

      align-items: center;
      height: 100%;
      z-index: 2;
    }
    .logo-area img {

      display: block;

    .main-title {
      position: absolute;
      left: 50%;

      font-weight: 900;
      letter-spacing: 6px;
      color: #FFFFFF;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.7);

      pointer-events: none;
      z-index: 1;

      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #38BDF8;
      z-index: 2;
    }

    /* 三欄排版區域 */
    .columns-container {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 8px;
      overflow: hidden;
      margin-bottom: 6px;

    .column {

      flex-direction: column;
      gap: 6px;
      height: 100%;
      min-height: 0;

      flex-shrink: 0;

    .table-container {

      display: flex;
      flex-direction: column;
      min-height: 0;

    table {

      height: 100%;
      border-collapse: collapse;
      color: #000;
      table-layout: fixed;
    }
    th {

      padding-left: 4px;
      font-size: 0.84rem;

    td.headcount-cell {

      text-align: center;

        [19]                // Col 3: 19佐登妮絲(15) = 15 列
      ],
      // 頁 3 (20 ~ 26)
      [
        [20, 21, 22],       // Col 1: 20嘉楠(8) + 21上銀(5) + 22矽品(7) = 20 列
        [23, 24],           // Col 2: 23晶成(15) + 24鍵祥(5) = 20 列
        [25, 26]            // Col 3: 25福隆(13) + 26科定(6) = 19 列
      ],
      // 頁 4 (27 ~ 35)
      [
        [27, 28, 29],       // Col 1: 27遠東(7) + 28啟坤(7) + 29和大(5) = 19 列
        [30, 31, 32],       // Col 2: 30新鈺(6) + 31耐斯(6) + 32愛之味(6) = 18 列
        [33, 34, 35]        // Col 3: 33第一生技(5) + 34光泉(4) + 35分享家(4) = 13 列
      ]
    ];

    let currentPageIdx = 0;
    const FLIP_INTERVAL = 20000;

    function renderCompanyTable(comp) {
      let rowsHtml = '';
      comp.jobs.forEach(j => {
        rowsHtml += `
          <tr>
            <td class="no-cell" style="width:10%;">${j.no}</td>
            <td class="title-cell" style="width:33%;">${j.title}</td>
            <td class="headcount-cell" style="width:8%;">${j.headcount}</td>
            <td class="edu-cell" style="width:15%;">${j.education}</td>
            <td class="salary-cell" style="width:34%;">${j.salary}</td>
          </tr>
        `;
      });

      // 依職缺筆數加權分配高度，多筆職缺有足夠高度，少筆職缺不佔多餘空間
      const flexWeight = comp.jobs.length + 1.6;

      return `
        <div class="company-table-card" style="flex: ${flexWeight} 1 0;">
          <div class="company-header">${comp.company}</div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th style="width:10%;">編號</th>
                  <th style="width:33%;">職缺名稱</th>
                  <th style="width:8%;">人數</th>
                  <th style="width:15%;">學歷</th>
                  <th style="width:34%;">薪資</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderPage(pageIdx) {
      currentPageIdx = pageIdx;
      const pageCols = PAGES_COLUMNS_CONFIG[pageIdx];
      const container = document.getElementById('columnsContainer');
      container.innerHTML = '';

      document.getElementById('pageIndicator').textContent = `頁次：${pageIdx + 1}/${PAGES_COLUMNS_CONFIG.length} (每 20 秒自動翻頁)`;

      for (let c = 0; c < 3; c++) {
        const colDiv = document.createElement('div');
        colDiv.className = 'column';

        let colHtml = '';
        pageCols[c].forEach(compIdx => {
          colHtml += renderCompanyTable(COMPANIES_DATA[compIdx]);
        });

        colDiv.innerHTML = colHtml;
        container.appendChild(colDiv);
      }
    }

    setInterval(() => {
      currentPageIdx = (currentPageIdx + 1) % PAGES_COLUMNS_CONFIG.length;
      renderPage(currentPageIdx);
    }, FLIP_INTERVAL);

    document.addEventListener('DOMContentLoaded', () => {
      renderPage(0);
    });
  </script>
</body>
</html>
