<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>履歷填寫與預約面試</title>
<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        deepPurple: "#1F1D53", midPurple: "#6B257F", darkPurple: "#4C237C",
        deepBlue: "#053D88", blue: "#01529F", royalBlue: "#2956A8",
        lightPurple: "#A48DCD", nearWhite: "#EDEEF7", circuitCyan: "#28C4FF",
        dateBlockBg: "#7E2AFF", buttonGradStart: "#AC3FFF", buttonGradEnd: "#6A1BCB",
      },
    },
  },
};
</script>
<style>
:root {
  --deep-purple: #1F1D53; --mid-purple: #6B257F; --dark-purple: #4C237C;
  --deep-blue: #053D88; --blue: #01529F; --royal-blue: #2956A8;
  --light-purple: #A48DCD; --near-white: #EDEEF7; --white: #FFFFFF;
  --bright-cyan: #28C4FF; --date-purple: #7E2AFF;
  --button-start: #AC3FFF; --button-end: #6A1BCB;
  --error-red: #ff6b6b; --success-green: #4ade80;
  --light-purple-30: rgba(164, 141, 205, 0.3);
}
body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--deep-purple); color: var(--white); position: relative; overflow-x: hidden; min-height: 100vh; }
.circuit-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.circuit-line { position: absolute; background-color: var(--dark-purple); box-shadow: 0 0 5px var(--blue); }
.circuit-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background-color: var(--bright-cyan); box-shadow: 0 0 8px var(--bright-cyan); }
.left-gradient { position: fixed; top: 0; left: 0; width: 30%; height: 100%;
background: linear-gradient(90deg, var(--deep-blue) 0%, rgba(5, 61, 136, 0) 100%); z-index: 1; pointer-events: none; }
.main-content-area { position: relative; z-index: 10; }
.form-container { position: relative; z-index: 1; background: linear-gradient(135deg, rgba(31, 29, 83, 0.9) 0%, rgba(76, 35, 124, 0.8) 100%); border-radius: 16px;
box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px); border: 1px solid rgba(164, 141, 205, 0.18); }
.form-container + .form-container, .form-container + .status-message-container { margin-top: 2rem; }
.form-header { background: linear-gradient(90deg, var(--deep-blue), var(--dark-purple)); border-bottom: 2px solid var(--bright-cyan); box-shadow: 0 4px 12px rgba(5, 61, 136, 0.5); }
.form-title { text-shadow: 0 2px 4px var(--mid-purple); }
input[type="text"], input[type="tel"], input[type="email"], select, textarea { background-color: rgba(31, 29, 83, 0.7) !important; border: 1px solid var(--light-purple) !important;
color: var(--white) !important; transition: all 0.3s ease !important; border-radius: 8px !important; }
input::placeholder { color: rgba(237, 238, 247, 0.6) !important; }
select { appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%23a48dcd"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>') !important;
background-repeat: no-repeat !important; background-position: right 0.75rem center !important; background-size: 1.2em 1.2em !important; padding-right: 2.5rem !important; }
input:focus, select:focus, textarea:focus { border-color: var(--bright-cyan) !important; box-shadow: 0 0 0 2px rgba(40, 196, 255, 0.3) !important; outline: none !important;
background-color: rgba(31, 29, 83, 0.8) !important; }
select option { background-color: var(--dark-purple); color: var(--white); }
input.input-error, select.input-error, textarea.input-error { border-color: var(--error-red) !important; }
input.input-error:focus, select.input-error:focus, textarea.input-error:focus { border-color: var(--error-red) !important; box-shadow: 0 0 0 2px rgba(255, 107, 107, 0.3) !important; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--bright-cyan); }
.submit-btn { background: linear-gradient(135deg, var(--button-start), var(--button-end)); box-shadow: 0 4px 12px rgba(172, 63, 255, 0.3); transition: all 0.3s ease; position: relative;
border-radius: 8px; color: var(--white); font-weight: 500; border: none; cursor: pointer; text-align: center; }
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
.spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: var(--white); width: 1.25rem; height: 1.25rem;
animation: spin 1s linear infinite; display: inline-block; margin-left: 0.5rem; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(172, 63, 255, 0.5); }
.submit-btn:active:not(:disabled) { transform: translateY(1px); }
.secondary-btn { background-color: rgba(76, 35, 124, 0.6); border: 1px solid var(--light-purple); color: var(--near-white); transition: all 0.3s ease; border-radius: 8px;
font-weight: 500; cursor: pointer; text-align: center; }
.secondary-btn:hover:not(:disabled) { background-color: rgba(76, 35, 124, 0.8); border-color: var(--bright-cyan); }
.secondary-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.review-label { font-weight: 500; color: var(--light-purple); }
.review-value { word-break: break-word; color: var(--near-white); }
.status-message { text-align: center; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; font-weight: 500; border: 1px solid transparent; }
.status-message.success { background-color: rgba(74, 222, 128, 0.1); border-color: var(--success-green); text-align: left; }
.status-message.error { background-color: rgba(255, 107, 107, 0.1); color: var(--error-red); border-color: var(--error-red); white-space: pre-wrap; }
.error-message-inline { color: var(--error-red); font-size: 0.875rem; margin-top: 0.25rem; font-weight: 500; }
.hidden { display: none !important; }
.info-message-inline { color: var(--bright-cyan); font-size: 0.875rem; margin-top: 0.25rem; font-weight: 500; }
.company-group { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--light-purple-30); }
.company-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.company-title { font-size: 1.25rem; font-weight: 600; color: var(--bright-cyan); margin-bottom: 0.75rem; }
</style>
<base target="_top">
</head>
<body class="min-h-screen py-8 text-lg">
<div class="circuit-background" id="circuitBackground"></div>
<div class="left-gradient"></div>
<div class="main-content-area max-w-3xl mx-auto">
<div id="generalMessageArea" class="status-message hidden"></div>

<!-- 表單容器 -->
<div id="formContainer" class="form-container p-5 sm:p-7 md:p-9">
  <div class="form-header -mx-5 sm:-mx-7 md:-mx-9 -mt-5 sm:-mt-7 md:-mt-9 mb-8 sm:mb-10 py-5 px-5 sm:py-6 sm:px-7 md:px-9 rounded-t-lg">
    <h1 class="form-title text-3xl lg:text-4xl font-bold text-center">履歷填寫與預約面試</h1>
  </div>
  <form id="dataForm" class="space-y-6 md:space-y-5">
    <input type="hidden" id="lineUserId" name="lineUserId" value="" />
    
    <!-- 個資宣告區塊 -->
    <div class="text-lg md:text-base border-b border-lightPurple/30 pb-6 space-y-4">
      <p class="font-semibold text-xl text-circuitCyan mb-2">【個資宣告】</p>
      <p>本表單蒐集之個人資料，僅限於應徵「嘉義就業中心」所刊登職缺，與嘉義就業中心查詢個資使用，不轉做其他用途，亦不會公佈任何資訊，並遵循本中心資料保存與安全控管辦理。</p>
      <p class="text-base md:text-sm text-gray-400">※個資法條文詳情請參閱：
        <a href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0050021" target="_blank" rel="noopener noreferrer" class="text-circuitCyan hover:underline focus:outline-none focus:ring-2 focus:ring-circuitCyan rounded"> 全國法規資料庫-個人資料保護法 </a>
      </p>
      <div class="pt-2 space-y-2">
        <label class="block font-medium text-lg md:text-base">請詳閱上方宣告後，點選同意以繼續：<span class="text-red-500">*</span></label>
        <div class="flex flex-wrap gap-x-6 gap-y-2 pt-1">
          <label class="flex items-center gap-2"> <input type="radio" name="agreement" value="同意" required class="h-5 w-5 md:h-4 md:w-4"> <span class="text-lg md:text-base">同意</span> </label>
          <label class="flex items-center gap-2"> <input type="radio" name="agreement" value="不同意" class="h-5 w-5 md:h-4 md:w-4"> <span class="text-lg md:text-base">不同意</span> </label>
        </div>
        <div id="agreementError" class="error-message-inline hidden">請先同意才能繼續填寫</div>
      </div>
    </div>

    <!-- 填寫欄位 (初始 hidden，同意後滑出) -->
    <div id="formFields" class="space-y-6 md:space-y-5 hidden">
      <div class="space-y-2">
        <label for="infoSource" class="block text-lg md:text-base font-medium">如何得知活動訊息：<span class="text-red-500">*</span></label>
        <select id="infoSource" name="infoSource" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" required>
          <option value="" disabled selected>請選擇...</option>
          <option value="就業中心告知(臨櫃、電話)">就業中心告知(臨櫃、電話)</option>
          <option value="台灣就業通">台灣就業通</option>
          <option value="Line群組">Line群組</option>
          <option value="FaceBook/Instagram">FaceBook/Instagram</option>
          <option value="親友告知">親友告知</option>
          <option value="手機簡訊">手機簡訊</option>
          <option value="報紙新聞">報紙新聞</option>
          <option value="求才令">求才令</option>
          <option value="路上廣告(宣傳車/旗幟)">路上廣告(宣傳車/旗幟)</option>
          <option value="其他">其他</option>
        </select>
        <div id="otherInfoSourceContainer" class="hidden mt-3">
          <input type="text" id="otherInfoSourceText" name="otherInfoSourceText" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" placeholder="請說明其他來源...">
        </div>
      </div>
      <div class="space-y-2">
        <label for="name" class="block text-lg md:text-base font-medium">姓名：<span class="text-red-500">*</span></label>
        <input type="text" id="name" name="name" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" required>
      </div>
      <div class="space-y-2">
        <label for="birthdate" class="block text-lg md:text-base font-medium">出生日期：<span class="text-red-500">*</span></label>
        <input type="text" id="birthdate" name="birthdate" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" required maxlength="7" placeholder="請輸入民國日期，如：0801010">
      </div>
      <div class="space-y-2">
        <label for="idNumber" class="block text-lg md:text-base font-medium">身份證字號(居留證號)：<span class="text-red-500">*</span></label>
        <input type="text" id="idNumber" name="idNumber" class="w-full px-4 py-3 text-lg md:text-base rounded-lg uppercase" required pattern="^[A-Z][1-2A-D8-9]\d{8}$" title="請輸入有效的身份證字號或居留證號格式">
      </div>
      <div class="space-y-2">
        <label class="block text-lg md:text-base font-medium">婚姻狀況：</label>
        <div class="flex flex-wrap gap-x-6 gap-y-3 pt-1">
          <label class="flex items-center gap-2"><input type="radio" name="maritalStatus" value="單身" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">單身</span></label>
          <label class="flex items-center gap-2"><input type="radio" name="maritalStatus" value="已婚" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">已婚</span></label>
        </div>
      </div>
      <div class="space-y-2">
        <label class="block text-lg md:text-base font-medium">兵役狀況：</label>
        <div class="flex flex-wrap gap-x-6 gap-y-3 pt-1">
          <label class="flex items-center gap-2"><input type="radio" name="militaryStatus" value="未役" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">未役</span></label>
          <label class="flex items-center gap-2"><input type="radio" name="militaryStatus" value="役畢" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">役畢</span></label>
          <label class="flex items-center gap-2"><input type="radio" name="militaryStatus" value="免役" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">免役</span></label>
        </div>
      </div>
      <div class="space-y-2">
        <label for="address" class="block text-lg md:text-base font-medium">聯絡地址：<span class="text-red-500">*</span></label>
        <input type="text" id="address" name="address" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" required>
      </div>
      <div class="space-y-2">
        <label for="phone" class="block text-lg md:text-base font-medium">聯絡電話：<span class="text-red-500">*</span></label>
        <input type="tel" id="phone" name="phone" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" required>
      </div>
      <div class="space-y-2">
        <label for="email" class="block text-lg md:text-base font-medium">E-mail：</label>
        <input type="email" id="email" name="email" class="w-full px-4 py-3 text-lg md:text-base rounded-lg">
      </div>
      <div class="space-y-2">
        <label for="education" class="block text-lg md:text-base font-medium">最高學歷(畢業)：<span class="text-red-500">*</span></label>
        <select id="education" name="education" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" required>
          <option value="" disabled selected>請選擇...</option>
          <option value="國小">國小</option><option value="國中">國中</option><option value="高中(職)">高中(職)</option><option value="專科">專科</option><option value="大學">大學</option><option value="碩士">碩士</option><option value="博士">博士</option>
        </select>
      </div>
      <div class="space-y-2">
        <label for="school" class="block text-lg md:text-base font-medium">畢(肄)業學校：<span class="text-red-500">*</span></label>
        <input type="text" id="school" name="school" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" required>
      </div>
      <div class="space-y-2">
        <label for="major" class="block text-lg md:text-base font-medium">畢業科系：<span class="text-red-500">*</span></label>
        <input type="text" id="major" name="major" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" required>
      </div>
      <div class="space-y-2">
        <label for="workExperience" class="block text-lg md:text-base font-medium">工作經歷：<span class="text-red-500">*</span></label>
        <p class="text-lg md:text-base text-lightPurple mb-2">請依照「公司名稱/擔任職務/年資」順序填寫，最多三筆</p>
        <textarea id="workExperience" name="workExperience" rows="4" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" required></textarea>
      </div>
      <div class="space-y-2">
        <label class="block text-lg md:text-base font-medium">駕照種類：</label>
        <div class="flex flex-wrap gap-x-6 gap-y-3 pt-1">
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="輕型機車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">輕型機車</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="重型機車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">重型機車</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="大型重型機車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">大型重型機車</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="普通小客車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">普通小客車</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="職業小客車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">職業小客車</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="職業大貨車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">職業大貨車</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="普通大客車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">普通大客車</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="職業大客車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">職業大客車</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="普通聯結車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">普通聯結車</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="license" value="職業聯結車" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">職業聯結車</span></label>
        </div>
      </div>
      <div class="space-y-2">
        <label class="block text-lg md:text-base font-medium">電腦能力：</label>
        <p class="text-lg md:text-base text-lightPurple mb-2">如需詳述軟體名稱請勾選「其他」選項中說明 (如：CorelDraw、Mastercam、鼎新等..)</p>
        <div class="flex flex-wrap gap-x-6 gap-y-3 pt-1">
          <label class="flex items-center gap-2"><input type="checkbox" name="computerSkill" value="文書處理" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">文書處理</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="computerSkill" value="會計系統" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">會計系統</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="computerSkill" value="美工繪圖" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">美工繪圖</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="computerSkill" value="影音剪輯" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">影音剪輯</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="computerSkill" value="工業製圖" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">工業製圖</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" id="otherComputerSkillCheckbox" name="computerSkill" value="其他" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">其他</span></label>
        </div>
        <div id="otherComputerSkillContainer" class="hidden mt-3">
          <input type="text" id="otherComputerSkillText" name="otherComputerSkillText" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" placeholder="請說明其他電腦能力...">
        </div>
      </div>
      <div class="space-y-2">
        <label class="block text-lg md:text-base font-medium">語文能力：</label>
        <div class="flex flex-wrap gap-x-6 gap-y-3 pt-1">
          <label class="flex items-center gap-2"><input type="checkbox" name="language" value="國語" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">國語</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="language" value="台語" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">台語</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="language" value="英語" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">英語</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="language" value="日語" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">日語</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="language" value="韓語" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">韓語</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="language" value="越語" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">越語</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="language" value="泰語" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">泰語</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" name="language" value="印尼語" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">印尼語</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" id="otherLanguageCheckbox" name="language" value="其他" class="h-5 w-5 md:h-4 md:w-4"><span class="text-lg md:text-base">其他</span></label>
        </div>
        <div id="otherLanguageContainer" class="hidden mt-3">
          <input type="text" id="otherLanguageText" name="otherLanguageText" class="w-full px-4 py-3 text-lg md:text-base rounded-lg" placeholder="請說明其他語文能力...">
        </div>
      </div>
      <div class="pt-5">
        <button type="submit" id="submitBtn" class="submit-btn w-full px-4 py-3 text-2xl lg:text-3xl md:text-xl md:py-3">提交檢查履歷</button>
      </div>
    </div>
  </form>
</div>

<!-- 預覽資料區塊 -->
<div id="reviewSection" class="form-container mt-10 p-6 sm:p-8 hidden">
  <div class="form-header -mx-6 sm:-mx-8 -mt-6 sm:-mt-8 mb-6 sm:mb-8 py-5 px-6 sm:py-6 sm:px-8 rounded-t-lg">
    <h2 id="reviewTitle" class="text-2xl md:text-xl font-bold text-center">請確認您的履歷資料</h2>
  </div>
  <div class="space-y-5 md:space-y-4" id="reviewContent"></div>
  <div class="review-buttons mt-8 flex flex-col md:flex-row justify-center gap-4 md:gap-6">
    <button id="editBtn" class="secondary-btn w-full md:w-auto px-4 py-3 text-xl md:text-lg">重新編輯履歷</button>
    <button id="confirmBtn" class="submit-btn w-full md:w-auto px-4 py-3 text-xl md:text-lg">確認履歷並預約面試</button>
  </div>
</div>

<!-- 預約面試區塊 -->
<div id="appointmentSection" class="form-container mt-10 p-6 sm:p-8 hidden">
  <div class="form-header -mx-6 sm:-mx-8 -mt-6 sm:-mt-8 mb-6 sm:mb-8 py-5 px-6 sm:py-6 sm:px-8 rounded-t-lg">
    <h2 id="appointmentTitle" class="text-2xl md:text-xl font-bold text-center">選擇預約面試職務名稱</h2>
  </div>
  <p class="text-lg font-bold text-left text-[#FFC72C] mb-4">如欲應徵同家公司兩項以上職務，請於面試時告知。</p>
  <div class="space-y-5 md:space-y-4 mb-6" id="companyListContainer">
    <p class="text-center text-lightPurple">載入職務列表中...</p>
  </div>
  <div id="appointmentError" class="error-message-inline hidden mb-4 text-center">請至少選擇一個職務進行預約。</div>
  <div class="appointment-buttons mt-8 flex flex-col md:flex-row justify-center gap-4 md:gap-6">
    <button id="confirmAppointmentBtn" class="submit-btn w-full md:w-auto px-4 py-3 text-xl md:text-lg">確認預約</button>
  </div>
</div>

</div>

<script>
// 1. 配置變數
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzq1TYCAlybCatNy3GyN-B1HwQ042ZycPBHzMRcbfiRHSPbzyt8tcFjlGR9Ed552ghclw/exec';
const LIFF_ID = '2010785535-mhv97vPS';
window.lineUserId = '';
window.formData = {}; 
window.companyData = []; 
window.currentBookingInfo = {};

// 2. 通用 API 呼叫工具
async function callGasApi(action, payload = {}, method = 'GET') {
  try {
    if (method === 'GET') {
      const query = new URLSearchParams({ action, ...payload }).toString();
      const resp = await fetch(`${GAS_API_URL}?${query}`);
      return await resp.json();
    } else {
      const resp = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload })
      });
      return await resp.json();
    }
  } catch (err) {
    console.warn('API 呼叫失敗:', err);
    return { status: 'error', message: '連線逾時' };
  }
}

// 3. 關鍵修正：加強版 LIFF 初始化 (確保 100% 取得 UserId)
async function initLiff() {
  try {
    if (typeof liff !== 'undefined' && LIFF_ID) {
      await liff.init({ liffId: LIFF_ID });
      
      // 若尚未登入且在 LINE 內，自動喚起登入
      if (!liff.isLoggedIn()) {
        if (liff.isInClient()) {
          liff.login();
        }
        return;
      }

      // 取得 Profile
      const profile = await liff.getProfile();
      if (profile && profile.userId) {
        window.lineUserId = profile.userId;
        const lineUserIdInput = document.getElementById('lineUserId');
        if (lineUserIdInput) lineUserIdInput.value = profile.userId;
        console.log('✅ 成功抓取 LINE UserId:', profile.userId);
      }
    }
  } catch (err) {
    console.warn('LIFF 初始化失敗:', err);
  }
}

// 4. 電路背景動畫
function createCircuitBackground() {
  const circuitBg = document.getElementById('circuitBackground');
  if (!circuitBg) return;
  circuitBg.innerHTML = '';
  const lineCount = Math.floor(window.innerWidth / 100) * 5 + 10;
  for (let i = 0; i < lineCount; i++) {
    const line = document.createElement('div');
    line.className = 'circuit-line';
    line.style.height = `${Math.random() * 1 + 1}px`;
    line.style.width = `${Math.random() * 30 + 10}%`;
    line.style.top = `${Math.random() * 100}%`;
    line.style.left = `${Math.random() * 70}%`;
    line.style.opacity = `${Math.random() * 0.3 + 0.1}`;
    circuitBg.appendChild(line);
  }
}

// 5. DOM 載入主要邏輯
document.addEventListener('DOMContentLoaded', function() {
  createCircuitBackground();
  initLiff();

  const mainFormContainer = document.getElementById('formContainer');
  const form = document.getElementById('dataForm');
  const formFields = document.getElementById('formFields');
  const agreementRadios = document.getElementsByName('agreement');
  const agreementError = document.getElementById('agreementError');
  const reviewSection = document.getElementById('reviewSection');
  const reviewContent = document.getElementById('reviewContent');
  const editBtn = document.getElementById('editBtn');
  const confirmBtn = document.getElementById('confirmBtn');
  const appointmentSection = document.getElementById('appointmentSection');
  const companyListContainer = document.getElementById('companyListContainer');
  const appointmentError = document.getElementById('appointmentError');
  const confirmAppointmentBtn = document.getElementById('confirmAppointmentBtn');
  const infoSource = document.getElementById('infoSource');
  const otherInfoSourceContainer = document.getElementById('otherInfoSourceContainer');
  const otherInfoSourceInput = document.getElementById('otherInfoSourceText');
  const birthdateInput = document.getElementById('birthdate');

  function updateAgreementView() {
    let isAgree = false;
    if (agreementRadios && agreementRadios.length > 0) {
      Array.from(agreementRadios).forEach(r => {
        if (r.checked && r.value === '同意') isAgree = true;
      });
    }
    if (formFields) formFields.classList.toggle('hidden', !isAgree);
    if (agreementError) agreementError.classList.toggle('hidden', isAgree);
  }

  if (agreementRadios && agreementRadios.length > 0) {
    Array.from(agreementRadios).forEach(r => {
      r.addEventListener('change', updateAgreementView);
    });
  }
  updateAgreementView();

  function handleOtherOptionToggle(selectElementOrCheckbox, otherContainer, otherInput) {
    if (!selectElementOrCheckbox || !otherContainer || !otherInput) return;
    const isOtherSelected = selectElementOrCheckbox.type === 'checkbox' ? (selectElementOrCheckbox.checked && selectElementOrCheckbox.value === '其他') : (selectElementOrCheckbox.value === '其他');
    otherContainer.classList.toggle('hidden', !isOtherSelected); otherInput.required = isOtherSelected; if (!isOtherSelected) otherInput.value = '';
  }

  [infoSource, document.getElementById('otherComputerSkillCheckbox'), document.getElementById('otherLanguageCheckbox')].forEach((el, idx) => {
    if(!el) return;
    const targets = [
      [otherInfoSourceContainer, otherInfoSourceInput], 
      [document.getElementById('otherComputerSkillContainer'), document.getElementById('otherComputerSkillText')], 
      [document.getElementById('otherLanguageContainer'), document.getElementById('otherLanguageText')]
    ];
    el.addEventListener('change', () => handleOtherOptionToggle(el, targets[idx][0], targets[idx][1]));
  });

  callGasApi('getCompanyData', {}, 'GET').then(res => {
    window.companyData = Array.isArray(res) ? res : [];
  });

  // 預覽履歷資料 (關鍵：雙重確認打包 UserId)
  form.addEventListener('submit', function(e) {
    e.preventDefault(); 
    if(!Array.from(agreementRadios).some(r => r.checked && r.value === '同意')) { alert('請先同意個資宣告。'); return; }
    
    const f = new FormData(form); 
    const b = birthdateInput.value; 
    let xb = "";
    if (b.length >= 6) { const r = parseInt(b.slice(0, -4), 10); xb = `${r + 1911}-${b.slice(-4, -2)}-${b.slice(-2)}`; }
    
    const dReview = {}; 
    f.forEach((v, k) => { if(!['license', 'computerSkill', 'language'].includes(k)) dReview[k] = v; });
    dReview['birthdate'] = xb; 
    dReview['license'] = f.getAll('license'); 
    dReview['computerSkill'] = f.getAll('computerSkill'); 
    dReview['language'] = f.getAll('language');
    
    // 關鍵修復：從 Hidden Input 與全域變數雙重取值，確保不為空
    const currentUserId = document.getElementById('lineUserId').value || window.lineUserId || '';
    dReview['lineUserId'] = currentUserId;
    
    window.formData = dReview; 
    displayDataInReview(dReview);
  });

  function displayDataInReview(dataObject) {
    if(reviewContent) reviewContent.innerHTML = '';
    const reviewOrder = [ {key:'agreement',label:'個資同意'},{key:'infoSource',label:'如何得知訊息'},{key:'name',label:'姓名'},{key:'birthdate',label:'出生日期'},{key:'idNumber',label:'身份證(居留證)'},{key:'phone',label:'聯絡電話'},{key:'workExperience',label:'工作經歷'} ];
    reviewOrder.forEach(item => {
      const val = Array.isArray(dataObject[item.key]) ? dataObject[item.key].join(', ') : (dataObject[item.key] || '未填寫');
      const row = document.createElement('div'); 
      row.className = 'review-item flex flex-col md:flex-row border-b border-lightPurple/30 pb-4';
      row.innerHTML = `<div class="review-label w-full md:w-1/3 text-lightPurple">${item.label}:</div><div class="review-value md:w-2/3 text-nearWhite">${val}</div>`;
      reviewContent.appendChild(row);
    });
    mainFormContainer.classList.add('hidden'); 
    reviewSection.classList.remove('hidden'); 
    window.scrollTo(0, 0);
  }

  editBtn.addEventListener('click', () => { 
    reviewSection.classList.add('hidden'); 
    mainFormContainer.classList.remove('hidden'); 
  });

  // 送出履歷
  confirmBtn.addEventListener('click', async function() {
    const d = { ...window.formData };
    
    // 補強：若變數遺失則再次抓取
    if (!d.lineUserId) {
      d.lineUserId = document.getElementById('lineUserId').value || window.lineUserId || '';
    }

    confirmBtn.disabled = true; 
    confirmBtn.innerHTML = '處理中...';

    const r = await callGasApi('processFormData', { formData: d }, 'POST');
    confirmBtn.disabled = false; 
    confirmBtn.innerHTML = '確認履歷並預約面試';
    
    if (r.status === 'resume_saved' || r.status === 'duplicate_found') {
      displayAppointmentSection({ name: d.name, idNumber: d.idNumber });
    } else {
      alert(r.message || '儲存失敗，請重試');
    }
  });

  function displayAppointmentSection(resumeInfo) {
    window.currentBookingInfo = { name: resumeInfo.name, id: resumeInfo.idNumber };
    companyListContainer.innerHTML = '';
    if (window.companyData && window.companyData.length > 0) {
      window.companyData.forEach((c) => {
        const d = document.createElement('div'); d.className = 'company-group space-y-3 mb-4';
        d.innerHTML = `<h3 class="company-title text-xl font-semibold text-circuitCyan">${c.company}</h3>`;
        if (c.positions && c.positions.length > 0) {
          const s = document.createElement('select'); s.dataset.company = c.company; s.className = 'w-full px-4 py-3 rounded-lg bg-darkPurple text-white';
          s.innerHTML = '<option value="" selected>請選擇職務 </option>' + c.positions.map(p => `<option value="${p}">${p}</option>`).join('');
          d.appendChild(s);
        }
        companyListContainer.appendChild(d);
      });
    } else {
      companyListContainer.innerHTML = '<p class="text-center text-lightPurple">目前無可選預約職務，您可直接完成。</p>';
    }
    reviewSection.classList.add('hidden'); 
    appointmentSection.classList.remove('hidden'); 
    window.scrollTo(0, 0);
  }

  // 預約面試
  confirmAppointmentBtn.addEventListener('click', async function() {
    const sels = companyListContainer.querySelectorAll('select[data-company]'); 
    const pos = [];
    sels.forEach(s => { if(s.value) pos.push({ company: s.dataset.company, position: s.value }); });
    if (pos.length === 0) { appointmentError.classList.remove('hidden'); return; }
    
    confirmAppointmentBtn.disabled = true; 
    confirmAppointmentBtn.innerHTML = '預約中...';

    const uid = document.getElementById('lineUserId').value || window.lineUserId || '';

    const r = await callGasApi('bookAppointments', { 
      appointmentData: {
        name: window.currentBookingInfo.name, 
        id: window.currentBookingInfo.id, 
        companyPositions: pos, 
        lineUserId: uid 
      }
    }, 'POST');

    confirmAppointmentBtn.disabled = false; 
    confirmAppointmentBtn.innerHTML = '確認預約';
    
    if (r.status === 'success') {
      alert('預約面試成功！');
      if (typeof liff !== 'undefined' && liff.isInClient()) {
        liff.closeWindow();
      }
    } else {
      alert(r.message || '預約失敗，請重試');
    }
  });
});
</script>
</body>
</html>
