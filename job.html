<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>詳細職缺資訊</title>
<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        deepPurple: "#1F1D53", midPurple: "#6B257F", darkPurple: "#4C237C",
        deepBlue: "#053D88", blue: "#01529F", royalBlue: "#2956A8",
        lightPurple: "#A48DCD", nearWhite: "#EDEEF7", circuitCyan: "#28C4FF",
        dateBlockBg: "#7E2AFF", buttonGradStart: "#AC3FFF", buttonGradEnd: "#6A1BCB",
        errorRed: "#ff6b6b", successGreen: "#4ade80",
      },
    },
  },
};
</script>
<style>
:root {
  --deep-purple: #1F1D53; --mid-purple: #6B257F; --dark-purple: #4C237C;
  --deep-blue: #053D88; --blue: #01529F; --royal-blue: #2956A8;
  --light-purple: #A48DCD; --near-white: #EDEEF7; --white: #FFFFFF;
  --bright-cyan: #28C4FF; --date-purple: #7E2AFF;
  --button-start: #AC3FFF; --button-end: #6A1BCB;
}
body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--deep-purple); color: var(--white); position: relative; overflow-x: hidden; min-height: 100vh; }
.circuit-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.circuit-line { position: absolute; background-color: var(--dark-purple); box-shadow: 0 0 5px var(--blue); }
.left-gradient { position: fixed; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, var(--deep-blue) 0%, rgba(5, 61, 136, 0) 100%); z-index: 1; pointer-events: none; }
.main-content-area { position: relative; z-index: 10; }
.form-container { position: relative; z-index: 1; background: linear-gradient(135deg, rgba(31, 29, 83, 0.9) 0%, rgba(76, 35, 124, 0.8) 100%); border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px); border: 1px solid rgba(164, 141, 205, 0.18); }
.form-header { background: linear-gradient(90deg, var(--deep-blue), var(--dark-purple)); border-bottom: 2px solid var(--bright-cyan); box-shadow: 0 4px 12px rgba(5, 61, 136, 0.5); }
.form-title { text-shadow: 0 2px 4px var(--mid-purple); }
.submit-btn { background: linear-gradient(135deg, var(--button-start), var(--button-end)); box-shadow: 0 4px 12px rgba(172, 63, 255, 0.3); border-radius: 8px; color: var(--white); font-weight: 500; border: none; cursor: pointer; text-align: center; }

/* 🌟 按鈕頁籤樣式 */
.company-tab-btn {
  background: rgba(76, 35, 124, 0.5);
  border: 1px solid rgba(164, 141, 205, 0.4);
  color: var(--near-white);
  padding: 0.6rem 1.2rem;
  border-radius: 9999px;
  white-space: nowrap;
  font-weight: 500;
  transition: all 0.25s ease;
  cursor: pointer;
  flex-shrink: 0;
}
.company-tab-btn:hover {
  border-color: var(--bright-cyan);
  background: rgba(40, 196, 255, 0.15);
}
.company-tab-btn.active {
  background: var(--bright-cyan);
  color: #1F1D53;
  font-weight: 700;
  border-color: var(--bright-cyan);
  box-shadow: 0 0 12px rgba(40, 196, 255, 0.6);
}

.job-card {
  background: rgba(31, 29, 83, 0.65);
  border: 1px solid rgba(164, 141, 205, 0.3);
  border-radius: 12px;
  transition: transform 0.2s ease;
}
.job-card:hover {
  border-color: rgba(40, 196, 255, 0.5);
}
.hidden { display: none !important; }
.spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: var(--white); width: 1.25rem; height: 1.25rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 隱藏原生橫向滾動條，保持滑動順暢 */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
<base target="_top">
</head>
<body class="min-h-screen py-8 text-lg">
<div class="circuit-background" id="circuitBackground"></div>
<div class="left-gradient"></div>
<div class="main-content-area max-w-3xl mx-auto px-4 space-y-6">

  <!-- 頂部廠商切換區塊 -->
  <div class="form-container p-5 sm:p-7 md:p-9">
    <div class="form-header -mx-5 sm:-mx-7 md:-mx-9 -mt-5 sm:-mt-7 md:-mt-9 mb-6 py-5 px-5 sm:py-6 sm:px-7 md:px-9 rounded-t-lg">
      <h1 class="form-title text-3xl lg:text-4xl font-bold text-center">徵才廠商與詳細職缺</h1>
    </div>

    <p class="text-center text-lightPurple text-base mb-4">請點擊下方公司按鈕，即可查看該廠商的完整職缺與薪資福利：</p>

    <!-- 🌟 按鈕式公司列表 (可左右滑動) -->
    <div id="companyTabContainer" class="flex gap-2 overflow-x-auto pb-3 pt-1 no-scrollbar border-b border-lightPurple/20">
      <div class="text-center w-full py-4 text-circuitCyan flex items-center justify-center gap-2">
        <span class="spinner"></span>
        <span>載入廠商列表中...</span>
      </div>
    </div>
  </div>

  <!-- 職缺列表展示區 -->
  <div id="jobListSection" class="form-container p-6 hidden">
    <div class="flex items-center justify-between border-b border-lightPurple/30 pb-3 mb-6">
      <h2 id="currentCompanyName" class="text-2xl font-bold text-circuitCyan">廠商名稱</h2>
      <span id="jobCountBadge" class="px-3 py-1 bg-blue/30 text-white rounded-full text-sm font-bold">0 個職缺</span>
    </div>

    <!-- 職缺卡片清單容器 -->
    <div id="jobCardsContainer" class="space-y-5"></div>
  </div>

</div>

<script>
// ⚠️ 請確認指向您包含 getCompanyData 與 getJobData 的 GAS API URL
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzctVt7zKO5k-Z5ba_Z40Fj1wIH2MCiStDMB7N4sPYvbhY_tZApS_Eux021gFnQLrZ0/exec';

// ⚠️ 請填入專屬於 job.html 的 LIFF ID (讓頁面在 LINE 內視窗直接開啟)
const LIFF_ID = '2010785535-6BsUuSEy'; 

async function callGasApi(action, payload = {}, method = 'GET') {
  try {
    const query = new URLSearchParams({ action, ...payload }).toString();
    const resp = await fetch(`${GAS_API_URL}?${query}`);
    return await resp.json();
  } catch (err) {
    return [];
  }
}

function createCircuitBackground() {
  const circuitBg = document.getElementById('circuitBackground');
  if (!circuitBg) return;
  circuitBg.innerHTML = '';
  const lineCount = Math.floor(window.innerWidth / 100) * 5 + 10;
  for (let i = 0; i < lineCount; i++) {
    const line = document.createElement('div');
    line.className = 'circuit-line';
    line.style.height = `${Math.random() * 1 + 1}px`;
    line.style.width = `${Math.random() * 30 + 10}%`;
    line.style.top = `${Math.random() * 100}%`;
    line.style.left = `${Math.random() * 70}%`;
    line.style.opacity = `${Math.random() * 0.3 + 0.1}`;
    circuitBg.appendChild(line);
  }
}

// 頁面初始化
async function initJobPage() {
  createCircuitBackground();

  // 1. 初始化 LIFF (確保可以在 LINE 內建瀏覽器滑順開啟)
  try {
    if (typeof liff !== 'undefined' && LIFF_ID && LIFF_ID !== '2010785535-XXXXX') {
      await liff.init({ liffId: LIFF_ID });
    }
  } catch (e) {
    console.warn('LIFF 初始化跳過，使用預設模式');
  }

  // 2. 載入公司按鈕清單
  const companies = await callGasApi('getCompanyData', {}, 'GET');
  const tabContainer = document.getElementById('companyTabContainer');
  tabContainer.innerHTML = '';

  if (Array.isArray(companies) && companies.length > 0) {
    companies.forEach((comp, index) => {
      const btn = document.createElement('button');
      btn.className = `company-tab-btn ${index === 0 ? 'active' : ''}`;
      btn.innerText = comp.company;
      btn.onclick = () => {
        // 切換按鈕 active 高亮狀態
        document.querySelectorAll('.company-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // 載入該公司的詳細職缺
        loadJobsForCompany(comp.company);
      };
      tabContainer.appendChild(btn);
    });

    // 預設自動載入第一家公司的職缺
    loadJobsForCompany(companies[0].company);
  } else {
    tabContainer.innerHTML = '<p class="text-center w-full text-red-400">目前尚無廠商資料。</p>';
  }
}

// 載入指定廠商的詳細職缺清單
async function loadJobsForCompany(companyName) {
  const container = document.getElementById('jobCardsContainer');
  document.getElementById('currentCompanyName').innerText = companyName;
  document.getElementById('jobListSection').classList.remove('hidden');

  container.innerHTML = `
    <div class="text-center py-8 text-lightPurple flex items-center justify-center gap-2">
      <span class="spinner"></span>
      <span>正在讀取 ${companyName} 的職缺細節...</span>
    </div>
  `;

  const jobs = await callGasApi('getJobData', { company: companyName }, 'GET');
  
  document.getElementById('jobCountBadge').innerText = `${jobs.length} 個職缺`;
  container.innerHTML = '';

  if (Array.isArray(jobs) && jobs.length > 0) {
    jobs.forEach(job => {
      const card = document.createElement('div');
      card.className = 'job-card p-5 space-y-3';
      card.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-lightPurple/20 pb-2">
          <h3 class="text-xl font-bold text-white flex items-center gap-2">
            <span class="text-circuitCyan">🔹</span> ${job.title}
          </h3>
          <span class="text-lg font-bold text-yellow-300 bg-darkPurple/60 px-3 py-1 rounded-lg border border-yellow-300/30">
            💰 ${job.salary || '面議'}
          </span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-nearWhite">
          <div><span class="text-lightPurple">🎓 學歷要求：</span>${job.education || '不限'}</div>
          <div><span class="text-lightPurple">⏰ 工作班別：</span>${job.shift || '日班/依公司規定'}</div>
        </div>

        ${job.description ? `
          <div class="text-sm bg-darkPurple/40 p-3 rounded-lg border border-lightPurple/10 text-gray-200">
            <span class="text-lightPurple block font-medium mb-1">📋 內容說明：</span>
            <p class="whitespace-pre-line">${job.description}</p>
          </div>
        ` : ''}

        <div class="pt-2 text-right">
          <a href="appointment.html" class="submit-btn inline-block px-5 py-2 text-sm font-bold">
            🚀 預約此面試職缺
          </a>
        </div>
      `;
      container.appendChild(card);
    });
  } else {
    container.innerHTML = `<p class="text-center py-6 text-gray-400">目前 ${companyName} 暫無提供詳細職缺說明。</p>`;
  }
}

document.addEventListener('DOMContentLoaded', initJobPage);
</script>
</body>
</html>
