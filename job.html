<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>職缺資訊</title>
<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        deepPurple: "#1F1D53", midPurple: "#6B257F", darkPurple: "#4C237C",
        deepBlue: "#053D88", blue: "#01529F", royalBlue: "#2956A8",
        lightPurple: "#A48DCD", nearWhite: "#EDEEF7", circuitCyan: "#28C4FF",
        dateBlockBg: "#7E2AFF", buttonGradStart: "#AC3FFF", buttonGradEnd: "#6A1BCB",
        errorRed: "#ff6b6b", successGreen: "#4ade80",
      },
    },
  },
};
</script>
<style>
:root {
  --deep-purple: #1F1D53; --mid-purple: #6B257F; --dark-purple: #4C237C;
  --deep-blue: #053D88; --blue: #01529F; --royal-blue: #2956A8;
  --light-purple: #A48DCD; --near-white: #EDEEF7; --white: #FFFFFF;
  --bright-cyan: #28C4FF; --button-start: #AC3FFF; --button-end: #6A1BCB;
}
body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--deep-purple); color: var(--white); position: relative; overflow-x: hidden; min-height: 100vh; }
.circuit-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.circuit-line { position: absolute; background-color: var(--dark-purple); box-shadow: 0 0 5px var(--blue); }
.left-gradient { position: fixed; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, var(--deep-blue) 0%, rgba(5, 61, 136, 0) 100%); z-index: 1; pointer-events: none; }
.main-content-area { position: relative; z-index: 10; }
.form-container { position: relative; z-index: 1; background: linear-gradient(135deg, rgba(31, 29, 83, 0.9) 0%, rgba(76, 35, 124, 0.8) 100%); border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px); border: 1px solid rgba(164, 141, 205, 0.18); }
.form-header { background: linear-gradient(90deg, var(--deep-blue), var(--dark-purple)); border-bottom: 2px solid var(--bright-cyan); box-shadow: 0 4px 12px rgba(5, 61, 136, 0.5); }
.form-title { text-shadow: 0 2px 4px var(--mid-purple); }
.submit-btn { background: linear-gradient(135deg, var(--button-start), var(--button-end)); box-shadow: 0 4px 12px rgba(172, 63, 255, 0.3); border-radius: 8px; color: var(--white); font-weight: 500; border: none; cursor: pointer; text-align: center; }
.secondary-btn { background-color: rgba(76, 35, 124, 0.6); border: 1px solid var(--light-purple); color: var(--near-white); border-radius: 8px; font-weight: 500; cursor: pointer; text-align: center; }

select {
  background-color: rgba(31, 29, 83, 0.7) !important;
  border: 1px solid var(--light-purple) !important;
  color: var(--white) !important;
  border-radius: 8px !important;
  appearance: none;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%23a48dcd"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>') !important;
  background-repeat: no-repeat !important;
  background-position: right 0.75rem center !important;
  background-size: 1.2em 1.2em !important;
  padding-right: 2.5rem !important;
}
select option { background-color: var(--dark-purple); color: var(--white); }

.job-card {
  background: rgba(31, 29, 83, 0.65);
  border: 1px solid rgba(164, 141, 205, 0.3);
  border-radius: 12px;
}
.hidden { display: none !important; }
.spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: var(--white); width: 1.25rem; height: 1.25rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<base target="_top">
</head>
<body class="min-h-screen py-8 text-lg">
<div class="circuit-background" id="circuitBackground"></div>
<div class="left-gradient"></div>
<div class="main-content-area max-w-3xl mx-auto px-4 space-y-6">

  <!-- 頂部廠商選擇下拉選單區塊 -->
  <div class="form-container p-5 sm:p-7 md:p-9">
    <div class="form-header -mx-5 sm:-mx-7 md:-mx-9 -mt-5 sm:-mt-7 md:-mt-9 mb-6 py-5 px-5 sm:py-6 sm:px-7 md:px-9 rounded-t-lg">
      <h1 class="form-title text-3xl lg:text-4xl font-bold text-center">職缺資訊</h1>
    </div>

    <div class="space-y-3">
      <label for="companySelect" class="block text-lg font-medium text-circuitCyan">請選擇欲瀏覽公司名稱</label>
      <select id="companySelect" class="w-full px-4 py-3 text-lg rounded-lg">
        <option value="" disabled selected>載入廠商清單中...</option>
      </select>
    </div>
  </div>

  <!-- 職缺列表展示區 -->
  <div id="jobListSection" class="form-container p-6 hidden">
    <div class="flex items-center justify-between border-b border-lightPurple/30 pb-3 mb-6">
      <h2 id="currentCompanyName" class="text-2xl font-bold text-circuitCyan">廠商名稱</h2>
      <span id="jobCountBadge" class="px-3 py-1 bg-blue/30 text-white rounded-full text-sm font-bold">0 個職缺</span>
    </div>

    <!-- 職缺卡片清單容器 -->
    <div id="jobCardsContainer" class="space-y-5"></div>
  </div>

</div>

<!-- 背景一鍵預約彈窗 (Modal) -->
<div id="quickBookModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 hidden z-50 backdrop-blur-sm">
  <div class="form-container p-6 rounded-xl shadow-2xl max-w-md w-full mx-auto text-center space-y-5">
    <div id="modalStatusIcon" class="text-4xl font-bold">🎉</div>
    <h3 id="modalTitle" class="text-2xl font-bold text-successGreen">預約面試成功！</h3>
    
    <div class="bg-darkPurple/60 p-4 rounded-xl border border-lightPurple/30 text-left space-y-2 text-base">
      <p class="text-lightPurple text-sm">應徵者：<span id="modalUserName" class="text-white font-bold"></span></p>
      <p class="text-lightPurple text-sm">預約廠商：<span id="modalCompany" class="text-circuitCyan font-bold"></span></p>
      <p class="text-lightPurple text-sm">預約職務：<span id="modalPosition" class="text-yellow-300 font-bold"></span></p>
    </div>

    <p id="modalMsg" class="text-sm text-nearWhite leading-relaxed hidden"></p>

    <div id="modalActions" class="flex flex-col sm:flex-row gap-3 pt-2">
      <button onclick="closeModal()" class="secondary-btn flex-1 py-2.5 text-base font-bold">關閉，繼續看職缺</button>
      <a href="query.html" class="submit-btn flex-1 py-2.5 text-base font-bold inline-block leading-normal">查看預約紀錄</a>
    </div>
  </div>
</div>

<script>
// ⚠️ 1. 「職缺資訊專用 API」網址 (讀取試算表分頁公司與職缺細節)
const JOB_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwKAarqKDv66GCX6pCJNRCtfGgscfsjtTWClVb39zErgppUtgl-I9B3am7lccChHv9F/exec';

// ⚠️ 2. 「預約面試專用 API」網址 (背景直接寫入預約)
const APPT_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzWM4Nw98E3Sjh769GMMv0jrdnnU3aj8NFw44KxSDTNDD3sjt6KLeqWiUenfs0P-yxA/exec';

const LIFF_ID = '2010785535-6BsUuSEy'; 
window.lineUserId = '';

function createCircuitBackground() {
  const circuitBg = document.getElementById('circuitBackground');
  if (!circuitBg) return;
  circuitBg.innerHTML = '';
  const lineCount = Math.floor(window.innerWidth / 100) * 5 + 10;
  for (let i = 0; i < lineCount; i++) {
    const line = document.createElement('div');
    line.className = 'circuit-line';
    line.style.height = `${Math.random() * 1 + 1}px`;
    line.style.width = `${Math.random() * 30 + 10}%`;
    line.style.top = `${Math.random() * 100}%`;
    line.style.left = `${Math.random() * 70}%`;
    line.style.opacity = `${Math.random() * 0.3 + 0.1}`;
    circuitBg.appendChild(line);
  }
}

async function initJobPage() {
  createCircuitBackground();

  // 1. 初始化 LIFF 取得身份
  try {
    if (typeof liff !== 'undefined' && LIFF_ID) {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        if (profile) window.lineUserId = profile.userId;
      }
    }
  } catch (e) { console.warn('LIFF 初始化跳過'); }

  const companySelect = document.getElementById('companySelect');

  // 2. 向 JOB_GAS_API_URL 抓取公司分頁列表
  try {
    const resp = await fetch(`${JOB_GAS_API_URL}?action=getCompanyList`);
    const res = await resp.json();

    let companies = [];
    if (Array.isArray(res)) {
      companies = res;
    } else if (res && Array.isArray(res.data)) {
      companies = res.data;
    } else if (res && Array.isArray(res.companyList)) {
      companies = res.companyList;
    }

    if (companies.length > 0) {
      companySelect.innerHTML = '<option value="" disabled selected>請選擇公司廠商...</option>';
      companies.forEach(comp => {
        const compName = typeof comp === 'string' ? comp : (comp.company || comp.name || '');
        if (compName) {
          const opt = document.createElement('option');
          opt.value = compName;
          opt.innerText = compName;
          companySelect.appendChild(opt);
        }
      });

      // 預設載入第一家公司
      const firstComp = companySelect.options[1] ? companySelect.options[1].value : '';
      if (firstComp) {
        companySelect.value = firstComp;
        loadJobsForCompany(firstComp);
      }
    } else {
      companySelect.innerHTML = '<option value="" disabled>目前尚無廠商資料</option>';
    }
  } catch (err) {
    console.error('Fetch getCompanyList error:', err);
    companySelect.innerHTML = '<option value="" disabled>載入廠商失敗，請重新整理</option>';
  }

  // 下拉選單變動監聽
  companySelect.addEventListener('change', function() {
    if (this.value) loadJobsForCompany(this.value);
  });
}

async function loadJobsForCompany(companyName) {
  const container = document.getElementById('jobCardsContainer');
  document.getElementById('currentCompanyName').innerText = companyName;
  document.getElementById('jobListSection').classList.remove('hidden');

  container.innerHTML = `
    <div class="text-center py-8 text-lightPurple flex items-center justify-center gap-2">
      <span class="spinner"></span>
      <span>正在讀取 ${companyName} 的詳細職缺...</span>
    </div>
  `;

  try {
    const query = new URLSearchParams({ action: 'getJobData', company: companyName }).toString();
    const resp = await fetch(`${JOB_GAS_API_URL}?${query}`);
    const jobs = await resp.json();

    const jobList = Array.isArray(jobs) ? jobs : (jobs.data || []);
    document.getElementById('jobCountBadge').innerText = `${jobList.length} 個職缺`;
    container.innerHTML = '';

    if (jobList.length > 0) {
      jobList.forEach(job => {
        const rawTitle = job.title ? job.title.split('\n')[0] : '';

        const card = document.createElement('div');
        card.className = 'job-card p-5 space-y-3';
        card.innerHTML = `
          <div class="border-b border-lightPurple/20 pb-3">
            <h3 class="text-2xl font-bold text-white whitespace-pre-line leading-snug">${job.title}</h3>
            <div class="mt-2">
              <span class="inline-block text-lg font-bold text-yellow-300 bg-darkPurple/80 px-3 py-1 rounded-lg border border-yellow-300/30">
                💰 ${job.salary || '面議'}
              </span>
            </div>
          </div>

          <div class="space-y-1.5 text-base text-nearWhite pt-1">
            <div><span class="text-lightPurple font-medium">🎓 學經歷：</span>${job.education || '不限'}</div>
            <div><span class="text-lightPurple font-medium">⏰ 工作班別/休假：</span>${job.shift || '依公司規定'}</div>
          </div>

          ${job.description ? `
            <div class="text-sm bg-darkPurple/40 p-3 rounded-lg border border-lightPurple/10 text-gray-200 mt-2">
              <span class="text-lightPurple block font-medium mb-1">📋 工作內容：</span>
              <p class="whitespace-pre-line leading-relaxed">${job.description}</p>
            </div>
          ` : ''}

          <div class="pt-2 text-right">
            <button onclick="handleDirectBooking('${companyName}', '${rawTitle}', this)" class="submit-btn inline-block px-5 py-2.5 text-base font-bold">
              🚀 預約面試本職缺
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    } else {
      container.innerHTML = `<p class="text-center py-6 text-gray-400">目前 ${companyName} 暫無詳細職缺說明。</p>`;
    }
  } catch (err) {
    console.error('Fetch getJobData error:', err);
    container.innerHTML = `<p class="text-center py-6 text-red-400">讀取職缺失敗，請稍後重試。</p>`;
  }
}

// 🌟 免跳轉背景一鍵預約
async function handleDirectBooking(company, position, btnEl) {
  const originalText = btnEl.innerText;
  btnEl.disabled = true;
  btnEl.innerHTML = '預約中... <span class="spinner"></span>';

  let res = { success: false, message: '網路連線失敗' };
  try {
    const params = new URLSearchParams();
    params.append('postData', JSON.stringify({
      action: 'quickBookFromJob',
      lineUserId: window.lineUserId,
      company: company,
      position: position
    }));

    const resp = await fetch(APPT_GAS_API_URL, { method: 'POST', body: params });
    res = await resp.json();
  } catch (err) {
    console.error('Booking Error:', err);
  }

  btnEl.disabled = false;
  btnEl.innerText = originalText;

  const modal = document.getElementById('quickBookModal');
  const modalIcon = document.getElementById('modalStatusIcon');
  const modalTitle = document.getElementById('modalTitle');
  const modalUser = document.getElementById('modalUserName');
  const modalComp = document.getElementById('modalCompany');
  const modalPos = document.getElementById('modalPosition');
  const modalMsg = document.getElementById('modalMsg');
  const modalActions = document.getElementById('modalActions');

  if (res.success) {
    modalIcon.innerText = '🎉';
    modalTitle.className = 'text-2xl font-bold text-successGreen';
    modalTitle.innerText = '預約面試成功！';
    modalUser.innerText = (res.data && res.data.name) ? res.data.name : '求職者';
    modalComp.innerText = company;
    modalPos.innerText = position;
    modalMsg.classList.add('hidden');
    
    modalActions.innerHTML = `
      <button onclick="closeModal()" class="secondary-btn flex-1 py-2.5 text-base font-bold">關閉，繼續看職缺</button>
      <a href="query.html" class="submit-btn flex-1 py-2.5 text-base font-bold inline-block leading-normal">查看預約紀錄</a>
    `;
  } else if (res.needResume) {
    modalIcon.innerText = '⚠️';
    modalTitle.className = 'text-2xl font-bold text-errorRed';
    modalTitle.innerText = '尚未建立個人履歷';
    modalUser.innerText = '未建檔';
    modalComp.innerText = company;
    modalPos.innerText = position;
    modalMsg.innerText = res.message || '請先完成「求職登記表」後，即可直接預約面試！';
    modalMsg.classList.remove('hidden');

    modalActions.innerHTML = `
      <a href="index.html" class="submit-btn flex-1 py-2.5 text-base font-bold inline-block leading-normal">前往填寫求職登記表</a>
      <button onclick="closeModal()" class="secondary-btn flex-1 py-2.5 text-base font-bold">取消</button>
    `;
  } else {
    modalIcon.innerText = '❌';
    modalTitle.className = 'text-2xl font-bold text-errorRed';
    modalTitle.innerText = '預約失敗';
    modalUser.innerText = '未知';
    modalComp.innerText = company;
    modalPos.innerText = position;
    modalMsg.innerText = res.message || '預約失敗，請確認網路連線或重試。';
    modalMsg.classList.remove('hidden');

    modalActions.innerHTML = `
      <button onclick="closeModal()" class="submit-btn w-full py-2.5 text-base font-bold">知道了</button>
    `;
  }

  modal.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('quickBookModal').classList.add('hidden');
}

document.addEventListener('DOMContentLoaded', initJobPage);
</script>
</body>
</html>
