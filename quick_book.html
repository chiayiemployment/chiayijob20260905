<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>快速預約面試</title>
<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        deepPurple: "#1F1D53", midPurple: "#6B257F", darkPurple: "#4C237C",
        deepBlue: "#053D88", blue: "#01529F", royalBlue: "#2956A8",
        lightPurple: "#A48DCD", nearWhite: "#EDEEF7", circuitCyan: "#28C4FF",
        buttonGradStart: "#AC3FFF", buttonGradEnd: "#6A1BCB",
        errorRed: "#ff6b6b", successGreen: "#4ade80",
      },
    },
  },
};
</script>
<style>
:root {
  --deep-purple: #1F1D53; --mid-purple: #6B257F; --dark-purple: #4C237C;
  --deep-blue: #053D88; --blue: #01529F; --royal-blue: #2956A8;
  --light-purple: #A48DCD; --near-white: #EDEEF7; --white: #FFFFFF;
  --bright-cyan: #28C4FF; --button-start: #AC3FFF; --button-end: #6A1BCB;
}
body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--deep-purple); color: var(--white); position: relative; overflow-x: hidden; min-height: 100vh; }
.circuit-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.circuit-line { position: absolute; background-color: var(--dark-purple); box-shadow: 0 0 5px var(--blue); }
.left-gradient { position: fixed; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, var(--deep-blue) 0%, rgba(5, 61, 136, 0) 100%); z-index: 1; pointer-events: none; }
.main-content-area { position: relative; z-index: 10; }
.form-container { position: relative; z-index: 1; background: linear-gradient(135deg, rgba(31, 29, 83, 0.9) 0%, rgba(76, 35, 124, 0.8) 100%); border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px); border: 1px solid rgba(164, 141, 205, 0.18); }
.form-header { background: linear-gradient(90deg, var(--deep-blue), var(--dark-purple)); border-bottom: 2px solid var(--bright-cyan); box-shadow: 0 4px 12px rgba(5, 61, 136, 0.5); }
.form-title { text-shadow: 0 2px 4px var(--mid-purple); }
.submit-btn { background: linear-gradient(135deg, var(--button-start), var(--button-end)); box-shadow: 0 4px 12px rgba(172, 63, 255, 0.3); border-radius: 8px; color: var(--white); font-weight: 500; border: none; cursor: pointer; text-align: center; }
.secondary-btn { background-color: rgba(76, 35, 124, 0.6); border: 1px solid var(--light-purple); color: var(--near-white); border-radius: 8px; font-weight: 500; cursor: pointer; text-align: center; }
.user-card {
  background: rgba(31, 29, 83, 0.6);
  border: 1px solid rgba(164, 141, 205, 0.3);
  border-radius: 10px;
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: all 0.2s ease;
}
.user-card:hover { border-color: var(--bright-cyan); }
.user-card.active {
  background: rgba(40, 196, 255, 0.2);
  border-color: var(--bright-cyan);
  box-shadow: 0 0 10px rgba(40, 196, 255, 0.4);
}
.hidden { display: none !important; }
.spinner { border: 4px solid rgba(255, 255, 255, 0.2); border-radius: 50%; border-top-color: var(--bright-cyan); width: 3rem; height: 3rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<base target="_top">
</head>
<body class="min-h-screen py-12 text-lg">
<div class="circuit-background" id="circuitBackground"></div>
<div class="left-gradient"></div>
<div class="main-content-area max-w-xl mx-auto px-4">
  <div class="form-container p-6 sm:p-8">
    <div class="form-header -mx-6 sm:-mx-8 -mt-6 sm:-mt-8 mb-6 py-5 px-6 rounded-t-lg">
      <h1 class="form-title text-2xl sm:text-3xl font-bold text-center">快速預約面試</h1>
    </div>
    <!-- 1. 處理中狀態 -->
    <div id="loadingState" class="text-center py-8 space-y-4">
      <div class="spinner"></div>
      <p class="text-xl font-bold text-circuitCyan">⚡ 正在讀取 LINE 身份並比對履歷...</p>
      <p id="targetDetails" class="text-sm text-lightPurple"></p>
    </div>
    <!-- 2. 多人選擇身份介面 -->
    <div id="multiUserSelectState" class="hidden space-y-6 py-2">
      <div class="text-center">
        <h3 class="text-xl font-bold text-circuitCyan">偵測到此帳號有多筆履歷登記</h3>
        <p class="text-sm text-lightPurple mt-1">請點選要預約面試的求職者身份：</p>
      </div>
      <div id="userCardsList" class="space-y-3"></div>
      <div class="pt-2">
        <button id="confirmSelectBtn" onclick="submitSelectedUserBooking()" class="submit-btn w-full py-3 text-lg font-bold">
          確認以選取身份預約
        </button>
      </div>
    </div>
    <!-- 3. 預約成功畫面 -->
    <div id="successState" class="hidden text-center space-y-6 py-4">
      <div id="successTitle" class="text-3xl sm:text-4xl font-bold text-successGreen">🎉 預約面試成功！</div>
      
      <div class="bg-darkPurple/60 p-5 rounded-xl border border-lightPurple/30 text-left space-y-3">
        <p class="text-lightPurple text-sm">應徵者：<span id="resUserName" class="text-white font-bold text-lg"></span></p>
        <div class="border-t border-lightPurple/20 pt-2">
          <p class="text-sm text-lightPurple">預約廠商：</p>
          <p id="resCompany" class="text-xl font-bold text-circuitCyan"></p>
        </div>
        <div>
          <p class="text-sm text-lightPurple">預約職務：</p>
          <p id="resPosition" class="text-lg font-bold text-yellow-300"></p>
        </div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <a href="job.html" class="secondary-btn flex-1 py-3 text-base font-bold">💼 繼續瀏覽其他職缺</a>
        <a href="query.html" class="submit-btn flex-1 py-3 text-base font-bold">🔍 查看我的預約紀錄</a>
      </div>
    </div>
    <!-- 4. 未填寫履歷/失敗畫面 -->
    <div id="errorState" class="hidden text-center space-y-6 py-4">
      <div class="text-3xl font-bold text-errorRed">⚠️ 無法完成預約</div>
      <p id="errorMessage" class="text-lg text-nearWhite leading-relaxed"></p>
      <div id="errorActions" class="pt-2">
        <a id="errorPrimaryBtn" href="index.html" class="submit-btn inline-block px-8 py-3 text-lg font-bold">前往填寫求職登記表</a>
      </div>
    </div>
  </div>
</div>
<script>
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxBH_q4x0ilf6X3MmouDqsDSYROuSu9RoOPqwU3C0sxTVadGu6gVUR-kCahmMR11597NA/exec';
const LIFF_ID = '2010785535-qIFwOa8w';
window.targetCompany = '';
window.targetPosition = '';
window.lineUserId = '';
window.selectedProfile = null;
window.userProfilesList = [];

function createCircuitBackground() {
  const circuitBg = document.getElementById('circuitBackground');
  if (!circuitBg) return;
  circuitBg.innerHTML = '';
  for (let i = 0; i < 15; i++) {
    const line = document.createElement('div');
    line.className = 'circuit-line';
    line.style.height = '2px';
    line.style.width = `${Math.random() * 30 + 10}%`;
    line.style.top = `${Math.random() * 100}%`;
    line.style.left = `${Math.random() * 70}%`;
    circuitBg.appendChild(line);
  }
}

async function startQuickBook() {
  createCircuitBackground();
  const urlParams = new URLSearchParams(window.location.search);
  window.targetCompany = urlParams.get('company') || '';
  window.targetPosition = urlParams.get('position') || '';
  let uid = urlParams.get('uid') || '';
  
  if (!window.targetCompany || !window.targetPosition) {
    showError('預約參數不完整，請回到職缺頁面重新選擇。', false);
    return;
  }
  document.getElementById('targetDetails').innerText = `【${window.targetCompany}】 - ${window.targetPosition}`;

  if (!uid) {
    try {
      if (typeof liff !== 'undefined' && LIFF_ID) {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          if (profile) uid = profile.userId;
        }
      }
    } catch (e) { console.warn('LIFF 驗證跳過'); }
  }
  window.lineUserId = uid;
  if (!uid) {
    showError('無法自動取得您的 LINE 身份，請先透過選單開啟。', false);
    return;
  }

  try {
    const resp = await fetch(`${GAS_API_URL}?action=getInitialData&lineUserId=${encodeURIComponent(uid)}`);
    const res = await resp.json();
    const profiles = (res && res.userProfiles) ? res.userProfiles : [];
    if (profiles.length === 0) {
      showError('系統查無您的求職登記履歷。請先完成「求職登記表」填寫後，即可進行預約面試！', true);
    } else if (profiles.length === 1) {
      executeBooking(profiles[0].name, profiles[0].idNumber);
    } else {
      window.userProfilesList = profiles;
      renderUserCards(profiles);
    }
  } catch (err) {
    showError('連線伺服器失敗，請稍後重新嘗試。', false);
  }
}

function renderUserCards(profiles) {
  document.getElementById('loadingState').classList.add('hidden');
  const list = document.getElementById('userCardsList');
  list.innerHTML = '';
  profiles.forEach((p, idx) => {
    const maskedId = p.idNumber ? (p.idNumber.substring(0, 4) + '***') : '';
    const card = document.createElement('div');
    card.className = `user-card ${idx === 0 ? 'active' : ''}`;
    card.onclick = () => selectProfile(p, card);
    card.innerHTML = `
      <div class="flex items-center justify-between">
        <span class="font-bold text-white text-lg">${p.name}</span>
        <span class="text-xs text-circuitCyan border border-circuitCyan/40 px-2 py-0.5 rounded">${maskedId}</span>
      </div>
      <div class="text-xs text-lightPurple mt-1">登記時間: ${p.timestamp}</div>
    `;
    list.appendChild(card);
  });
  window.selectedProfile = profiles[0];
  document.getElementById('multiUserSelectState').classList.remove('hidden');
}

function selectProfile(p, cardEl) {
  document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'));
  if (cardEl) cardEl.classList.add('active');
  window.selectedProfile = p;
}

function submitSelectedUserBooking() {
  if (!window.selectedProfile) return;
  document.getElementById('multiUserSelectState').classList.add('hidden');
  document.getElementById('loadingState').classList.remove('hidden');
  executeBooking(window.selectedProfile.name, window.selectedProfile.idNumber);
}

async function executeBooking(name, idNumber) {
  try {
    const params = new URLSearchParams();
    params.append('postData', JSON.stringify({
      action: 'processFormData',
      appointmentData: {
        name: name,
        idNumber: idNumber,
        companyPositions: [{ company: window.targetCompany, position: window.targetPosition }],
        lineUserId: window.lineUserId
      }
    }));
    const resp = await fetch(GAS_API_URL, { method: 'POST', body: params });
    const res = await resp.json();
    document.getElementById('loadingState').classList.add('hidden');
    if (res.success) {
      document.getElementById('resUserName').innerText = name;
      document.getElementById('resCompany').innerText = window.targetCompany;
      document.getElementById('resPosition').innerText = window.targetPosition;
      
      // 🌟 若為重複預約，顯示提醒標題
      if (res.isDuplicate) {
        document.getElementById('successTitle').innerText = 'ℹ️ 您已預約過此職缺';
        document.getElementById('successTitle').className = 'text-2xl sm:text-3xl font-bold text-yellow-300';
      } else {
        document.getElementById('successTitle').innerText = '🎉 預約面試成功！';
        document.getElementById('successTitle').className = 'text-3xl sm:text-4xl font-bold text-successGreen';
      }

      document.getElementById('successState').classList.remove('hidden');
    } else {
      showError(res.message || '預約失敗，請重試', res.needResume);
    }
  } catch (err) {
    showError('預約過程連線失敗，請稍後重試', false);
  }
}

function showError(msg, needResume) {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('errorMessage').innerText = msg;
  const actionsEl = document.getElementById('errorActions');
  if (needResume) {
    actionsEl.innerHTML = `<a href="index.html" class="submit-btn inline-block px-8 py-3 text-lg font-bold">前往填寫求職登記表</a>`;
  } else {
    actionsEl.innerHTML = `<a href="job.html" class="secondary-btn inline-block px-8 py-3 text-lg font-bold">返回職缺清單</a>`;
  }
  document.getElementById('errorState').classList.remove('hidden');
}

document.addEventListener('DOMContentLoaded', startQuickBook);
</script>
</body>
</html>
