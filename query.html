<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>個人履歷與紀錄查詢</title>
<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        deepPurple: "#1F1D53", midPurple: "#6B257F", darkPurple: "#4C237C",
        deepBlue: "#053D88", blue: "#01529F", royalBlue: "#2956A8",
        lightPurple: "#A48DCD", nearWhite: "#EDEEF7", circuitCyan: "#28C4FF",
        buttonGradStart: "#AC3FFF", buttonGradEnd: "#6A1BCB",
        errorRed: "#ff6b6b", successGreen: "#4ade80",
      },
    },
  },
};
</script>
<style>
:root {
  --deep-purple: #1F1D53; --mid-purple: #6B257F; --dark-purple: #4C237C;
  --deep-blue: #053D88; --blue: #01529F; --royal-blue: #2956A8;
  --light-purple: #A48DCD; --near-white: #EDEEF7; --white: #FFFFFF;
  --bright-cyan: #28C4FF; --button-start: #AC3FFF; --button-end: #6A1BCB;
}
body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--deep-purple); color: var(--white); position: relative; overflow-x: hidden; min-height: 100vh; }
.circuit-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.circuit-line { position: absolute; background-color: var(--dark-purple); box-shadow: 0 0 5px var(--blue); }
.left-gradient { position: fixed; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, var(--deep-blue) 0%, rgba(5, 61, 136, 0) 100%); z-index: 1; pointer-events: none; }
.main-content-area { position: relative; z-index: 10; }
.form-container { position: relative; z-index: 1; background: linear-gradient(135deg, rgba(31, 29, 83, 0.9) 0%, rgba(76, 35, 124, 0.8) 100%); border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px); border: 1px solid rgba(164, 141, 205, 0.18); }
.form-header { background: linear-gradient(90deg, var(--deep-blue), var(--dark-purple)); border-bottom: 2px solid var(--bright-cyan); box-shadow: 0 4px 12px rgba(5, 61, 136, 0.5); }
.form-title { text-shadow: 0 2px 4px var(--mid-purple); }
.submit-btn { background: linear-gradient(135deg, var(--button-start), var(--button-end)); box-shadow: 0 4px 12px rgba(172, 63, 255, 0.3); border-radius: 8px; color: var(--white); font-weight: 500; border: none; cursor: pointer; text-align: center; }

.record-card {
  background: rgba(31, 29, 83, 0.65);
  border: 1px solid rgba(164, 141, 205, 0.3);
  border-radius: 12px;
}
.hidden { display: none !important; }
.spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: var(--white); width: 1.5rem; height: 1.5rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<base target="_top">
</head>
<body class="min-h-screen py-8 text-lg">
<div class="circuit-background" id="circuitBackground"></div>
<div class="left-gradient"></div>
<div class="main-content-area max-w-3xl mx-auto px-4 space-y-6">

  <!-- 頂部標題與狀態 -->
  <div class="form-container p-5 sm:p-7 md:p-9">
    <div class="form-header -mx-5 sm:-mx-7 md:-mx-9 -mt-5 sm:-mt-7 md:-mt-9 mb-6 py-5 px-5 sm:py-6 sm:px-7 md:px-9 rounded-t-lg">
      <h1 class="form-title text-3xl lg:text-4xl font-bold text-center">個人履歷與紀錄查詢</h1>
    </div>

    <div id="loadingStatus" class="text-center py-6 text-circuitCyan flex items-center justify-center gap-2 text-lg">
      <span class="spinner"></span>
      <span>正在讀取您的 LINE 身份與資料...</span>
    </div>

    <!-- 查詢結果區域 -->
    <div id="queryResults" class="hidden space-y-8">
      
      <!-- 📄 1. 個人履歷清單區塊 -->
      <div>
        <div class="flex items-center justify-between border-b border-lightPurple/30 pb-2 mb-4">
          <h2 class="text-2xl font-bold text-circuitCyan flex items-center gap-2">
            📄 已填寫履歷紀錄
          </h2>
          <span id="resumeCountBadge" class="px-3 py-1 bg-blue/30 text-white rounded-full text-sm font-bold">0 筆</span>
        </div>
        <div id="resumeContainer" class="space-y-4"></div>
      </div>

      <!-- 📅 2. 預約面試紀錄區塊 -->
      <div>
        <div class="flex items-center justify-between border-b border-lightPurple/30 pb-2 mb-4">
          <h2 class="text-2xl font-bold text-circuitCyan flex items-center gap-2">
            📅 預約面試紀錄
          </h2>
          <span id="apptCountBadge" class="px-3 py-1 bg-blue/30 text-white rounded-full text-sm font-bold">0 筆</span>
        </div>
        <div id="apptContainer" class="space-y-4"></div>
      </div>

    </div>

    <!-- 查無資料/錯誤訊息 -->
    <div id="errorBox" class="hidden text-center py-8 space-y-4">
      <div class="text-4xl">⚠️</div>
      <p id="errorMsgText" class="text-xl text-nearWhite leading-relaxed"></p>
      <div class="pt-2">
        <a href="index.html" class="submit-btn inline-block px-8 py-2.5 text-lg font-bold">前往填寫求職登記表</a>
      </div>
    </div>

  </div>

</div>

<script>
// ⚠️ 請填入您的「紀錄查詢 API」發布後的 Web App 網址
const QUERY_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyXrQjx_KxvbrQDH5pfZYkDZdQFf1sFpqYoV9RBBE3cWov3d7ymcTHBoza5rtH6RU_o3Q/exec'; 
const LIFF_ID = '2010785535-D0SuLqWN'; 

function createCircuitBackground() {
  const circuitBg = document.getElementById('circuitBackground');
  if (!circuitBg) return;
  circuitBg.innerHTML = '';
  const lineCount = Math.floor(window.innerWidth / 100) * 5 + 10;
  for (let i = 0; i < lineCount; i++) {
    const line = document.createElement('div');
    line.className = 'circuit-line';
    line.style.height = `${Math.random() * 1 + 1}px`;
    line.style.width = `${Math.random() * 30 + 10}%`;
    line.style.top = `${Math.random() * 100}%`;
    line.style.left = `${Math.random() * 70}%`;
    line.style.opacity = `${Math.random() * 0.3 + 0.1}`;
    circuitBg.appendChild(line);
  }
}

async function initQueryPage() {
  createCircuitBackground();

  let lineUserId = '';
  try {
    if (typeof liff !== 'undefined' && LIFF_ID) {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        if (profile) lineUserId = profile.userId;
      }
    }
  } catch (e) {
    console.warn('LIFF 驗證跳過:', e);
  }

  if (!lineUserId) {
    showError('無法自動驗證您的 LINE 身份，請確認是否透過 LINE 選單開啟。');
    return;
  }

  try {
    const resp = await fetch(`${QUERY_GAS_API_URL}?action=queryByLineUserId&lineUserId=${encodeURIComponent(lineUserId)}`);
    const res = await resp.json();

    document.getElementById('loadingStatus').classList.add('hidden');

    if (res.success) {
      renderResumes(res.resumes || []);
      renderAppointments(res.appointments || []);
      document.getElementById('queryResults').classList.remove('hidden');
    } else {
      showError(res.message || '查無相關履歷與預約紀錄。');
    }

  } catch (err) {
    console.error('Fetch error:', err);
    showError('連線發生錯誤：' + err.message + '，請確認 GAS API 部署網址是否正確。');
  }
}

function renderResumes(resumes) {
  const container = document.getElementById('resumeContainer');
  document.getElementById('resumeCountBadge').innerText = `${resumes.length} 筆`;
  container.innerHTML = '';

  if (resumes.length > 0) {
    resumes.forEach((r, idx) => {
      const card = document.createElement('div');
      card.className = 'record-card p-5 space-y-3';
      card.innerHTML = `
        <div class="flex justify-between items-center border-b border-lightPurple/20 pb-2">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 text-xs bg-darkPurple text-circuitCyan rounded border border-circuitCyan/30">履歷 #${idx + 1}</span>
            <h3 class="text-xl font-bold text-white">${r.name}</h3>
          </div>
          <span class="text-xs text-lightPurple">登記時間: ${r.timestamp}</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-nearWhite">
          <div><span class="text-lightPurple font-medium">🎂 出生日期：</span>${r.birth || '未填'}</div>
          <div><span class="text-lightPurple font-medium">🪪 身分證/居留證：</span>${r.idNumber || '未填'}</div>
          <div><span class="text-lightPurple font-medium">💍 婚姻狀況：</span>${r.maritalStatus || '未填'}</div>
          <div><span class="text-lightPurple font-medium">🪖 兵役狀況：</span>${r.military || '未填'}</div>
          <div><span class="text-lightPurple font-medium">📱 聯絡電話：</span>${r.phone || '未填'}</div>
          <div><span class="text-lightPurple font-medium">📧 E-mail：</span>${r.email || '未填'}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-medium">🏠 聯絡地址：</span>${r.address || '未填'}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-medium">🎓 最高學歷：</span>${r.education || '未填'} ${r.school ? '- ' + r.school : ''} ${r.department ? '(' + r.department + ')' : ''}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-medium">🚗 駕照種類：</span>${r.license || '未填'}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-medium">💻 電腦能力：</span>${r.computer || '未填'}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-medium">🗣️ 語文能力：</span>${r.language || '未填'}</div>
        </div>

        ${r.experience ? `
          <div class="text-sm bg-darkPurple/40 p-3 rounded-lg border border-lightPurple/10 text-gray-200">
            <span class="text-lightPurple font-medium block mb-1">💼 工作經歷：</span>
            <p class="whitespace-pre-line leading-relaxed">${r.experience}</p>
          </div>
        ` : ''}
      `;
      container.appendChild(card);
    });
  } else {
    container.innerHTML = '<p class="text-center py-4 text-gray-400">目前尚無履歷登記紀錄。</p>';
  }
}

// 🌟 已移除備註欄位顯示
function renderAppointments(appointments) {
  const container = document.getElementById('apptContainer');
  document.getElementById('apptCountBadge').innerText = `${appointments.length} 筆`;
  container.innerHTML = '';

  if (appointments.length > 0) {
    appointments.forEach((a, idx) => {
      const card = document.createElement('div');
      card.className = 'record-card p-5 space-y-2 border-l-4 border-l-circuitCyan';
      card.innerHTML = `
        <div class="flex justify-between items-start border-b border-lightPurple/20 pb-2">
          <div>
            <span class="text-xs text-lightPurple">應徵者：${a.userName} (${a.idNumber})</span>
            <h3 class="text-xl font-bold text-circuitCyan mt-1">${a.company}</h3>
          </div>
          <span class="text-xs text-lightPurple">${a.timestamp}</span>
        </div>

        <div class="text-base text-white pt-1">
          <span class="text-lightPurple font-medium">💼 應徵職務：</span>
          <span class="font-bold text-yellow-300">${a.position}</span>
        </div>
      `;
      container.appendChild(card);
    });
  } else {
    container.innerHTML = '<p class="text-center py-4 text-gray-400">目前尚無面試預約紀錄。</p>';
  }
}

function showError(msg) {
  document.getElementById('loadingStatus').classList.add('hidden');
  document.getElementById('errorMsgText').innerText = msg;
  document.getElementById('errorBox').classList.remove('hidden');
}

document.addEventListener('DOMContentLoaded', initQueryPage);
</script>
</body>
</html>
