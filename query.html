<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>履歷與面試紀錄查詢</title>
<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        deepPurple: "#1F1D53", midPurple: "#6B257F", darkPurple: "#4C237C",
        deepBlue: "#053D88", blue: "#01529F", royalBlue: "#2956A8",
        lightPurple: "#A48DCD", nearWhite: "#EDEEF7", circuitCyan: "#28C4FF",
        buttonGradStart: "#AC3FFF", buttonGradEnd: "#6A1BCB",
        errorRed: "#ff6b6b", successGreen: "#4ade80",
      },
    },
  },
};
</script>
<style>
:root {
  --deep-purple: #1F1D53; --mid-purple: #6B257F; --dark-purple: #4C237C;
  --deep-blue: #053D88; --blue: #01529F; --royal-blue: #2956A8;
  --light-purple: #A48DCD; --near-white: #EDEEF7; --white: #FFFFFF;
  --bright-cyan: #28C4FF; --button-start: #AC3FFF; --button-end: #6A1BCB;
}
body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--deep-purple); color: var(--white); position: relative; overflow-x: hidden; min-height: 100vh; }
.circuit-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.circuit-line { position: absolute; background-color: var(--dark-purple); box-shadow: 0 0 5px var(--blue); }
.left-gradient { position: fixed; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, var(--deep-blue) 0%, rgba(5, 61, 136, 0) 100%); z-index: 1; pointer-events: none; }
.main-content-area { position: relative; z-index: 10; }
.form-container { position: relative; z-index: 1; background: linear-gradient(135deg, rgba(31, 29, 83, 0.9) 0%, rgba(76, 35, 124, 0.8) 100%); border-radius: 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); backdrop-filter: blur(6px); border: 1px solid rgba(164, 141, 205, 0.25); }
.form-header { background: linear-gradient(90deg, var(--deep-blue), var(--dark-purple)); border-bottom: 2px solid var(--bright-cyan); box-shadow: 0 4px 12px rgba(5, 61, 136, 0.5); }
.form-title { text-shadow: 0 2px 4px var(--mid-purple); }
input[type="text"] { background-color: rgba(31, 29, 83, 0.85) !important; border: 1.5px solid var(--light-purple) !important; color: var(--white) !important; border-radius: 10px !important; }
.submit-btn { background: linear-gradient(135deg, var(--button-start), var(--button-end)); box-shadow: 0 4px 14px rgba(172, 63, 255, 0.35); border-radius: 10px; color: var(--white); font-weight: 700; border: none; cursor: pointer; text-align: center; }
.record-card {
  background: rgba(31, 29, 83, 0.7);
  border: 1px solid rgba(164, 141, 205, 0.35);
  border-radius: 14px;
}
.hidden { display: none !important; }
.spinner { border: 3.5px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: var(--white); width: 1.75rem; height: 1.75rem; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<base target="_top">
</head>
<body class="min-h-screen py-6 lg:py-12 text-lg">
<div class="circuit-background" id="circuitBackground"></div>
<div class="left-gradient"></div>
<div class="main-content-area max-w-4xl mx-auto px-4 sm:px-6 space-y-6">

  <div class="form-container p-6 sm:p-8 md:p-10 lg:p-12">
    <!-- 頂部頁面標題 -->
    <div class="form-header -mx-6 sm:-mx-8 md:-mx-10 lg:-mx-12 -mt-6 sm:-mt-8 md:-mt-10 lg:-mt-12 mb-8 py-6 px-6 sm:py-7 md:px-10 rounded-t-2xl">
      <h1 class="form-title text-3xl sm:text-4xl lg:text-5xl font-extrabold text-center tracking-wide">履歷與面試紀錄查詢</h1>
    </div>

    <!-- ⚡ 讀取中提示 -->
    <div id="loadingStatus" class="text-center py-8 text-circuitCyan flex items-center justify-center gap-3 text-xl font-medium">
      <span class="spinner"></span>
      <span>正在識別 LINE 身份並讀取資料...</span>
    </div>

    <!-- 🖥️ 工作人員手動輸入區塊 (大螢幕優化字級與間距) -->
    <div id="manualSearchBox" class="hidden bg-darkPurple/60 p-6 sm:p-8 rounded-2xl border border-lightPurple/40 space-y-5 mb-8">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-lightPurple/20 pb-3 gap-2">
        <span class="text-amber-300 font-bold text-xl sm:text-2xl">網頁查詢模式</span>
        <span class="text-sm sm:text-base font-normal text-purple-200">（請輸入求職者姓名與身分證）</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-base sm:text-lg font-bold text-circuitCyan mb-2">求職者姓名 <span class="text-red-400">*</span></label>
          <input type="text" id="manualName" placeholder="請輸入姓名" class="w-full px-4 py-3 text-lg sm:text-xl rounded-xl focus:outline-none focus:border-amber-300">
        </div>
        <div>
          <label class="block text-base sm:text-lg font-bold text-circuitCyan mb-2">身分證字號 <span class="text-red-400">*</span></label>
          <input type="text" id="manualIdNumber" placeholder="例如：A123456789" maxlength="10" class="w-full px-4 py-3 text-lg sm:text-xl uppercase rounded-xl focus:outline-none focus:border-amber-300">
        </div>
      </div>
      <button onclick="executeManualSearch()" class="submit-btn w-full py-4 text-xl sm:text-2xl font-bold mt-3 hover:opacity-90 transition">
        查詢求職紀錄
      </button>
    </div>

    <!-- 📊 查詢結果區域 (無 Icon，適度放大字體) -->
    <div id="queryResults" class="hidden space-y-10">
      
      <!-- 📄 1. 個人履歷清單區塊 -->
      <div>
        <div class="flex items-center justify-between border-b border-lightPurple/30 pb-3 mb-5">
          <h2 class="text-2xl sm:text-3xl font-extrabold text-circuitCyan">
            已填寫履歷紀錄
          </h2>
          <span id="resumeCountBadge" class="px-4 py-1.5 bg-blue/40 text-white rounded-full text-base font-bold">0 筆</span>
        </div>
        <div id="resumeContainer" class="space-y-5"></div>
      </div>

      <!-- 📅 2. 預約面試紀錄區塊 -->
      <div>
        <div class="flex items-center justify-between border-b border-lightPurple/30 pb-3 mb-5">
          <h2 class="text-2xl sm:text-3xl font-extrabold text-circuitCyan">
            預約面試紀錄
          </h2>
          <span id="apptCountBadge" class="px-4 py-1.5 bg-blue/40 text-white rounded-full text-base font-bold">0 筆</span>
        </div>
        <div id="apptContainer" class="space-y-5"></div>
      </div>

    </div>

    <!-- ⚠️ 查無資料/錯誤訊息 -->
    <div id="errorBox" class="hidden text-center py-10 space-y-5">
      <p id="errorMsgText" class="text-xl sm:text-2xl text-nearWhite leading-relaxed font-bold"></p>
      <div class="pt-3">
        <a href="index.html" class="submit-btn inline-block px-10 py-3.5 text-xl font-bold">前往填寫求職登記表</a>
      </div>
    </div>

  </div>
</div>

<script>
const QUERY_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzRDN9ZCeKxPJzhF9NkcIyG0f1zeYHh3A7IxTFlIF3bPVQUARStAaxq8IHDrK3pwExfHg/exec'; 
const LIFF_ID = '2010785535-D0SuLqWN'; 

function createCircuitBackground() {
  const circuitBg = document.getElementById('circuitBackground');
  if (!circuitBg) return;
  circuitBg.innerHTML = '';
  const lineCount = Math.floor(window.innerWidth / 100) * 5 + 10;
  for (let i = 0; i < lineCount; i++) {
    const line = document.createElement('div');
    line.className = 'circuit-line';
    line.style.height = `${Math.random() * 1 + 1}px`;
    line.style.width = `${Math.random() * 30 + 10}%`;
    line.style.top = `${Math.random() * 100}%`;
    line.style.left = `${Math.random() * 70}%`;
    line.style.opacity = `${Math.random() * 0.3 + 0.1}`;
    circuitBg.appendChild(line);
  }
}

async function initQueryPage() {
  createCircuitBackground();
  let lineUserId = '';
  try {
    if (typeof liff !== 'undefined' && LIFF_ID) {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        if (profile) lineUserId = profile.userId;
      }
    }
  } catch (e) {
    console.warn('LIFF 驗證跳過:', e);
  }

  if (lineUserId) {
    fetchData(`${QUERY_GAS_API_URL}?action=queryByLineUserId&lineUserId=${encodeURIComponent(lineUserId)}`);
  } else {
    document.getElementById('loadingStatus').classList.add('hidden');
    document.getElementById('manualSearchBox').classList.remove('hidden');
  }
}

function executeManualSearch() {
  const name = document.getElementById('manualName').value.trim();
  const idNumber = document.getElementById('manualIdNumber').value.trim().toUpperCase();

  if (!name) {
    alert('請輸入求職者姓名！');
    return;
  }
  if (!idNumber || idNumber.length !== 10) {
    alert('請輸入正確的 10 位身分證字號！');
    return;
  }

  document.getElementById('errorBox').classList.add('hidden');
  document.getElementById('queryResults').classList.add('hidden');
  document.getElementById('loadingStatus').classList.remove('hidden');

  const apiUrl = `${QUERY_GAS_API_URL}?action=queryByNameAndId&name=${encodeURIComponent(name)}&idNumber=${encodeURIComponent(idNumber)}`;
  fetchData(apiUrl);
}

async function fetchData(url) {
  try {
    const resp = await fetch(url);
    const res = await resp.json();
    document.getElementById('loadingStatus').classList.add('hidden');

    if (res.success) {
      document.getElementById('errorBox').classList.add('hidden');
      renderResumes(res.resumes || []);
      renderAppointments(res.appointments || []);
      document.getElementById('queryResults').classList.remove('hidden');
    } else {
      showError(res.message || '查無相關履歷與預約紀錄。');
    }
  } catch (err) {
    console.error('Fetch error:', err);
    showError('連線發生錯誤：' + err.message + '，請確認網路連線與 API 網址是否正確。');
  }
}

function renderResumes(resumes) {
  const container = document.getElementById('resumeContainer');
  document.getElementById('resumeCountBadge').innerText = `${resumes.length} 筆`;
  container.innerHTML = '';
  if (resumes.length > 0) {
    resumes.forEach((r, idx) => {
      const card = document.createElement('div');
      card.className = 'record-card p-6 sm:p-7 space-y-4';
      card.innerHTML = `
        <div class="flex justify-between items-center border-b border-lightPurple/20 pb-3">
          <div class="flex items-center gap-3">
            <span class="px-2.5 py-1 text-sm font-bold bg-darkPurple text-circuitCyan rounded border border-circuitCyan/30">履歷 #${idx + 1}</span>
            <h3 class="text-2xl font-extrabold text-white">${r.name}</h3>
          </div>
          <span class="text-sm text-lightPurple">登記時間: ${r.timestamp}</span>
        </div>
        
        <!-- 放大文字，移除全數 Icon -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-base sm:text-lg text-nearWhite">
          <div><span class="text-lightPurple font-bold">出生日期：</span>${r.birth || '未填'}</div>
          <div><span class="text-lightPurple font-bold">身分證/居留證：</span>${r.idNumber || '未填'}</div>
          <div><span class="text-lightPurple font-bold">婚姻狀況：</span>${r.maritalStatus || '未填'}</div>
          <div><span class="text-lightPurple font-bold">兵役狀況：</span>${r.military || '未填'}</div>
          <div><span class="text-lightPurple font-bold">聯絡電話：</span>${r.phone || '未填'}</div>
          <div><span class="text-lightPurple font-bold">E-mail：</span>${r.email || '未填'}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-bold">聯絡地址：</span>${r.address || '未填'}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-bold">最高學歷：</span>${r.education || '未填'} ${r.school ? '- ' + r.school : ''} ${r.department ? '(' + r.department + ')' : ''}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-bold">駕照種類：</span>${r.license || '未填'}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-bold">電腦能力：</span>${r.computer || '未填'}</div>
          <div class="sm:col-span-2"><span class="text-lightPurple font-bold">語文能力：</span>${r.language || '未填'}</div>
        </div>

        ${r.experience ? `
          <div class="text-base bg-darkPurple/50 p-4 rounded-xl border border-lightPurple/20 text-gray-200">
            <span class="text-lightPurple font-bold block mb-1.5">工作經歷：</span>
            <p class="whitespace-pre-line leading-relaxed">${r.experience}</p>
          </div>
        ` : ''}
      `;
      container.appendChild(card);
    });
  } else {
    container.innerHTML = '<p class="text-center py-6 text-gray-400 text-lg">目前尚無履歷登記紀錄。</p>';
  }
}

function renderAppointments(appointments) {
  const container = document.getElementById('apptContainer');
  document.getElementById('apptCountBadge').innerText = `${appointments.length} 筆`;
  container.innerHTML = '';
  if (appointments.length > 0) {
    appointments.forEach((a, idx) => {
      const card = document.createElement('div');
      card.className = 'record-card p-6 sm:p-7 space-y-3 border-l-4 border-l-circuitCyan';
      card.innerHTML = `
        <div class="flex justify-between items-start border-b border-lightPurple/20 pb-3">
          <div>
            <span class="text-sm text-lightPurple font-medium">應徵者：${a.userName} (${a.idNumber})</span>
            <h3 class="text-2xl font-extrabold text-circuitCyan mt-1">${a.company}</h3>
          </div>
          <span class="text-sm text-lightPurple">${a.timestamp}</span>
        </div>
        <div class="text-lg text-white pt-1">
          <span class="text-lightPurple font-bold">應徵職務：</span>
          <span class="font-extrabold text-yellow-300">${a.position}</span>
        </div>
      `;
      container.appendChild(card);
    });
  } else {
    container.innerHTML = '<p class="text-center py-6 text-gray-400 text-lg">目前尚無面試預約紀錄。</p>';
  }
}

function showError(msg) {
  document.getElementById('loadingStatus').classList.add('hidden');
  document.getElementById('errorMsgText').innerText = msg;
  document.getElementById('errorBox').classList.remove('hidden');
}

document.addEventListener('DOMContentLoaded', initQueryPage);
</script>
</body>
</html>
